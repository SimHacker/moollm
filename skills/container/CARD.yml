# CARD.yml — container
#
# A scope, not a place. Like OpenLaszlo's <node>: grouping without layout.

id: container
name: "Container"
type: [skill, system]
emoji: "📦"
tier: 1

description: |
  A directory with CONTAINER.yml groups what's inside it without being a room you can enter.
  Its defaults:, keyed by what each child is, reach every room, character and object inside;
  its other slots (rules, ambient, events, placement, logistics) describe the scope itself.

file: CONTAINER.yml             # skills/container/CONTAINER.yml is the prototype every CONTAINER.yml inherits

schema:
  name: { type: string, description: "display name for this scope" }
  description: { type: string }
  defaults:
    type: map
    description: "keyed by kind: room, character, object, any interface name lowercased, or the singular of an embedded collection"
  rules: { type: list, items: string, description: "rules that apply within this scope" }
  constraints: { type: list, items: string, description: "what can't happen here" }
  ambient: { type: map, description: "sound, smell, temperature, danger_level" }
  on_enter: { type: string, description: "natural-language expression for entering any child room" }
  on_exit: { type: string }
  placement_rules: { type: list, description: "the place protocol: route incoming items" }
  zones: { type: map }
  chest_mode: { type: string, values: [passive-provider, active-provider, requester, storage, buffer] }

lookup_order:
  - own slots
  - declared parents (inherits:, role*), depth-first
  - defaults: of enclosing containers, nearest first
  - implied skill parents (ROOM.yml -> room)

merge_across_containers:
  maps: deep_merge
  lists: concatenate_nearest_first
  scalars: nearest_wins

implemented_by:
  resolve.py: "skills/prototype/scripts/resolve.py lookup applies defaults:"
  adventure_linter: "recognizes CONTAINER.yml as a scope (no missing-ROOM warning)"
  adventure_compiler: "does not apply defaults: yet"

methods:
  CREATE:
    description: "Write a CONTAINER.yml for a directory that groups things"
    output: yaml
  DEFAULT:
    description: "Add a default for one kind of child and check it reaches them"
    effect: "Edit defaults.<kind>; run resolve.py lookup on a child"
  TRACE:
    description: "Say which container a value came from"
    effect: "resolve.py lookup <object> <slot> --all"

advertisements:
  SHARE-DEFAULTS:
    score: 80
    condition: "Several rooms or objects in one directory should share values"
  GROUP-WITHOUT-PLACE:
    score: 60
    condition: "A directory organizes rooms but isn't somewhere you can go"

related: [room, object, character, adventure, prototype, logistic-container]

credits:
  inspiration:
    - "OpenLaszlo <node> element"
    - "Self prototype delegation"
    - "CSS cascade"
    - "XML namespaces"
