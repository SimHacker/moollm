# GLANCE.yml — container
# 📦 "Grouping without layout."

what: |
  A directory that is a scope, not a place. CONTAINER.yml's defaults: reach every
  room, character and object inside it. Like OpenLaszlo's <node>.

why: |
  - Say once that every maze room is dark
  - Nested regions refine their parents' defaults (CSS cascade)
  - Rules, ambient and events for a region live in one file

when:
  - '"All these rooms share X" → defaults.room'
  - '"Where did this value come from?" → resolve.py lookup --all'
  - '"This directory groups rooms but isn''t a room" → CONTAINER.yml'

tier: 1

shape: |
  name: "The Twisty Maze"
  defaults:
    room:   { lighting: 0, floor: "uneven flagstones" }
    object: { discoverable: true }
  rules: ["Breadcrumbs disappear after 3 turns"]

order: "own → declared parents → container defaults (nearest first) → implied skill"
merge: "maps deep-merge, lists concatenate, scalars nearest wins"
compiler: "adventure compile.py doesn't apply defaults: yet; resolve.py does"

lineage: [OpenLaszlo <node>, CSS cascade, lexical scope]
related: [room, object, adventure, prototype]
