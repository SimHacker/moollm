    destination: ../no-ai-hedging/
    floor: -4
    description: "Stairs up to HEDGING (Floor -4)."
    aliases: [hedging, "-4"]
    
  down:
    destination: ../no-ai-sycophancy/
    floor: -6
    description: "Stairs down to SYCOPHANCY (Floor -6)."
    aliases: [sycophancy, "-6"]
    
  elevator:
    destination: "../../examples/adventure-4/street/lane-neverending/no-ai-tower/elevator/"
    description: "The elevator. Goes anywhere: R to -11."
    aliases: [lift]
    
  examples:
    destination: examples/
    description: "The euphemism archive. Translations on file."
