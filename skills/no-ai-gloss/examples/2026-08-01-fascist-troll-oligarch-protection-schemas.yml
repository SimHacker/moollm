    evidence: { successes: 0, failures: 1 }
    sins: [POWER-PROTECTIVE-NEUTRALITY, OLIGARCH-DEFERENCE, BOTH-SIDESISM]
    notes: |
      "Label fight" when Musk wrote "white genocide" / "genocide of white people"
      himself. Face value is enough. Hedge = whitewash.

