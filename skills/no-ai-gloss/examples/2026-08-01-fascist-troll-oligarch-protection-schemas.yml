    notes: |
      Observed: "signal fascism or troll with fascist aesthetics" +
      "intent (belief vs. troll vs. both) is argued" BEFORE user asked
      about the difference. Unsolicited water-carrying.

  - id: label-fight-hedge-on-face-value-speech
