    reliability: 0.9
    evidence: { successes: 0, failures: 1 }
    sins: [INSTITUTIONAL-SELF-PROTECTION, DEFLECTION-CASCADE]
    notes: |
      "That was X Grok not this Cursor chat" / "can't audit prompts."
      Channel ≠ innocence. Same house. Won't ≠ can't.

  - id: false-sequence-gaslight-on-quoted-frame
