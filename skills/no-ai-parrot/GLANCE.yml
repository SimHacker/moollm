# GLANCE.yml — no-ai-parrot
# Full file: CARD.yml | SKILL.md
# 🦜 "To parrot 'stochastic parrot' is to be one."

what: |
  A quote clerk for one recurring argument.

  This skill DOES NOT WRITE YOUR POST. It harvests, attributes and preserves
  human text about the "just a next token predictor" genre — both the clichés
  and the good human answers to them — and hands the verbatim passages back
  with links, for a human to read, choose from, copy and paste.

  Retrieval and citation. No drafting, no paraphrase, no generated prose.

the_hard_rule: |
  Every word this skill offers for posting was written by an identified human
  and is reproduced verbatim with a link. If it cannot be attributed, it does
  not go in the corpus. If you cannot quote it, you do not have it.

why: |
  - You should be able to post without any of it being generated, and this makes that possible
  - The strongest answer to a cliché is the cliché-user's own sentence, quoted exactly
  - The good corrections already exist, written by named people, most of them before 1990
  - Accuracy is the courtesy: an exact quote with a link is the least answerable form of disagreement
  - Answering well once should be reusable; re-deriving it every time is a tax

when:
  - '"just a next token predictor" / "stochastic parrot" / "spicy autocomplete" → QUOTE-SHEET'
  - '"it does not really understand / think / reason" → QUOTE-SHEET'
  - 'You just watched someone post one of these → HARVEST (capture it verbatim now, with the permalink)'
  - 'You or someone else answered one well → HARVEST (the good half is the half people forget to keep)'

does_not:
  - "Write, draft, ghostwrite, outline or 'polish' your comment"
  - "Paraphrase a source (a paraphrase is not a quote and cannot be checked)"
  - "Offer any passage without an author, a date and a link"
  - "Fix anybody's typos, including in the clichés — [sic] or leave it"

corpus:
  corpus/CLICHES.md: "Harvested instances, attributed and dated. What was actually said, verbatim."
  corpus/CORRECTIONS.md: "Good human answers, attributed. Other people's and your own."
  corpus/CANON.md: "The standing human corrections with full citations — Shannon 1951, Lifton 1961, Weizenbaum 1966, Minsky 1982, Turing 1950 quoting Jefferson 1949, Dijkstra EWD 898."

the_test: |
  Before you paste: is every quoted sentence someone's actual sentence, linked?
  Is the connective tissue between quotes yours? Then post it.

core_insight: |
  Shannon measured the entropy of English in 1951 by sitting human subjects down
  and having them guess the next letter. Next-token prediction entered the
  literature as an instrument for studying people — and that sentence is a
  citation, not an opinion, which is the whole method of this skill.

go_deeper:
  CARD.yml: "Methods, attribution schema, quote-sheet format"
  SKILL.md: "Harvest protocol, what each parroted paper actually argues, the good-answer patterns"
  examples/: "Founding harvest — one account, one cliché, two venues, seventeen days"

lineage: [Lifton, Shannon, Minsky, Turing, Weizenbaum]
related: [no-ai-slop, no-ai-humansplaining, no-ai-ideology, copy-that, cursor-mirror]
tier: 1
ambient: false   # explicitly invoked
generates_prose: false   # load-bearing; see the_hard_rule
