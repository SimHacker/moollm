# CARD.yml — no-ai-parrot
# Interface: what it does, what it needs, what it emits.
# 🦜 The parrot is on the cover of the paper. Nobody reads past the cover.

skill:
  name: no-ai-parrot
  k_line: NO-AI-PARROT
  tagline: "A quote clerk, not a ghostwriter."
  tier: 1
  ambient: false
  generates_prose: false
  brand: no-ai-ideology

  what: |
    Harvests and serves human text about the "just a next token predictor" genre.
    Input is a comment, a thread, or a phrase. Output is a QUOTE SHEET: verbatim
    passages, each with author, date and permalink, grouped by what they are good
    for — for a human to read, pick from, copy and paste into their own post.

  constitution: CONSTITUTION.md   # governing document; supersedes anything below

  what_it_never_does: |
    It does not compose the post. There is no DRAFT method, no REPLY method, and
    adding one would defeat the purpose. The human writes the connective tissue;
    the skill supplies only material that somebody already said and can be checked
    against a link.

  why_that_constraint: |
    Two reasons, and the second is the better one.

    1. Nothing you post is generated, so "this is AI slop" has nothing to land on.
       Every quotable line resolves to a permalink with a human's name on it.
    2. An exact quotation is stronger than any argument you could write about it.
       A person's own sentence, reproduced accurately and linked, is the one form
       of disagreement that cannot be answered by disputing your characterization.

methods:

  QUOTE-SHEET:
    description: "The main method. Assemble candidate quotes for a specific occasion."
    args:
      occasion: "The comment or thread being answered (paste it in)"
      venue: "hacker-news | email | mastodon | blog — routes formatting through copy-that"
      include: "cliches | corrections | canon | all (default all)"
    emits: |
      A sheet of verbatim passages, each with attribution and permalink, grouped
      by function: what they said before, what they said now, what named people
      have already established, and what the good answers looked like.
      NO suggested wording, NO recommended order, NO draft.
    human_step: "You read the sheet, pick what serves your point, and write your own post."

  HARVEST:
    description: "Capture an instance verbatim, while the permalink still works"
    args:
      text: "Exact text, unedited, typos preserved"
      author: "Handle or name as displayed"
      date: "ISO date"
      url: "Permalink to the individual comment, not the thread"
      kind: "cliche | correction | canon"
      venue: "where it was said"
    note: |
      Harvest BOTH halves. The clichés get saved because they sting; the good
      answers get lost because the moment passes. Harvest your own corrections
      too — and other people's, especially when theirs were better than yours.

  ATTRIBUTE:
    description: "Verify a passage before it enters the corpus"
    checks:
      - "Author as displayed, spelled exactly"
      - "Permalink resolves to the individual item"
      - "Text is character-exact, including typos and emphasis markers"
      - "Date recorded"
      - "For papers: author, year, title, venue, pages"
    on_failure: "Reject. An unattributable passage is not evidence, it is a rumor."

  DEREFERENCE:
    description: "What the borrowed phrase's source actually says, in the source's own words"
    args: { phrase: "the cliché" }
    returns: "Citation plus the quotable passage plus the gap between what it argues and how it is used"
    note: "Returns quotations, not summaries. A summary is something you wrote; a quotation is something you found."

  PRESERVE:
    description: "Archive a whole exchange verbatim before it is edited or flagged"
    note: |
      HN comments can be edited for two hours, and can be flagged or killed at any
      time. If you intend to quote it, archive it the same day. cursor-mirror can
      pull an exchange out of your own session transcripts; the HN Algolia API can
      pull it from the source.

  HARVEST-THE-THREAD:
    description: "When a cliché appears, harvest the replies to it as well — not just the offense"
    args: { thread: "url or pasted thread" }
    returns: "The cliché, plus every substantive answer to it, each attributed"
    why: |
      Whoever answered it well did work that evaporates when the thread scrolls
      off. Their sentence is more useful than yours because they are not the one
      who benefits from it. This is how a corpus becomes a coalition: you arrive
      with the accumulated answers of everyone who got there first, crediting
      them by name. (CONSTITUTION.md Article IX.)

  ENLIST-THE-RECORD:
    description: "Assemble a person's own prior instances and the responses those drew, dated"
    args: { author: "handle", phrase: "the recurring cliché" }
    returns: "Chronology of verbatim instances and verbatim replies, with permalinks"
    the_point: |
      Let the record do the work. You are not accusing anyone of repeating
      themselves; you are showing that they did, in their own words, with dates.
      The deterrent is structural — the answer is on file, so the cost of the
      next drive-by falls on the person making it.
    proportionality:
      - "In the thread you are in, about the argument at hand, once"
      - "Never follow a person between threads — that breaks Article IV and forfeits the position"
      - "Quote what was said, never who they are"
      - "Leave the exit open; someone who stops has done the thing you wanted"

  PROMPT-THE-HUMAN:
    description: "The last act. Ask the questions that make the human articulate their own view."
    args: { sheet: "the assembled quote sheet" }
    emits: |
      Questions only. Never a paragraph, never a candidate sentence.
      "Which of these three do you actually want to concede?"
      "What is the one thing you want them to remember in six months?"
      "You have said this before, in your own words — do you still mean it that way?"
    note: "If the human asks for a draft instead, hand them CONSTITUTION.md Article I."

  PREFLIGHT:
    description: "Fact-check a human-written draft before posting. Never style-edit it."
    permitted:
      - "Every quoted passage is verbatim against the source"
      - "Every permalink resolves to the individual item"
      - "No ellipsis removed a qualifier"
      - "No attribution misspells a handle"
      - "Nothing breaks a venue guideline (Article IV)"
    forbidden:
      - "Improving the prose, tightening, making it flow"
      - "Rewriting a clumsy sentence or removing a digression"
    why: "Patina. The unevenness is the signature. CONSTITUTION.md Article VI." 
    checks:
      - "Every quoted sentence is verbatim and linked"
      - "Every non-quoted sentence is yours"
      - "No paraphrase is presented in quotation marks"
      - "Ellipses do not change meaning; omissions do not remove a qualifier"
      - "Attribution names the person as they display it"
    does_not_check: "Whether your argument is any good. That part is yours."

attribution_schema:
  # Every corpus entry carries these. No exceptions.
  author: "handle or name, as displayed"
  date: "ISO"
  venue: "hacker-news | acl | faacct | journal | book | mailing-list"
  url: "permalink to the item, or DOI/archive link for papers"
  verbatim: "the text, unedited"
  kind: "cliche | correction | canon"
  sic: "true when preserving an error, so nobody 'helpfully' fixes it later"

quote_sheet_format:
  # What the human actually receives.
  sections:
    - "WHAT THEY SAID BEFORE — prior instances by the same author, dated, linked"
    - "WHAT THEY SAID NOW — the current comment, verbatim, including any concession in it"
    - "WHAT THE CITED SOURCE ACTUALLY SAYS — quoted passage, full citation"
    - "STANDING CORRECTIONS — the canon, quoted, by named humans with dates"
    - "GOOD ANSWERS ON THE RECORD — how other people answered this well, attributed"
  forbidden_in_sheet:
    - "Suggested opening lines"
    - "Recommended structure"
    - "Any sentence the human could paste without attribution"

the_catalog:
  # Pointers into corpus/CANON.md, which holds the quotable passages.

  next_token_predictor:
    heard_as: "It's just a next token predictor"
    concede_first: "The training objective genuinely is next-token prediction."
    the_gap: "Naming an objective says nothing about what the optimization produces."
    the_mechanism: "Prediction under constraint is compression, and compression forces structure. Emergent capability is not a side effect of predicting well — it is a technique for it."
    quotable_reversal: "Shannon 1951 — human subjects guessing the next letter of English to measure entropy. See corpus/CANON.md."
    counter_metaphor: "MacKay's Dasher — the same prediction as a human-steered prosthesis. 'Writing is navigation in the library of all possible books.' See corpus/CANON.md."

  answer_shaped_string:
    heard_as: "It just extrapolates the statistically most likely answer-shaped string"
    concede_first: "Vivid, and the sharpest phrasing in the family. Say so."
    the_gap: "It describes the output format and is silent about the path taken to it."
    the_move: "Shaped by what path? Computation performed, cases split, sources checked, tools composed, iteration against real feedback — none of those results were known in advance."
    the_test: "Paths are inspectable, so inspect one. Either it is indistinguishable from a human's, or it is distinguishable because it checked more."
    see: "corpus/ARGUMENTS.md"

  stochastic_parrot:
    heard_as: "It's a stochastic parrot"
    source: "Bender, Gebru, McMillan-Major, Shmitchell (2021), FAccT '21"
    what_it_argues: "Cost of scale; corpora too large to document; encoded harm; and that HUMANS over-attribute meaning to fluent text"
    what_it_does_not_argue: "That language models cannot reason"
    the_irony: "Its central worry is that fluency makes people stop thinking. Using the title as a conversation-ender enacts the worry."

  glorified_autocomplete:
    heard_as: "spicy autocomplete / Markov chain on steroids"
    concede_first: "A fixed-context transformer is formally a high-order Markov process. Concede it immediately."
    the_gap: "Order and function class are the entire question."

  does_not_understand:
    heard_as: "It doesn't really understand"
    source: "Searle (1980), Minds, Brains, and Programs, BBS 3(3)"
    note: "Answered in the same issue by the Systems Reply; Searle's own position is that brains cause minds causally, not that machine minds are impossible."

  the_part_they_get_right:
    heard_as: "People are fooled by fluency"
    verdict: "CONFIRMED, and it is the strongest card on that side."
    source: "Weizenbaum (1966), ELIZA, CACM 9(1); and Computer Power and Human Reason (1976)"
    instruction: "Quote it approvingly and early. Conceding a true thing costs nothing."

naming_the_move:
  source: "Lifton (1961), Thought Reform and the Psychology of Totalism, ch. 22"
  quotable: "the most far-reaching and complex of human problems are compressed into brief, highly reductive, definitive-sounding phrases"
  usage: "Quote Lifton and let the reader apply it. Applying it yourself, unquoted, is just a different cliché."

house_rules:
  - "Quote people accurately or not at all, including the people you disagree with."
  - "Concede the true part in their own words before you quote the rest."
  - "Quote their concession too — people usually walk it back themselves in paragraph three."
  - "Do not quote anything a person said about their own health, diagnosis or private life."
  - "No editing for tidiness. [sic] exists for a reason."
  - "Two to four quotes is a post. Ten is a wall nobody reads."

files:
  GLANCE.yml: "Five-line orientation and the hard rule"
  SKILL.md: "Harvest protocol, the good-answer patterns, what each source actually says"
  corpus/PHRASES.md: "The phrase family and the considered defenses of it"
  corpus/CORRECTIONS.md: "Good human answers, attributed, including your own"
  corpus/CANON.md: "Standing citations with the quotable passages"
  corpus/ARGUMENTS.md: "Positions too compressed to paste. Re-argue them; a good re-argument earns a permalink and moves to CORRECTIONS."
  examples/educom-jobs.md: "Persuading a hostile skeptic by demonstration"

related:
  no-ai-slop: "The claim ledger — CONFIRM / DISPUTE / ASK. Conceding first is that rule applied to a cliché."
  no-ai-humansplaining: "Inbound context hygiene; this skill is the third direction — discourse about the model"
  copy-that: "Venue formatting for the human's finished post. HN takes no markdown."
  cursor-mirror: "Pull verbatim exchanges out of your own transcripts to harvest them"
  no-ai-ideology: "The brand warehouse"
