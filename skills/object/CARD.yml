# CARD.yml — object
# The skill's interface for adventure compilation. The prototype object every OBJECT.yml and
# embedded object inherits is OBJECT.yml here; worked objects are in examples/.

id: object
name: "Object"
type: primitive
emoji: "📦"

description: |
  An interactable thing in the adventure world.
  Keys, lamps, chests, furniture — all objects.
  Objects have TAGS for easy filtering in expressions.

# Schema fields for validation
schema:
  required:
    - id
    - name
    - description
  optional:
    - type
    - emoji
    - tags          # Category tags for filtering: ["weapon", "light-source"]
    - examine
    - subtitle
    - takeable
    - container
    - locked
    - hidden        # Hide from player (for prototypes, agents, tasks)
    - contains
    - capacity
    - state         # Initial values here or in the prototype inherited
    - inherits
    - location
    - simulate      # Per-turn update (natural language)
    - methods       # Named behaviors; each entry follows method_schema below
  computed:
    - simulate_js    # Compiled simulation closure
    - simulate_py
    - methods.*.body_js     # Compiled method body, inside the entry
    - methods.*.body_py
    - methods.*.effect_js
    - methods.*.effect_py
    - methods_js     # Older string-form compile target (1:1 name mapping)
    - methods_py
    - advertisements.*.guard_js
    - advertisements.*.guard_py
    - advertisements.*.score_if_js
    - advertisements.*.score_if_py
    - advertisements.*.effect_js
    - advertisements.*.effect_py

# Common tags for categorization
common_tags:
  - weapon         # Swords, bows, etc.
  - food           # Edible items
  - drink          # Potable liquids
  - container      # Can hold other objects
  - light-source   # Lamps, torches, etc.
  - tool           # Useful implements
  - treasure       # Valuable items
  - readable       # Books, scrolls, etc.
  - wearable       # Clothing, armor
  - consumable     # Used up on use
  - magical        # Has magical properties
  - fragile        # Can break
  - heavy          # Hard to carry
  - key            # Opens something

# Advertisement sub-schema
advertisement_schema:
  required:
    - description
  optional:
    - score
    - score_if
    - guard
    - effect
    - params
  computed:
    - score_if_js
    - score_if_py
    - guard_js
    - guard_py
    - effect_js
    - effect_py

# Method schema, concentrated from OBJECT.yml schema: (canonical). Every methods: map in
# objects, prototype files and CARDs. Map form, keyed by name; key: meaning, then default.
# UPPERCASE name = a command a player or model types; lowercase = a code-callable function or protocol step.
# NAME: "prose" means NAME: { body: "prose" }.
method_schema:
  description: { meaning: "what it does, one line", default: null, aliases: [does, summary, doc] }
  signature:   { meaning: "how it is typed or called; starts with the name; LOOK (AT [thing]) or consume_fuel(amount)", default: "{name}", aliases: [syntax, call, invocation] }
  parameters:  { meaning: "map name → prose", default: {}, aliases: [params, args, input] }
  effect:      { meaning: "what changes in the world; compiles to effect_js/effect_py", default: null }
  output:      { meaning: "list from chat, state-change, file", default: [chat] }
  returns:     { meaning: "the value a caller gets back", default: null }
  invoked_by:  { meaning: "roles that may call it: player, npc, self, engine, llm, any, or the skill's own", default: "[player, npc] for UPPERCASE commands, [self, engine] for lowercase functions", aliases: [customers, invoked-by] }
  satisfies:   { meaning: "motive → amount, as in advertisements", default: {} }
  body:        { meaning: "function body in prose; compiles to body_js/body_py", default: null }
  # run order: body_js, else effect_js, else graduated effect keys (say:, set:), else the LLM

# Compilation events this primitive can trigger
compile_events:
  # Simulation loop
  - type: COMPILE_EXPRESSION
    field: simulate
    target_js: simulate_js
    target_py: simulate_py
    expected_type: closure
    description: "Per-turn update closure over ctx"
    
  # Method entries (map form): body and effect compile inside each entry
  - type: COMPILE_EXPRESSION
    field: methods.*.body
    target_js: methods.*.body_js
    target_py: methods.*.body_py
    expected_type: method

  - type: COMPILE_EXPRESSION
    field: methods.*.effect
    target_js: methods.*.effect_js
    target_py: methods.*.effect_py
    expected_type: action

  # String-form methods: what _check_methods compiles today
  - type: COMPILE_METHODS
    field: methods
    target_js: methods_js
    target_py: methods_py
    expected_type: method_map
    description: "1:1 name mapping from natural language to closures"
    
  # Advertisement fields
  - type: COMPILE_EXPRESSION
    field: guard
    target_js: guard_js
    target_py: guard_py
    expected_type: boolean
    
  - type: COMPILE_EXPRESSION
    field: score_if
    target_js: score_if_js
    target_py: score_if_py
    expected_type: boolean
    
  - type: COMPILE_EXPRESSION
    field: effect
    target_js: effect_js
    target_py: effect_py
    expected_type: action
    
# How this maps to runtime classes
runtime:
  python: Object
  javascript: GameObject
  
# Relationships
contained_by: room
can_contain: object

inherits:
  - skills/prototype/   # objects are Self-style prototypes
  
related:
  - advertisement
  - room
  - buff
  - inventory    # Full protocol: skills/inventory/
