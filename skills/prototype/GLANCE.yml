# GLANCE.yml — prototype
# 🧬 "Objects clone from prototypes, not instances from classes."

what: |
  MOOLLM's object model. No classes: an object that lacks a slot asks its parents,
  in order, first match wins. Self's delegation, on a filesystem.

why: |
  - Concrete objects an LLM can read, not abstractions it must imagine
  - "Like this, but different": inherit, then state only the differences
  - Several parents, reassignable ones (role*), and latent ones the model already knows

when:
  - '"Where does this slot come from?" → TRACE (resolve.py lookup --all)'
  - '"Make something like X" → DESIGN'
  - '"Are the parent declarations right?" → LINT'
  - '"How does inheritance work here?" → EXPLAIN'

tier: 1

shape: |
  inherits:
    - skills/animal                    # path
    - EDITH-BUNKER                     # K-line, latent
    - { ref: skills/cat, but: "grumpier" }
  mood*: moods/sleepy                  # named parent, reassignable

implied: "ROOM.yml → room skill (nearest scope); GLANCE/CARD/INDEX → subject* .., then format* view skill"
not_parents: "k_lines, related, see_also, lineage, tags, the containing directory"
catalogs: "PROTOTYPES.yml is a map of clonables; clone = inherits: [FILE#*.id] + differences"
tool: "scripts/resolve.py lookup | parents | lint | stale"

lineage: [David Ungar, Randall Smith (Self 1987), Henry Lieberman (delegation 1986), Pavel Curtis (LambdaMOO), Brendan Eich (JS), Steve Yegge (Wyvern archetypes)]
