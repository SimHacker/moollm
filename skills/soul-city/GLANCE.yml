  tools, objects, plazas, vehicles. Souls and other beings inhabit it.
  Many instances compose.

why: |
  - Place grain reusable across instances
  - Soul ontology in skills/soul; this skill is the city
  - MicropolisCore / WWSFF / adventures compose
  - Cross-game bridges; each game keeps its model

when:
