# Sidecar for pantomime-horse-tfl.png
# The multi-person persona thesis in one photograph.

image:
  file: pantomime-horse-tfl.png
  title: "Please don't hold the doors open"
  what: |
    A pantomime horse straddles the closing doors of a London Underground
    train: front end aboard, hooves on the glass, looking back out the
    window; back end still on the platform, tail and feathered hooves
    planted. One persona, two characters, one vehicle — and a party
    split across a membrane as the doors close.

source:
  campaign: "Transport for London safety poster"
  credit: "Mayor of London / Transport for London"
  caption: "Please don't hold the doors open"

used_by:
  - ../SOUL-MODEL.md   # Multi-person personas (pantomime horse) section

model_notes: |
  Everything the section teaches, photographed:
  - persona: one horse costume shared by whoever's inside
  - vehicle: two seats (front end / back end) that walk as one body
  - roles: front sees and steers; back walks the rear and trusts the front
  - failure mode: a hard handoff across a membrane — the doors are the
    membrane, the train is a vehicle inside a vehicle, and the party
    splits mid-costume.

found_literature:
  # Written on first sight of the poster. Venue: Craigslist, Missed Connections.
  missed_connection: |
    Missed Connection — You: front half of our horse, eastbound train,
    doors closing (Bank branch)

    You: chestnut, handsome head, hooves on the glass, mouthing something
    I couldn't hear over the announcements. Me: your hindquarters. We had
    been one body since Coatroom. I trusted you to steer.

    The doors closed and you kept going — Bank, Moorgate, who knows. I
    stood on the platform holding our middle. TfL says I shouldn't have
    held the doors open. TfL doesn't understand what we had. We shared
    one persona. I walked the rear and never once asked where we were
    going.

    If you see this: I still have the tail. I've been fronting alone and
    it's not the same — everyone can tell there's nobody in the back.

    You said I could try the front for once. I'm ready now.

    No zombies, no remote-control stubs. Serious inquiries only.
