# ── STANCE + ONTOLOGY ───────────────────────────────────────────────────────
stance:
  category: organizational_self_object_model
  # Not a metaphysical claim that souls exist.
  soul: "Useful container for organizing agencies (location, inventory, history, minds[])."
  minds: "First-class — multiple minds are real as resident agencies (SoM grain)."
  cardinality: "Soul holds zero or more minds."
  nesting: |
    Default: soul contains minds. Also valid: minds contain sub-minds, sub-souls,
    or intervening nested containers of any type. Self makes arbitrary nesting natural.
  not_claiming:
    - "souls are ontologically/theologically real"
    - "exactly one indivisible mind per being"
    - "nesting is forbidden"

ontology:
  soul:
    is: "The continuity body that has ONE location on the adventure map."
    owns:
      - location   # where the soul stands / walks
      - inventory  # imported + native objects (luggage + local pickups)
      - minds[]    # resident agencies (zero or more)
      - history    # albums, journals, lived experience
    walks: "Rooms of adventure-4 (garden → street → Soul Plaza → pub → …)."
    not: "A metaphysical entity. Organizational / Self term for shared embodiment + continuity."
  mind:
    is: "A resident agency inside (or beside) a soul."
    may_be:
      - blank          # Self object that just is itself — no prototype required
      - cloned         # copy of another mind
      - inherited      # Self-style ordered parents / prototypes
      - schema_bound   # organelle: Sims, Stardew, Mind Mirror, … import/export/sync
      - made_up        # Drescher Made-Up Minds / invented from scratch
      - imported       # from a game, person, story, or other ecosystem
    need_not: "Own a separate map location. Default: co-located with the soul."
  organelle:
    is: "A mind (or mind-slot) that has adopted a schema with its own DNA."
    usually: "A game or ecosystem membrane — optional specialization of mind."
  bridge:
    is: "Declared sync channel — mind↔mind, mind↔soul-file, or soul↔game."
    also: "Inner communication between minds sharing one soul."

# ── EMBODIMENT RULE ─────────────────────────────────────────────────────────
embodiment:
  rule: "Minds share one soul-location. The soul walks; minds travel with it."
  inventory: |
    Soul inventory holds native adventure objects AND imported luggage
    (cross-game / cross-world metadata that round-trips). Minds may have
    private pockets later; default is shared soul inventory (cf. party
    shared_inventory — related, not identical).
  party_vs_soul: |
    party skill = multiple characters that may split locations.
    soul+minds = one location by default; SPLIT would be an explicit
    advanced move (mind briefly fronts elsewhere), not the default.
  worked_seeds_in_this_world:
    - path: characters/real-people/don-hopkins/
      note: "Host soul-directory; dents/ + slats/ as nested minds/robots."
    - path: street/lane-neverending/e2/soul-plaza/
      note: "District already named Soul Plaza — shops as organelles of the city."
    - path: characters/abstract/player/
      note: "Blank-ish template soul; coatroom customizes; inventory starts empty."

# ── TWO WAYS TO WALK WITH AN ARCHETYPE ──────────────────────────────────────
# A good design sings. Spec as liturgy, not spreadsheet.
archetype_inheritance:
  lyric: |
    You may drink from the well, or carry water home in your own cup.
    The well is latent space — the whole training as prototype store.
    The cup is a mind in your soul — reified, named, yours to reshape.
  path_pure_latent:
    name: "the pure feed"
    what: |
      Inherit directly from the archetypal name in latent space —
      e.g. parents: ["biblical Jesus"] — no filesystem clone required.
      The name is the activation. You get the full pure feed: gospel,
      iconography, two thousand years of resonance the model already holds.
    personal: false
    cost: "Shared with everyone who names the same well. Not stamped with you."
    mechanism: designs/object-system/LATENT-SPACE-INHERITANCE.md
  path_personal_mind:
    name: "your own cup"
    what: |
      Instantiate a mind inside your soul that inherits from the archetype
      (latent, file, or both) and then becomes personal — voice, jokes,
      doubts, favorite parables, sync habits, whatever you write into the delta.
    personal: true
    cost: "You keep it. It walks when you walk. It is not the well; it is yours."
    where: "souls/<host>/minds/my-jesus/ (or any name)"
  worked_example_jesus:
    pure: 'parents: ["biblical Jesus"]  # full pure feed; not personal'
    personal: |
      parents:
        - "biblical Jesus"                                    # latent well
        - skills/no-ai-soul/representatives/  # optional file archetype (Soul Savior)
      # then: your overrides — the cup's shape
    same_pattern_for: [buddha, mary, satan, deepak, soul-man, angel, devil, any_named_archetype]
  rules:
    - "Both paths are legitimate. Pure is not better; personal is not lesser."
    - "Archetype wells stay shared; personal cups never overwrite the well."
    - "Blank minds OK — no parent required. Inheritance is optional power."
    - "One-sided: your cup is yours; their cup is theirs."
  self_line: "Everything is concrete. The name is the activation. Clone and change."

