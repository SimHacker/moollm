# ── JESUS MOUSE — blended soul vs two minds (worked example) ────────────────
jesus_mouse:
  lyric: |
    He named the two biggest American archetypes out loud — Jesus and Mickey —
    and walked as their combination. Everybody already knew the wells.
  his_intention: "Invoke both; embody the combination; inherit from both. (Told Don explicitly.)"
  variation_blended_soul:
    what: "The SOUL inherits Jesus AND Mickey Mouse (+ wizard props) — one body, blended incarnation."
    sketch: |
      parents: ["Jesus", "Mickey Mouse", "Wizard"]
    lived: true
    latent_imports: "https://github.com/SimHacker/WillWrightShowForFood/blob/main/characters/jesus-mouse/sources/latent-imports.md"
  variation_two_minds:
    what: "DIFFERENT: one soul, two minds — Jesus-cup and Mickey-cup that may argue."
    sketch: |
      minds: { jesus-mind: {parents: ["Jesus"]}, mouse-mind: {parents: ["Mickey Mouse"]} }
    lived: false   # valid Self model; not what he performed
  kin_opposite_axis: duckmouse  # pronunciation-only; see differently_architected_examples
  more_ok: "personal cups of Jesus Mouse; latent 'Jesus Mouse' well; blend + shoulders; organelles…"
  memorial_public: "https://github.com/SimHacker/WillWrightShowForFood/tree/main/characters/jesus-mouse"
  memorial_private_mirror: "DonHopkins/characters/jesus-mouse/ (points at WWSFF)"
  story_public: "https://news.ycombinator.com/item?id=34398396"
  see: "SOUL-MODEL.md#differently-architected-examples"

# ── SHOULDERS — angel and devil as co-located minds ─────────────────────────
shoulder_counsel:
  lyric: |
    Left shoulder, right shoulder — two minds, one neck.
    They do not walk the city alone; they ride when you ride.
    At every fork they may speak. You still choose.
  what: |
    The cartoon conscience pair is the canonical worked example of
    MULTIPLE minds sharing one soul-location: angel and devil as resident
    agencies, not separate map pins. Same well/cup choice as any archetype.
  pair:
    angel:
      pure: 'parents: ["shoulder angel", "guardian angel", "cartoon conscience angel"]'
      personal: "minds/my-angel/ — inherits the well; your mercy, your nag, your halo tilt"
      role: "counsel toward care, restraint, long view — whatever YOUR angel means"
    devil:
      pure: 'parents: ["shoulder devil", "cartoon temptation devil", "Mephistophelean whisper"]'
      personal: "minds/my-devil/ — inherits the well; your mischief, your dare, your pitchfork angle"
      role: "counsel toward appetite, risk, short view — whatever YOUR devil means"
  mechanics:
    co_located: true   # share soul location + default inventory
    speak_at: "decision points, Import How… customs, sync conflicts, moral forks, jokes"
    bridge: "optional wire angel↔devil — they may argue; the soul is player-in-the-middle"
    neither_wins_by_default: "AI proposes both voices; player disposes (PITM)."
    may_mute: "Disable either cup; walk with one shoulder, or none."
  not_required: "Blank souls need no shoulders. Optional drama engines."
  kin: [archetype_inheritance, society-of-mind agencies, party without split location]

# ── ORIGINS (inclusive) ─────────────────────────────────────────────────────
origins:
  principle: "Soul City does not police where minds come from."
  ok:
    - game_save_import
    - clone_of_another_mind
    - blank_then_grow
    - inherit_prototypes
    - made_up_from_scratch
    - real_person_persona_import   # one-sided local model; see endosymbiosis
    - community_or_religious_language_as_neighbor_terms  # not ontology
  register_hygiene: |
    Medical/community terms (system, alters, headmates, …) and religious
    terms (soul, incarnation, psychopomp) are welcome NEIGHBOR vocabularies.
    Soul City's own ontology stays: soul / mind / organelle / bridge.

