# CARD.yml — Soul City
# Liminal place prototype

card:
  id: soul-city
  name: Soul City
  type: [skill, world, place, prototype]
  emoji: 🏙️
  tier: 1
  tagline: "Liminal place — rooms, shops, tools, objects; souls walk here."

  description: |
    Place prototype: rooms, roads, shops, tools, objects, plazas, vehicles.
    Souls inhabit with free-form mind graphs (0+ minds) and may bridge to
    characters/personas/minds in other games. Instances supply maps and rails.

  inspiration: |
    Will Wright, Stanford, 26 April 1996 — asked what he was working on, he named DATA
    PORTABILITY first, then demoed an unreleased Dollhouse by loading a SimCity city into it:
    "I want the games to actually be able to have persistent data that can move from one game
    to another." designs/sims/sims-will-wright-microworlds-1996.md

  do_characters_first: |
    Characters are the hydrogen — lightest, most abundant, highest valence, the atom everything
    else binds to. A character is what a player grieves when a game shuts down, and once
    characters move, every other content-atom has something to bind to.

files:
  docs:
    - README.md        # front door — the 1996 story, the map, status
    - SKILL.md
    - GLANCE.yml
    - SOUL-MODEL.md    # ontology: soul / mind / organelle / persona
    - SOUL-MODEL.yml
    - PORTABLE-NPCS.md # world-to-world travel: advertisements, treaties, customs
    - SOUL-BRIDGES.md  # save-file borders: two gates, fork-and-sync, psychopomp
    - CHARACTER-ENDOSYMBIOSIS.md  # membranes, diffusion, exchange rates — where "organelle" comes from
    - SOUVENIRS.md     # universal objects + the album; type is an interpretation of the object
    - GLOSSARY.md      # every borrowed term, KNOWN meaning first, then ours

# ── Souvenirs — the one class of thing that crosses between ANY two games ──
souvenirs:
  doc: SOUVENIRS.md
  guarantee: |
    THE ALBUM IS THE FLOOR. Characters need a save parser, objects an asset pipeline, zones a
    tile map. A photograph and a caption need a screen and a clock. So album import/export is
    guaranteed for any game whatsoever — including one that will never be patched and one whose
    format nobody has reversed.
  degradation:              # robust-first: degrade, never fail
    full_bridge: "round-trip native album pages; provenance = save id + souls in frame + recorded moment"
    photo_mode: "import native captures, export back to its format"
    nothing_at_all: "capture + caption + narrate + publish; provenance = game + timestamp"
  object_model:
    rule: "Every souvenir is an object. Its TYPE is an interpretation of its properties, not another storage format."
    self_describing: true
    inheritance: "multiple, from skills and capabilities — prototype delegation, not a class tree"
    unknown_types: "read the properties, keep every unparsed one, pass it on whole. NEVER drop unknown fields."
  album: "a polymorphic ordered array of typed objects — sequence is the only structure it imposes"
  metadata_floor: dublin-core   # if a field has a DC name, use the DC name
  dc_extensions:
    coverage: "TWO geographies at once — real-world GPS and in-game location, plus in-world time"
    relation: "pointers to souls, objects, places in the scene; the album; the save; the moment cited"
    beyond_dc: [in_game_coordinates, save_id, recorded_moment, souls_present]
  types: [scene, card, post, clip, letter, receipt, place, portrait]
  vocabulary_rule: "A game's own name for its album stays the game's. We uplift; we do not annex."
  implementation: "MicropolisCore soul-angel/SOUL-ALBUM.yml + DVR.yml"

# ── Register — the words are chosen, not decorative. GLOSSARY.md has the full account. ──
register:
  the_act: transmigration        # theology + databases, same word, both meanings prepaid
  not: [import, export]          # file-conversion register (= flatten) and freight register (= property)
  keep_import_export_for: "File menus and actual tonnage"
  statuses:                      # what the destination OWES differs per status
    traveler: "customs, and a way home"
    expat: "residency without naturalizing — this is the organelle case"
    immigrant: "a seat, and value marked to the local market"
    refugee: "asylum. THE COMMON CASE: delisted games, retired servers, locked formats"
    deportee: "ANTI-PATTERN — moved by another's decision, no standing. What 'export' names."
  hydraulic_register: |
    Marked, always. Fluid-by-the-thousand describes what the RECEIVING system can perceive
    (one integer where a crowd should be), never the travelers' nature. Same vocabulary
    institutions use for displaced people — flows, waves, influx — which is the diagnosis.
  two_rules:
    conservation: "Nobody vanishes at the border. The ledger is an audit."
    non_refoulement: "Never return a soul to a world that can no longer hold it."
  honesty_check: "The framing earns its keep by constraining design, not by decorating a file utility."
  ethics:
    - skills/soul/ETHICS.md
    - skills/mind/ETHICS.md
    - skills/character/ETHICS.md
    - skills/room/ETHICS.md
    - skills/vehicle/ETHICS.md
    - skills/incarnation/ETHICS.md
    - skills/representation-ethics/ETHICS.md
  examples:
    - examples/characters/robin/   # worked SOUL-MODEL character, live on disk
  instances:
    - examples/adventure-4/
    - examples/soul-city/
    - https://github.com/SimHacker/MicropolisCore

# ── Bound documents — this skill is the substrate; these are the design + implementation ──
bound:
  moollm_side:   # the object machinery under the soul files, same repo
    object_system: designs/object-system/                       # Self prototypes over the filesystem
    latent:      designs/object-system/LATENT-SPACE-INHERITANCE.md  # inherit from names, not just files
    endosymbiosis: designs/object-system/ENDOSYMBIOSIS.md       # organelles, with live specimens
    sims_designs: designs/sims/sims-design-index.md             # objects, motives, SimAntics as inherited
    specimens:   # characters that are whole games — the proof cross-game souls work
      - examples/adventure-4/characters/fictional/troll/          # Two-Toll: one soul, two game-minds
      - examples/adventure-4/characters/fictional/wumpus-snorax/  # is the game; 1973 BASIC inside him
      - examples/adventure-4/characters/fictional/grue/           # is the game; darkness rule travels
    inspiration: designs/sims/sims-will-wright-microworlds-1996.md

  micropoliscore:  # https://github.com/SimHacker/MicropolisCore
    product:     documentation/designs/soul-city.md              # two-resolution world, zone binding, scope
    hydrogen:    documentation/designs/characters-as-hydrogen.md # why characters first; periodic table
    roadmap:     documentation/designs/soul-city-uplift-roadmap.md  # phases 0-5
    agent_layer: documentation/designs/moollm-microworld-os.md   # Bifrost as cross-resolution sync
    role_sheets: documentation/designs/micropolis-role-sheets.md # the role gate, implemented
    peer_games:  documentation/designs/federation-peer-games.md  # graded roster incl. anti-targets
    afterlife:   documentation/designs/afterlife-soul-bridge.md  # worked hydraulics case
    pet_shop:    documentation/designs/pet-shop-soul-surgery.md  # smallest honest demo: the guinea pig
    field_map:   packages/sims-io/                               # PersonData <-> soul file, TypeScript
    layers:      packages/vitamoo/                               # L0-L4 resource I/O, browser + Node
    media_flow:  apps/screen-angel/MEDIAFLOW.yml                 # events leave by pull graph, not push bus
    modules:     apps/screen-angel/modules/soul-angel/           # SDK, roster, album, DVR, emigration

  vocabulary_mapping: README.md#one-vocabulary-two-repos
  direction: "This skill DEFINES; MicropolisCore IMPLEMENTS and cites. Never restate — link."

# ── Topology — the layout is derived from the connectivity, not chosen for flavor ──
topology:
  shape: island        # bridges leave from edges; bridging many games at once makes a coastline
  becomes: continent   # as more games arrive
  rule: "Distance from the water is generality."
  coast: |
    One port per bridged game. That game's quarter sits behind its port and holds everything
    specific to it: adapters, format tools, its own jargon and quirks. Translation lives here.
  centre: |
    Universal services: editors, generators, albums, shops, GUID registry, provenance, rights,
    distribution. Everything every game's content passes through.
  content_authoring_side: soul-city   # NOT inside the games
  why: |
    A 1996 DOS binary cannot host a modern editor, but it can accept a file. So the tools live
    in the hub and compile DOWN to each destination format.
  known_as_elsewhere:
    software: "ports and adapters / hexagonal architecture — translation at the boundary, domain in the core"
    history: "factory, fondaco, kontor — foreign compounds at the waterfront, host city inland"
  liminality: |
    Van Gennep's three phases ARE the bridge: drain = separation, Soul City = liminal middle,
    squirt = incorporation. And liminal spaces do not stay liminal — build the transit lounge
    expecting it to become the destination.
  marketplace_layer: "WWSFF catalogs/soul-city — object shops, content pipeline, GUID registry, rights"

k-lines:
  activates:
    - SOUL-CITY
    - SOUL-PLAZA
    - CITY-PROTOTYPE
    - LIMINAL-PLACE    # betwixt and between; and it won't stay that way
    - SOUL-BRIDGE      # cross a save-file border: which gate, who is crossing
    - THE-ROLE-GATE    # a named character enters a game with no individuals
    - FORK-AND-SYNC    # both alive, neither is the copy
    - TRANSMIGRATION   # the act, in both its senses
    - ASYLUM           # souls stranded by delisting, retired servers, locked formats
    - THE-MARKETPLACE  # tools, editors, shops — on the Soul City side of the bridge
    - SOUVENIR         # a titled object with a payload; survives customs when skills don't
    - THE-ALBUM        # polymorphic array of typed objects; guaranteed for any game
  related:
    - { ref: soul, relation: "continuity bodies that inhabit the city" }
    - { ref: mind, relation: "agencies on souls; free-form graphs" }
    - { ref: character, relation: "bodies that may host or relate to souls" }
    - { ref: persona, relation: "costumes across games" }
    - { ref: room, relation: "city rooms; framing inherits" }
    - { ref: object, relation: "tools, props, shop wares" }
    - { ref: vehicle, relation: "movable rooms on city roads" }
    - { ref: adventure, relation: "map / loci / exits" }
    - { ref: micropolis, relation: "city-sim product compose" }
    - { ref: incarnation, relation: "souls author architectures" }
    - { ref: party, relation: "multi-soul travel" }
    - { ref: inventory, relation: "pockets on souls" }

invoke_when:
  - "Define or instantiate a Soul City"
  - "Public soul + city ontology entry point"
  - "Compose MicropolisCore with MOOLLM place grain"
  - "Add rooms, shops, tools, roads to a city instance"
  - "Move a character or a population into or out of a shipped game's save file"

methods:
  INSTANTIATE: { signature: "INSTANTIATE soul-city AS [path] (FROM bootstrap|blank)" }
  STATUS:      { signature: "STATUS [city] → map, shops, souls present" }
  COMPOSE:     { signature: "COMPOSE [city] WITH [micropolis|catalog|adventure]" }
  WALK:        { signature: "WALK [soul] IN [city] TO [room|road|plaza|shop]" }
  MEASURE:     { signature: "MEASURE [save] → soul count", doc: SOUL-BRIDGES.md }
  DRAIN:       { signature: "DRAIN [n] SOULS FROM [save] → carried, counted", doc: SOUL-BRIDGES.md }
  SQUIRT:      { signature: "SQUIRT [n] SOULS INTO [save] — evolves existing structure only", doc: SOUL-BRIDGES.md }
  CROSS:       { signature: "CROSS [character] INTO [game] AS [role] — scope is the visa", doc: SOUL-BRIDGES.md }

contains:
  rooms: "skills/room"
  shops_tools: "plazas, workbenches, create·publish·share"
  objects: "skills/object"
  roads_maps: "exits, lanes, coordinates"
  vehicles: "skills/vehicle"
  souls: "inhabitants — skills/soul"

prototype_pattern: |
  skills/soul/          = continuity body (0+ minds; free-form)
  skills/soul-city/     = liminal place (rooms, shops, tools, …)
  instances/            = concrete maps + product overlays
  game organelles       = native models; bridge in

tier: 1
