# CARD.yml — design-sense
# Interface card. Protocol details: SKILL.md. Planning: CAULDRON.md.

id: design-sense
emoji: 👁️
tagline: "The working designer's head, always on"
type: ambient-socket
registries: [lenses, methods, masters, seeds]

advertisements:
  LOAD-LENSES:
    trigger: "designing or critiquing any interactive surface (menu, HUD, gesture, dialog, sim UI)"
    score_hint: high
  LOAD-METHODS:
    trigger: "planning or pacing design work over time (when to tune, when to abstract)"
    score_hint: high
  LOAD-MASTER:
    trigger: "channel a named designer's judgment"
    score_hint: medium
  PLANT-SEED:
    trigger: "encountered a quotable design principle worth keeping"
    score_hint: medium

methods:
  LOAD-LENSES:
    description: "Read lenses/*.md relevant to the surface at hand; hold them while working"
    note: "Lenses are constraints, not steps. They veto and redirect; they don't sequence."
    dispatch: "lenses/CARD.yml maps design contexts to lens sets"
  LOAD-METHODS:
    description: "Read methods/*.md relevant to the phase of work"
    dispatch: "methods/CARD.yml maps phases of work to method sets"
  LOAD-MASTER:
    description: "Read masters/<person>.md; borrow the head — votes push, vetoes block"
    dispatch: "masters/CARD.yml maps problems to people; load several for a committee"
  PLANT-SEED:
    description: "Append raw principle to today's seeds/ batch file under Todo, with source and attribution"
  GERMINATE:
    description: "Ground it in a corpus source, name it (kebab-case), write the registry .md,
           move the seed line from Todo to Planted with a link to the grown file"
    gate: "A seed graduates only if a working designer would keep it loaded — not trivia"

plugin_schema:
  # All plugins are Markdown (.md) — human-readable first, k-lineable names, working links.
  lens_or_method_file:
    header: "name (H1), class, attribution; dispatch line if it points at a whole moollm skill"
    statement: "one bold blockquote line; the loadable form"
    body: "mechanism, consequences, exhibits from the corpus"
    go_deeper: "external links — Wikipedia, founding papers, primary articles"
    sources: "working links: relative paths in-repo, GitHub URLs cross-repo"
    see: "kin plugins and masters, linked"
  master_file:
    header: "name (H1), class, head (2-3 idea core); dispatch line if a whole skill exists"
    votes: "bulleted positive imperatives, each linked to plugins/sources that cash it"
    vetoes: "the lines this head won't cross"
    plugins_attributed: "lenses/methods this master grounds, linked"
    sources: "primary works + corpus locations, all working links"

related: [copy-that, cauldron, play-learn-lift, simulator-effect, procedural-rhetoric, k-lines]
