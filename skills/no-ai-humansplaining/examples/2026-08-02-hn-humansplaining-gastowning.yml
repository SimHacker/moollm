context: |
  tosh benchmarked harnesses and observed that injected context which "sounds
  useful" oversteers the model, visible in traces; even a file-path hint in a
  system prompt pulls in tokens the task did not need. This reply names the
  phenomenon, gives the design discipline, and cites the Minsky trail.

prior_art: |
  "Humansplaining" turned out to be prepaid, which proves the thesis on the
  word itself. Michels & Hirvonen, "Humansplaining: is it a thing? Is it
  bad?", AI & Society 40(7):5633-5635 (2025), defines it as a human's act of
  unnecessarily and unjustly explaining something to an AI agent who is an
  expert on that topic. https://philarchive.org/rec/MICHII
  Earlier human-to-human uses: WSJ "Actually, the Problem Is 'Humansplaining'"
  (2019); Star Trek/Star Wars fandom (humans lecturing aliens). Adoption
  beats coinage: the K-line was already installed.

new_insights_captured:
  harnesses_humansplain: |
    Not just humans: harnesses humansplain to the model on the user's behalf.
    System prompts teaching a frontier model what grep does. The benchmark
    table is the price tag.
  wikipedia_urls_are_k_lines: |
    Every Wikipedia page is in the training data, associated with its URL.
    Citing the URL activates the article without pasting it.
  slop_and_humansplaining_are_k_lines: |
    Both already latent; humansplaining has a double activation path since
    "mansplaining" is latent too. Spell a novel term once, then point.
  adopt_som_dont_just_invoke_it: |
    Society of Mind is the K-line for "agents". Minsky's agents are colocated
    in one mind. One-agent-per-process architectures invert the book they are
    named after. Colocate agents in one context.
  gastowning: |
    The one deliberate coinage: gaslighting the model and the humans at once,
    in the style of Gas Town. Licensed because gaslighting x Gas Town are
    both latent prototypes; the word decompresses on sight.
  tokenmaxing: |
    Rolling coal in a datacenter: token burn as conspicuous consumption,
    the smoke is the product. Self-licensing via the latent -maxing suffix
    (minmaxing, looksmaxing) plus Veblen and rolling coal.

