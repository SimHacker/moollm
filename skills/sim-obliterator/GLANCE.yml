# GLANCE.yml — sim-obliterator
# ⚠️ RETIRED. Do not invoke. Do not link from front doors.

status: retired
retired_because: "Shells out to a Python sister repo that has been rewritten in TypeScript; vocabulary superseded"
superseded_by:
  protocol: skills/soul-city/SOUL-BRIDGES.md        # two gates, conservation, fork-and-sync
  vocabulary: skills/soul-city/GLOSSARY.md          # transmigration, not import/export
  field_mapping: "MicropolisCore packages/sims-io"  # PersonData <-> soul file, in TypeScript
  resource_layers: "MicropolisCore packages/vitamoo"
  build: "MicropolisCore documentation/designs/soul-city-uplift-roadmap.md"
forwarding_table: designs/sim-obliterator/README.md  # every old doc mapped to its current home

what: |
  RETIRED: two-way bridge between The Sims 1 save files and MOOLLM, via a Python
  sister repo. Kept for provenance. Start at skills/soul-city/README.md instead.

why: |
  - UPLIFT: Sims save → CHARACTER.yml with LLM enrichment
  - DOWNLOAD: CHARACTER.yml → write back to Sims save
  - INSPECT: Read-only exploration of save files
  - Perfect Sims compatibility via the sims: block

when:
  - "Have a Sims 1 save file: SETUP then INSPECT"
  - "Want to talk to your old Sims: UPLIFT"
  - "Want to send a MOOLLM character into the game: DOWNLOAD"

methods:
  SETUP: "Clone SimObliterator, create venv, verify"
  INSPECT: "Read-only: list families, characters, objects"
  UPLIFT: "Save file character → CHARACTER.yml"
  DOWNLOAD: "CHARACTER.yml → save file"

requires: [read_file, write_file, run_terminal_cmd]
tier: 2
