# GLANCE.yml — mount
# Full file: CARD.yml (1404 lines!) | SKILL.md
# 🎭 "NFS-style: overlay skills / compose virtual trees"

what: |
  Mount like NFS — attach a skill (or skill pack) onto a directory,
  character, or room; compose virtual trees of GitHub repo slices.
  GRANT (positive) or AFFLICT (negative). Zones, lifecycle containers.

  NOT riding a horse. Movable inhabitables → skills/vehicle (EMBARK/RIDE).

why: |
  - Overlay skills on characters and rooms
  - Compose virtual trees from repo slices
  - Package activities/events/processes
  - Keep "mount" = filesystem/NFS metaphor

when:
  - '"Change character behavior" → MOUNT skill'
  - '"Create room zone" → mount on room'
  - '"Wire repo slice into tree" → mount virtual path'
  - '"Release effect" → UNMOUNT'
  - '"Get on a horse / drive an RV" → skills/vehicle (not this)'

modes:
  GRANT: "Character gains capabilities"
  AFFLICT: "Character suffers constraints"

mount_types:
  skill_overlay: "Modify via skill"
  activity: "Structured with lifecycle"
  event: "Time-bounded happening"
  process: "Multi-step procedure"
  zone: "Environmental effect"

methods:
  MOUNT: "Attach skill to target"
  UNMOUNT: "Remove mounted skill"
  LIST_MOUNTS: "Show what's mounted"
  COMPATIBILITY: "Check before mounting"

compatibility_warnings: |
  CATASTROPHIC: 'PEE-WEE + no-ai-joking → Identity death'
  ENHANCED: 'ZUCKERBERG + no-ai-soul → Perfect fit'
  IRONIC: 'ROCKY + no-ai-hedging → Nothing to suppress'

inheritance_cascade: |
  World → Region → Room → Furniture → Items → Character
  Later overrides earlier.

cure_protocol: |
  The cure is MEMORY.
  UNMOUNT, narrative intervention, or ironic reclamation.
  (SPREADSHEET as secret word)

character_as_skill_pack: |
  Mix skills from different characters:
  minsky/deep-thinking + pee-wee/exuberance + picard/tea-ritual

t_shirt: "MOUNT responsibly. UNMOUNT with love."
disambiguation:
  vehicle: "Movable room you inhabit (horse, coach, wagon, TARDIS) — EMBARK/DRIVE, not MOUNT"

related: [buff, character, room, vehicle, incarnation, no-ai-joking, file-system-object]
tier: 1
