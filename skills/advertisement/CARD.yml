# CARD.yml — Advertisement
#
# Objects announce what they can do — The Sims style.
# "Objects don't wait to be used — they announce what's possible."
#
# Advertisements are not just for skills or objects; they can be anywhere:
#   - a room advertises (ROOM.yml), a character advertises (CHARACTER.yml)
#   - a YAML section advertises inline (inventory.magic_sword.advertisements)
#   - a skill CARD advertises when it wants to be loaded
#   - what a skill provides and what it wants are advertisements with parameters and satisfies
#
# An advertisement is a lexically scoped agent: it captures its environment (the directory,
# the object's state), responds to patterns (triggers, situations), and creates side effects
# or just returns a value. The "event" need not be reified: a word in chat, a concept, a
# delegated method, a need state, a message.
#
# The canonical schema is ADVERTISEMENT.yml in this directory (its `schema:` key). The key
# list below is the concentrated copy; lint keeps them in agreement.
#
# See: kernel/constitution-core.md §16, designs/ADVERTISEMENT-AUCTION.md,
#      kernel/ARCHITECTURE.md "Agents All The Way Down", designs/MOO-HERITAGE.md

name: ADVERTISEMENT
type: skill
tags: [moollm, sims, interaction, advertisement, game]
tier: 1
emoji: "📢"
tagline: "Objects don't wait to be used — they announce what's possible."
description: |
  Sims-style interaction: every object, room, character and skill pushes its offers into an
  auction, scored by relevance, and the actor picks. One parameterized advertisement covers
  a manifold of stimulus and response. Prose keys compile to _js/_py; recurring shapes
  graduate to standard keys the engine runs without an LLM.
related:
  - skills/object
  - skills/room
  - skills/character
  - skills/card
  - skills/action-queue
  - skills/needs
  - skills/buff
  - skills/coherence-engine
  - skills/rubric

tools:
  required:
    - read_file   # read object advertisements
    - write_file  # update ad scores and state
    - list_dir    # find objects in a room
  optional: []

# The schema, concentrated. name: meaning. Default.
# An omitted key means its default, so an advertisement states only what is unusual.
schema:                          # a concentrated copy; no id, so linters read the canonical one
  canonical: ADVERTISEMENT.yml#schema
  applies_to: "each entry of an advertisements: map, in any object, room, character or CARD"
  conventions:
    list_of_one: "a bare string where a list is expected is a list of one"
    any_all_not: "a list means any; { all: [...] } every; { not: [...] } none"
    map_keyed_by_name: "advertisements: is a map keyed by name; UPPERCASE = player command; list form with action: is legacy"
    prose_compiles: "score_if, guard, effect are prose and get _js/_py siblings"
  keys:
    # base
    id: "the advertisement's name, written as the map key. Default: the map key"
    description: "what it offers, for menus and models; the LLM performs it when there is no effect or method. Default: none, the name is the label"
    score: "0..100 bid when score_if holds or is absent. Default 50"
    score_if: "prose: the situation in which it wants to be chosen; false bids 0 but stays available; _js may return a number. Default: always"
    guard: "prose: what must be true for it to be offered at all. Default: always available"
    guard_fail: "what an actor hears when the guard refuses. Default: the engine's generic refusal, naming it"
    parameters: "map name → prose of what it needs from actor or context. Default: none"
    effect: "prose: what happens beyond the graduated effect keys. Default: none, the method or the LLM performs it"
    method: "the method that performs it. Default: the method with its name, if any"
    satisfies: "motives on the actor; list = 10 each, map = amounts. Default: none"
    invoked_by: "player | npc | self | any. Default [player, npc]; in a CARD the npc is the model"
    reach: "self | holding | touch | adjacent | near | room | world | user, from the advertiser. Default room"
    # graduated conditions
    requires_tags: "actor carries any of these tags. Default: anyone"
    requires_items: "actor holds all of these, not consumed; { all: [...], consume: true } uses them up. Default: none"
    when_state: "advertiser's state pairs, all match. Default: none"
    when_flags: "world flags, any set. Default: none"
    requires_lighting: "{ min, max } 0..10 inclusive, actor's room. Default: any light"
    cost: "coins actor → advertiser's owner when chosen, and a guard; map for other currencies. Default: free"
    trigger: "words or phrases, any, whole-word, case-insensitive; { phrases, concepts } for LLM-judged concepts. Default: none, score alone"
    # graduated effects
    say: "spoken by the advertiser to its room; {name} templates. Default: none"
    set: "state pairs written on the advertiser. Default: none"
    move_to: "moves the actor, path relative to the advertiser's room. Default: none"
    give: "one of each, advertiser → actor. Default: none"
    take: "one of each, actor → advertiser. Default: none"
    pay: "coins advertiser → actor. Default: none"
    buff: "buffs on the actor. Default: none"
    spawn: "created in the advertiser's room. Default: none"
  aliases:
    # old spellings; lint reports them, migrations rewrite them
    condition: "guard in world objects; score_if in CARDs"
    preconditions: guard
    score-if: score_if
    score_hint: score
    action: id
    name: id
    delegate: "method + parameters"
    params: parameters
    wants: parameters
    motives_satisfied: satisfies
    requires: "requires_tags, when it is a tag list; guard, when it is prose"
    response: say
    result: say
    triggers: trigger
    invoked-by: invoked_by
  ladder: "prose → prose + _js/_py → graduated key; rungs coexist, only prose needs _js"
  extensions: "object-specific keys are YAML Jazz; WillWrightShowForFood schemas/advertisement-dispatch.yml adds dispatch modes, locked ads, reciprocal services"

  # AMBIENT: a skill advertising "keep me in context". An extension, not a separate file.
  ambient:
    shape: "AMBIENT: { score, score_if, scope, resolution }"
    scope: [session, conversation, room, card-only]        # how long it stays
    resolution: [full, summary, sniff, card-only]          # how much of the skill to keep
    orchestrator: |
      Collect AMBIENT advertisements from loaded skills, evaluate score_if against the current
      context, sort by score, load each at its resolution until the context budget runs out,
      refresh on context change (new room, new topic).
    why_in_card: |
      CARD.yml is already the sniffable interface, and hosts like Cursor and Claude Code don't
      run a layered wake-up orchestrator. So AMBIENT lives in the CARD, the hot list pages the
      CARD in, and the model applies it. A separate AMBIENT.yml waits for MOOCO.
    examples:
      always_on: "no-ai-slop — AMBIENT: { score: 100, scope: session, resolution: card-only }"
      conditional: "yaml-jazz — AMBIENT: { score: 90, score_if: \"writing or editing YAML\", scope: conversation, resolution: summary }"

methods:
  SCAN:
    description: "Collect every advertisement within reach of the actor, apply guards, score and sort"
    parameters:
      room: "path to the room; the current room if omitted"
    output: chat
    effect: "read the room's interfaces and objects, merge their advertisements maps, drop failed guards, rank by score after score_if"

  SHOW:
    description: "Display what one object advertises, with defaults filled in"
    parameters:
      object: "object to inspect; the ADVERTISEMENT.yml examples if omitted"
    output: chat
    effect: "list each advertisement with its score, guard, trigger and effect keys"

  SELECT:
    description: "Choose an advertised action and perform it"
    parameters:
      object: "object offering the action"
      action: "advertisement name"
    output: chat + state-change
    effect: "check the guard (say guard_fail if false), pay cost, run graduated effects, then effect or method; may queue more actions"

  EVALUATE:
    description: "Score advertisements against a character's needs"
    parameters:
      character: "character to score for; the player if omitted"
    output: chat
    effect: "weight each bid by the motives it satisfies and the character's current needs; pick among the top N (find-best-N)"

advertisements:
  DISCOVER-ACTIONS:
    score: 90
    score_if: "a new room, or the actor is unsure what to do"
    method: SCAN
  BUILD-OBJECT:
    score: 85
    score_if: "creating an object, room, character or skill that needs advertisements"
    method: SHOW
    effect: "show the ADVERTISEMENT.yml key list and examples; write only what differs from the defaults"
  UNDERSTAND-SIMS:
    score: 75
    score_if: "learning how Sims-style interaction or the auction works"
    method: EVALUATE

sims_insight:
  why_it_worked:
    - "User-created objects: anyone could make new furniture and items"
    - "Expansion packs: drop in new objects with their advertisements"
    - "No code changes: objects self-describe behaviors"
    - "Community created millions of objects"
  moollm_parallel:
    - "YAML files self-describe capabilities"
    - "New skills and objects plug in without changing the core"
    - "The LLM reads descriptions and figures out interactions"
    - "Graduated keys let the engine run them without the LLM"

pie_menu:
  description: "Advertisements map onto pie menus"
  behavior: |
    When the player clicks an object, its advertisements become pie menu slices, sorted by
    score, highest at the center as the default action. Don Hopkins' pie menus: fast access
    to contextually relevant actions.

see_also:
  - ADVERTISEMENT.yml                    # canonical schema and worked examples
  - ../../designs/ADVERTISEMENT-AUCTION.md   # how the winner is picked
  - ../../designs/object-system/SCHEMA.md    # schema file format
  - ../../designs/object-system/CARD-ANALYSIS.md   # the populations this schema unifies

credits:
  inspiration:
    - "Will Wright — The Sims advertisement system"
    - "Don Hopkins — Pie Menus"
  lineage:
    - "The Sims (2000) — original implementation"
    - "HyperCard — objects handle their own events"
