# GLANCE.yml — k-lines (protocol)
# Full file: CARD.yml (88 lines) | SKILL.md
# 📢 "The name activates the tradition."

what: |
  K-lines as semantic activation.
  Saying the name activates a constellation.
  Minsky defined them in "K-Lines: A Theory of Memory"
  (MIT AI Memo 516, 1979; Cognitive Science 4(2), 1980),
  then built Society of Mind (1986) on them.

why: |
  - Names wake knowledge
  - Protocols are capabilities
  - K-REFs point parsimoniously
  - Sister-scripts emit, LLM reads selectively

when:
  - '"Invoke mode/pattern" → INVOKE'
  - '"Create new capability cluster" → DEFINE'
  - '"Point to files" → K-REF'

methods:
  INVOKE: "Activate protocol by name"
  DEFINE: "Create new protocol"
  LIST: "Show available protocols"
  K_REF: "Emit file pointer with metadata"
  SISTER_SCRIPT: "Tool emits K-REFs, LLM reads"

k_ref_format: |
  PATH[:LINE[-END]][#anchor][?search] # TYPE - DESC
  /path/file.txt:42:10-46 # secret 🔴
  /path/screenshot.png # image - Cursor analyzes!

sister_script_pattern: |
  scan → emit pointers → read only what's needed
  Parsimonious context usage.

examples:
  ADVENTURE: "Text adventure patterns"
  YAML_JAZZ: "Flexible YAML patterns"
  PLAY_LEARN_LIFT: "The methodology"
  SPEED_OF_LIGHT: "Multi-turn simulation"

minsky_insight: |
  "When you get an idea and want to remember it, you create
  a K-line for it. When later activated, the K-line induces
  a partial mental state resembling the one that created it."
  (Minsky 1980 abstract — prompt engineering, described in 1979.)

wikipedia_urls_are_k_lines: |
  Every Wikipedia page is in the training data, associated with
  its URL. Citing the URL activates the article without pasting it.

activation_note: |
  K-lines re-bind a whole workable configuration (stance, sub-skills), not only a fact.
  Shared PROTOCOLS/INDEX supply the “culture” that makes a symbol load-bearing.
  Frames = static situation shape; Drescher schemas = causal units; see knowledge-frames, schema-mechanism, schema.

lineage: 'Marvin Minsky — "K-Lines: A Theory of Memory" (AI Memo 516, 1979; Cognitive Science 4(2), 1980); Society of Mind (1986)'
tier: 0
