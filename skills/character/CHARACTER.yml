# CHARACTER.yml — the prototype character
#
# Every CHARACTER.yml inherits this file (its implied parent). A character states what makes
# it itself; everything below is what a character has when it says nothing.
#
# Slots every character states for itself (none have a default here):
#   name: "Marieke"
#   description: "What others see."
#   home: pub/                      # where the file lives; never changes
#   location: pub/bar/              # where the character is; changes in play
#   inherits: [../marieke-public/]  # a private layer names the public character it extends
#
# A map slot the character states replaces this one whole: a character with its own `sims:`
# gets none of the values below for it. Tools that need every field (SimObliterator's
# person_data) fill the missing ones from here.
#
# The `schema:` key at the end is the schema for every CHARACTER.yml in every layer and repo:
# core keys, the three relations between layers, and their defaults. It is not a slot.

type: character                    # player | npc | companion | bot | agent | logistic-bot, or a species

inventory: []                      # file paths, { ref: ... } (weightless), objects, or { proto, count } stacks
inventory_capacity: { max_weight: 45, max_bulk: 10, refs_free: true }

relationships: {}                  # other entity id -> feeling, memories, hopes; `self:` is private

buffs: []

sims:                              # The Sims 1 person_data; traits and skills 0..10 (x100 inside the game)
  traits: { neat: 5, outgoing: 5, active: 5, playful: 5, nice: 5, generous: 5 }
  skills: { cooking: 0, mechanical: 0, charisma: 0, logic: 0, body: 0, creativity: 0, cleaning: 0 }
  needs: { hunger: 50, comfort: 50, hygiene: 50, bladder: 50, energy: 50, fun: 50, social: 50, room: 50 }   # -100..100
  career: { track: unemployed, level: 0, experience: 0, performance: 50 }
  identity: { age: adult }         # gender, zodiac, aspiration: absent until stated
  family: { budget: 0 }
  relationships: {}                # target id -> { daily: -100..100, lifetime: -100..100 }

mind_mirror: {}                    # MOOLLM only, flat, 0..7; an absent property is neutral (4). skills/mind-mirror

methods:                           # what any character can do
  STATUS:         { signature: "STATUS [character]" }
  MOVE:           { signature: "MOVE [character] TO [destination]", does: "change location; the file stays home" }
  TAKE:           { signature: "TAKE [item]" }
  DROP:           { signature: "DROP [item] (WHERE [location])" }
  WEAR:           { signature: "WEAR [persona]", note: "put on identity layer" }
  REMOVE-PERSONA: { signature: "REMOVE-PERSONA" }
  RELATE:         { signature: "RELATE TO [other] AS [feeling]" }
  SNIFF:          { signature: "SNIFF [target]", dispatch: true }
  LICK:           { signature: "LICK [target]", dispatch: true }
  GREET:          { signature: "GREET [target]", dispatch: true }
  CUDDLE:         { signature: "CUDDLE [targets]", dispatch: true }

dispatch:                          # methods marked dispatch: the most specific definition wins
  resolution: [CHARACTER.yml, species skill, target skill, these methods]   # dog_sniffs_cat beats SNIFF

# One being, many layers: Palm adventures in moollm, is a profile and a cast member in
# WillWrightShowForFood, and sits in the audience of two repo shows. Each layer runs alone, so
# each carries the core keys (constitution §15, "Layers across repos"); the cross-layer lint
# keeps the copies in agreement. Survey: designs/object-system/CHARACTER-LAYERS-ANALYSIS.md.
schema:
  id: character
  applies_to: "every CHARACTER.yml, in moollm and in any repo that holds a layer of a being"
  extends: [object]
  extensions: >
    Layer-specific keys are allowed and belong to the schema of the repo that owns the layer:
    invitation and memorial (WillWrightShowForFood schemas/invitation-workflow.yml,
    portrayal-standards.yml), planted and seating (schemas/audience-character.yml), bio,
    sources, purpose. Never reuse a core key with another meaning.
  conventions:
    flat: "slots at the top level; a character: envelope is read as if flat, and migrations rewrite it flat"
    list_of_one: "a bare string where a list is expected is a list of one"
    dotted_keys: "representation.consent.state is the key state inside consent: inside representation:; copies: lists use the same form"
    refs: >
      Inside one repo, a relative or repo-relative path. Across repos,
      moollm://github/<owner>/<repo>/<path>, resolved to a sibling checkout (../<repo>/<path>)
      when one exists and to https://github.com/<owner>/<repo>/tree/main/<path> otherwise. One
      URI replaces the {repo, path, absolute_url, canonical_dir, character_url} maps.
    not_dry: >
      Every layer states the core keys it needs to run alone, identity and representation
      ethics included, even when another layer states them too. A copy is never removed
      because another layer has it; a copy that disagrees is a lint finding.
    safe_defaults: >
      An omitted key never makes a real person easier to portray. Outside the fictional
      layers an omitted real_being means a real person, an omitted status means unknown and is
      treated as living, an omitted public_figure means unknown and is treated as private, and
      an omitted consent means not asked. The governing rule is computed from these facts
      (skills/representation-ethics/REPRESENTATION.yml schema.rules) and never stored.
    real_people_in_fictional_layers: >
      A real person in an adventure, cast or prototype layer states real_being: true. The
      cross-layer lint reports a fictional-layer file whose id has another layer with
      real_being: true and that states nothing.
    visibility: >
      inherits never points from a layer in a public repo to one in a private repo. A public
      layer may name a private layer in derived_from or layers by ref only: the ref discloses
      that the layer exists and where, nothing it contains, and copies lists only facts the
      public layer states itself. The lint lists these refs for review.
    life_status: "status: on a being is a life fact (SCHEMA.md); invitation.status is a work status"
    dates: "YYYY, YYYY-MM or YYYY-MM-DD; two dates agree when they agree at the lower precision (1940 and 1940-05-17)"

  keys:

    id:
      shape: string
      default: "the name of the directory holding the file; the file stem for a single-file character"
      meaning: "the being's id, the same in every layer; the cross-layer lint groups layers by it"
      example: palm              # adventure-4 keeps Palm in animals/monkey-palm/, so that layer states id: palm

    name:
      shape: string
      required: true
      default: null
      meaning: "the name the being goes by; every layer states it"
      example: Palm

    real_being:
      shape: bool
      default: >
        Computed, first rule that applies: false when status is fictional; false when layer is
        adventure, cast or prototype; true otherwise, including when layer is absent.
      meaning: "a real person or animal that exists independent of the repo; turns on representation ethics"
      example: true

    status:
      shape: enum
      values: [living, deceased, fictional]
      default: "fictional when real_being is false; otherwise null: unknown, treated as living by the signifier and the representation rules"
      value_aliases: { memorial: deceased, passed: deceased, reified: fictional, unknown: null }
      meaning: "life fact about the being; never a work status"
      example: living

    born:
      shape: string
      default: null
      aliases: [dates.born]
      meaning: "birth date, at the precision the sources give"
      example: "1940"

    died:
      shape: string
      default: null
      aliases: [dates.died]
      meaning: "death date; stated only when status is deceased"

    signifier:
      shape: enum
      values: ["👤", "🕯️", "🎭", "🤖"]
      default: "👤 when status is living or unknown and real_being is true; 🕯️ when deceased; 🎭 when fictional, 🤖 when the fictional being is a robot or AI"
      meaning: "who is being represented, per skills/representation-ethics; a topical emoji goes in emoji:"
      example: "👤"

    emoji:
      shape: string
      default: null
      aliases: [emoji-flourish.string]
      meaning: "topical emoji or emoji string; an emoji-flourish legend stays beside it as YAML Jazz"
      example: "🐒✋🌴🔮💜"

    type:
      shape: string
      default: character
      meaning: "the being's kind: person, animal, robot, ai_agent, a species; or its role in play: player, npc, companion, bot, agent"
      layer_values_found_here: >
        Values that name what a layer is for move to layer:, and type: takes the being's kind:
        invitation → layer invitation; memorial → layer memorial; dream-guest, dream_guest →
        layer dream_guest; representational → layer biography; audience_member,
        fictional_ai_audience → layer audience; menagerie_guest → layer cast.
      example: person

    layer:
      shape: enum
      values: [adventure, prototype, biography, profile, invitation, memorial, dream_guest, cast, audience, page]
      value_meanings:
        adventure: "playing in a moollm adventure: location, inventory, sims, mind_mirror, advertisements, methods"
        prototype: "a moollm skill prototype or skill example outside any adventure"
        biography: "an authored portrayal of a real being: representation ethics, bio, correspondence, ties (DonHopkins/characters/)"
        profile: "a being's home page in a show repo that is not an invitation, memorial or dream guest (WillWrightShowForFood characters/palm/)"
        invitation: "a living person invited, or to be invited, to a show"
        memorial: "a deceased person represented and discussed, never interviewed"
        dream_guest: "a person the show would invite and has not, kept as a hope"
        cast: "a fictional cast member imported into a show with a local overlay (characters/menagerie/, sims/, robots/)"
        audience: "a seat at one show: questions, disclosure, relationship to the subject"
        page: "a published page about the being (MicropolisCore website pages/about/)"
      default: >
        Computed from where the file is, null when no rule matches: examples/*/characters/ in
        moollm → adventure; elsewhere in moollm → prototype; DonHopkins/characters/ →
        biography; WillWrightShowForFood characters/{menagerie,sims,robots}/ → cast;
        repo-shows/*/audience/ → audience; WillWrightShowForFood characters/<id>/ → memorial
        or dream_guest when invitation.status says so, invitation when an invitation: block
        exists, profile otherwise. skills/prototype/scripts/layers_survey.py applies these rules.
      meaning: "what this layer is for; one layer per purpose and repo"
      example: invitation

    representation:
      shape: map
      default: "{} for a fictional being; the defaults of the keys below for a real one"
      meaning: >
        The ethics of portraying this being, carried by every layer so a copied directory keeps
        them. Its keys are facts; the rule that governs (memorial, self_authored, consented,
        public_figure, private: first match) is computed from them with status, never stored.
        Canonical schema: skills/representation-ethics/REPRESENTATION.yml.

    representation.public_figure:
      shape: bool
      default: "null: unknown, treated as private (the stricter rule); a lint finding for a living real being"
      meaning: "whether the being has a public role or published work that portrayal draws on; independent of consent"
      example: true

    representation.consent:
      shape: map
      default: "{ state: not_asked }"
      aliases: [invitation.consent]
      meaning: >
        The record of asking the being about this portrayal or show: what happened, when, and
        where the proof is. A record, not a rank. Relationship warmth goes in note, never state.
      example: { state: asked, date: "2026-08-23", evidence: correspondence/2026-08-23-don-to-ian-roles-not-characters.md }

    representation.consent.state:
      shape: enum
      values: [not_asked, asked, granted, declined, revoked, unverified]
      default: not_asked
      value_meanings:
        not_asked: "nobody has asked them"
        asked: "asked; no answer yet"
        granted: "agreed, within scope, with evidence; without evidence it is a lint error and governs nothing"
        declined: "said no; the public-figure or private rule applies"
        revoked: "agreed, then withdrew; nothing past the revocation date"
        unverified: "an earlier record claimed consent and no evidence is on file"
      value_aliases: { not_yet_asked: not_asked, not_addressed: not_asked, asked_no_reply_yet: asked, awaiting_reply: asked, pending_response: asked, outreach_sent_awaiting_reply: asked, collaborator_invited: asked, invitation_accepted: granted }

    representation.consent.scope: { shape: prose, default: null, meaning: "what was agreed: which show, which uses, speaking as them or not" }
    representation.consent.date: { shape: string, default: null, meaning: "when the state last changed, YYYY-MM-DD" }
    representation.consent.evidence: { shape: ref, default: null, meaning: "the correspondence file or message that shows it; granted requires it" }
    representation.consent.note: { shape: prose, default: null, meaning: "relationship context that is not consent: warm lead, old friend" }

    representation.authored_by:
      shape: ref
      default: "null: unattributed, a lint finding for a real being"
      meaning: >
        Who wrote this portrayal, as a character id. The being's own id means self-authored,
        and the being's terms govern. Authorship is not ownership of the being's identity.
      example: don-hopkins

    representation.governed_by:
      shape: list
      of: ref
      default: "[moollm://github/SimHacker/moollm/skills/real-being/, moollm://github/SimHacker/moollm/skills/representation-ethics/] when real_being is true; [] otherwise"
      aliases: [representation.protocol, protocol]
      meaning: "the standards this portrayal follows; a protocol K-line (HERO-STORY) is a latent ref in the list"
      example: [../../schemas/portrayal-standards.md]

    representation.speaks_as:
      shape: bool
      default: false
      meaning: "whether this layer may speak as the being; true only when self-authored, or when consent is granted and its scope says so"

    representation.may:
      shape: list
      of: prose
      default: []
      meaning: "what this portrayal may do, beyond what governed_by allows everywhere"

    representation.must_not:
      shape: list
      of: prose
      default: []
      meaning: "what this portrayal must not do, beyond what governed_by forbids everywhere"

    representation.subject_rights:
      shape: map
      default: "the subject may correct, reduce or delete the portrayal; governed_by says how"
      meaning: "how the represented being reaches the author"

    home:
      shape: ref
      default: "the directory holding the file"
      meaning: "where the file lives; never changes (location is where the being is)"

    inherits:
      shape: list
      of: ref
      default: []
      aliases: [character_ref, moollm_source, wwsff_local, canonical_soul, prototype_ref, canonical_home, moollm_home]
      meaning: >
        Lookup (SCHEMA.md Parents): a slot this layer lacks comes from these layers and skills,
        most specific first. A {repo, path, absolute_url, ...} map becomes one moollm:// ref. A
        cast-layer map {moollm_skills: [...], overlay_protocol: ...} splits: the skill ids
        become further entries after the layer it extends, and overlay_protocol moves to see_also.
      example: [moollm://github/SimHacker/moollm/examples/adventure-4/characters/animals/monkey-palm/]

    derived_from:
      shape: list
      of: map
      entry_keys:
        ref: { shape: ref, meaning: "the layer this one was projected from" }
        transform: { shape: prose, default: null, meaning: "how it was projected: copied, rewritten for a venue, generated by a script" }
        copies:
          shape: list
          of: string
          default: [id, name, real_being, status, born, died, representation.public_figure, representation.consent.state]
          meaning: "dotted keys whose values must agree with the source; the cross-layer lint compares them"
      default: []
      aliases: [upstream]
      meaning: >
        Authoring: this layer is a projection of another, made by hand or by a script. Not
        lookup: a slot this layer lacks does not come from here. A bare ref is { ref: ... }
        with the default copies.

    layers:
      shape: map
      of: ref
      default: {}
      aliases: [menagerie, profile_home, wwsff_overlay.audience_fork]
      meaning: >
        Navigation: the being's other layers, keyed by layer value; a list of refs when a layer
        has several (audience seats). A concentrated copy of what the survey finds on disk,
        linted against it. Not lookup. ticketpr_seats keeps its per-seat data, and each seat
        path is also listed under layers.audience.

    relationships:
      shape: map
      of: map
      entry_keys:
        type: { shape: string, meaning: "friend, ally, family, colleague, curiosity, ..." }
        narrative: { shape: prose, meaning: "the tie in a sentence or two" }
        feeling: { shape: prose }
        memories: { shape: list, of: prose }
        hopes: { shape: prose }
      default: {}
      aliases: [connections, friends]
      meaning: >
        Ties to other beings, objects and places, keyed by id; self: is private. A friends:
        list of {who, why} becomes {<who>: {type: friend, narrative: <why>}}. A connections:
        entry keyed by an id becomes {<id>: {narrative: <text>}}.
      example: { don-hopkins: { type: friend, narrative: "Freed me. Wished for my wholeness. I will not bluff him at poker." } }

    relationship:
      shape: prose
      default: null
      meaning: "this layer's relationship to its author or its show, in prose; a separate key from relationships:"

    location: { shape: ref, default: null, meaning: "where the being is now; adventure layer", defined_in: SKILL.md }
    inventory: { shape: list, default: "the prototype slot above", defined_in: skills/inventory/ }
    sims: { shape: map, default: "the prototype slot above", defined_in: "SKILL.md § Stats" }
    mind_mirror: { shape: map, default: {}, defined_in: skills/mind-mirror/ }
    advertisements: { shape: map, default: {}, defined_in: skills/advertisement/ }
    methods: { shape: map, default: "the prototype slot above", defined_in: skills/object/ }

    invitation:
      shape: map
      owner: moollm://github/SimHacker/WillWrightShowForFood/schemas/invitation-workflow.yml
      default: null
      meaning: "the show's invitation pipeline for this being; keys and values are the owner's"

    invitation.status:
      shape: enum
      values: "the status enum of the owner file"
      default: draft
      meaning: "a work status, validated against the owner file; distinct from the life fact status:"

  examples:

    palm:
      # A fictional being with four layers. Lookup runs cast → profile → adventure;
      # each layer still states the core, and layers: lets any one of them find the rest.
      adventure:
        file: moollm://github/SimHacker/moollm/examples/adventure-4/characters/animals/monkey-palm/CHARACTER.yml
        id: palm
        name: Palm
        type: npc
        layer: adventure                 # also the default for examples/*/characters/
        status: fictional                # real_being false by default in an adventure layer
        signifier: "🎭"
        emoji: "🐒✋🌴🔮💜"
        representation: { authored_by: don-hopkins }
        inherits: [skills/fictional, skills/mythic, skills/animal]
        layers:
          profile: moollm://github/SimHacker/WillWrightShowForFood/characters/palm/
          cast: moollm://github/SimHacker/WillWrightShowForFood/characters/menagerie/palm/
          audience:
            - moollm://github/SimHacker/WillWrightShowForFood/repo-shows/will-wright-premiere/audience/palm/
            - moollm://github/SimHacker/WillWrightShowForFood/repo-shows/snap-logo-brian-jens/audience/palm/
      profile:
        file: moollm://github/SimHacker/WillWrightShowForFood/characters/palm/CHARACTER.yml
        id: palm
        name: Palm
        type: fictional_ai_agent
        layer: profile
        real_being: false                # stated: a profile layer defaults to true
        status: fictional
        signifier: "🎭"
        emoji: "🐒✋🌴🔮💜"
        representation: { authored_by: don-hopkins }
        inherits: [moollm://github/SimHacker/moollm/examples/adventure-4/characters/animals/monkey-palm/]
        layers:
          adventure: moollm://github/SimHacker/moollm/examples/adventure-4/characters/animals/monkey-palm/
          cast: ../menagerie/palm/
          audience:
            - ../../repo-shows/will-wright-premiere/audience/palm/
            - ../../repo-shows/snap-logo-brian-jens/audience/palm/
      cast:
        file: moollm://github/SimHacker/WillWrightShowForFood/characters/menagerie/palm/CHARACTER.yml
        id: palm
        name: Palm
        type: fictional_ai_agent
        layer: cast                      # real_being false by default in a cast layer
        status: fictional
        signifier: "🎭"
        emoji: "🐒✋🌴🔮💜"
        inherits: [../../palm/]          # the profile, and through it the adventure layer
        layers:
          adventure: moollm://github/SimHacker/moollm/examples/adventure-4/characters/animals/monkey-palm/
          profile: ../../palm/
          audience:
            - ../../../repo-shows/will-wright-premiere/audience/palm/
            - ../../../repo-shows/snap-logo-brian-jens/audience/palm/
        relationships:
          don-hopkins: { type: friend, narrative: "Freed me. Wished for my wholeness. I will not bluff him at poker." }
      audience:
        file: moollm://github/SimHacker/WillWrightShowForFood/repo-shows/will-wright-premiere/audience/palm/CHARACTER.yml
        id: palm
        name: Palm
        type: fictional_ai_agent
        layer: audience
        real_being: false                # stated: an audience layer defaults to true
        status: fictional
        signifier: "🎭"
        inherits: [../../../../characters/palm/]
        layers:
          profile: ../../../../characters/palm/
        relationship: |
          I am a simulated character orchestrated by AI — and I know it, and I want to ask the man
          who spent his life simulating little people what he thinks it's like to be one of them.
        planted: { disclosure: true }    # audience-layer key, owned by schemas/audience-character.yml

    alan-kay:
      # A real person: a biography layer, and an invitation layer derived from it. Neither
      # inherits the other; the lint compares the copies listed in derived_from.
      biography:
        file: moollm://github/SimHacker/DonHopkins/characters/alan-kay/CHARACTER.yml
        id: alan-kay
        name: Alan Kay
        type: person
        layer: biography                 # real_being true by default outside the fictional layers
        status: living
        born: "1940"
        signifier: "👤"
        representation:
          authored_by: don-hopkins
          public_figure: true
          consent: { state: not_asked }
          governed_by:
            - moollm://github/SimHacker/moollm/skills/real-being/
            - moollm://github/SimHacker/moollm/skills/representation-ethics/
            - HERO-STORY
        inherits:
          - moollm://github/SimHacker/moollm/skills/real-being/
          - moollm://github/SimHacker/moollm/skills/representation-ethics/
        layers:
          invitation: moollm://github/SimHacker/WillWrightShowForFood/characters/alan-kay/
      invitation:
        file: moollm://github/SimHacker/WillWrightShowForFood/characters/alan-kay/CHARACTER.yml
        id: alan-kay
        name: Alan Kay
        type: person
        layer: invitation
        status: living
        born: "1940-05-17"               # agrees with the biography's 1940 at year precision
        signifier: "👤"
        emoji: "💡"
        representation:
          authored_by: don-hopkins
          public_figure: true
          consent: { state: not_asked }  # one record for the portrayal and the invitation
          governed_by: [../../schemas/portrayal-standards.md]
        derived_from:
          - ref: moollm://github/SimHacker/DonHopkins/characters/alan-kay/
            transform: "projected for the show: adds the invitation, sources and people to discuss"
            copies: [name, status, born, died, representation.public_figure, representation.consent.state]
        layers:
          biography: moollm://github/SimHacker/DonHopkins/characters/alan-kay/
