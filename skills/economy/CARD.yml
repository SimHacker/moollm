# CARD.yml — Economy
#
# Currency, trade, and economic flow.
# "Money is just a number until someone wants it."

card:
  id: economy
  name: "Economy"
  type: [skill, game, trade]
  
  emoji: 💰
  
  rarity: common
  
  description: |
    Currency management, buying, selling, and trade.
    Supports multiple currencies: 🐄MOOLAH (native), gold, dollars, custom.
    Track balances, transactions, and economic relationships.

# CURRENCY SYSTEM
#
# The economy skill supports MANY currencies.
# 🐄MOOLAH is the NATIVE coin of MOOLLM, but adventures can use any.

currencies:

  # THE NATIVE COIN OF MOOLLM
  moolah:
    native: true  # Default currency when none specified
    name: MOOLAH
    symbol: "🪙"
    plural: MOOLAH
    denominations:
      - { name: "NUT", value: 0.001, symbol: "🥜" }      # 1000 🥜 = 1 🪙
      - { name: "MOOLAH", value: 1, symbol: "🪙" }        # 1000 🪙 = 1 💎
      - { name: "GRAND", value: 1000, symbol: "💎" }     # 1000 💎 = 1 👑
      - { name: "FORTUNE", value: 1000000, symbol: "👑" }
    slang: ["moo", "coins", "cheese", "aloom"]
    etymology: |
      Sounds like "🐄moolah" (slang for money).
      Sounds like "🐄MOO" (the language MOOLLM descends from).
      Circular: MOOLLM → 🐄MOOLAH → MOOLLM.

  # CLASSIC RPG CURRENCY
  gold:
    name: Gold
    symbol: "🟡"
    plural: gold
    aliases: [gp, gold pieces]
    denominations:
      - { name: "copper", value: 0.01, symbol: "🟤", abbrev: "cp" }
      - { name: "silver", value: 0.1, symbol: "⚪", abbrev: "sp" }
      - { name: "gold", value: 1, symbol: "🟡", abbrev: "gp" }
      - { name: "platinum", value: 10, symbol: "⬜", abbrev: "pp" }
    use: "Classic RPG/D&D style adventures"

  # THE SIMS CURRENCY  
  simoleons:
    name: Simoleons
    symbol: "§"
    plural: Simoleons
    use: "Sims-style life simulation"
    lineage: "The Sims (Maxis/EA)"

  # REAL-WORLD (for grounded simulations)
  real_world:
    currencies:
      - { name: "Dollar", symbol: "$", code: "USD", emoji: "💵" }
      - { name: "Euro", symbol: "€", code: "EUR", emoji: "💶" }
      - { name: "Pound", symbol: "£", code: "GBP", emoji: "💷" }
      - { name: "Yen", symbol: "¥", code: "JPY", emoji: "💴" }
    use: "Grounded simulations, real-world scenarios"

  # CUSTOM TEMPLATE
  custom:
    description: |
      Adventures can define their own currencies.
      Examples: credits, caps, rupees, gil, bells, zenny, etc.

# 🐄MOOLAH HIERARCHY (expanded)

# 🐄MOOLAH CONVERSION TABLE
#
#   👑 FORTUNE   = 1,000 💎 = 1,000,000 🪙 = 1,000,000,000 🥜
#   💎 GRAND     = 1,000 🪙 = 1,000,000 🥜
#   🪙 🐄MOOLAH     = 1,000 🥜
#   🥜 NUT       = 0.001 🪙
#
# Symmetrical: each step is ×1000

moolah_conversions:
  "1 👑 FORTUNE": "1,000 💎 = 1,000,000 🪙 = 1,000,000,000 🥜"
  "1 💎 GRAND": "1,000 🪙 = 1,000,000 🥜"
  "1 🪙 🐄MOOLAH": "1,000 🥜"
  "1 🥜 NUT": "0.001 🪙"

# PARALLEL CURRENCIES (non-fungible, any economy)
#
# These exist BESIDE money currencies — cannot be bought or sold.

parallel_currencies:
  karma:
    name: KARMA
    symbol: "⭐"
    type: reputation
    convertible: false
    earning: "Good deeds, keeping promises"
    losing: "Betrayal, theft, harm"
    affects: "NPC attitudes, quest access, prices"
    
  favor:
    name: FAVOR
    symbol: "🎫"
    type: social_debt
    convertible: false
    description: "'You owe me one' — specific, tradeable between characters"
    
  essence:
    name: ESSENCE
    symbol: "🔮"
    type: magical
    convertible: false
    description: "Rare magical currency — found in artifacts, creatures, liminal moments"
    
  time:
    name: TIME
    symbol: "⏳"
    type: temporal
    convertible: false
    description: "Some things cost time, not money — training, crafting, healing"

# DEFAULT BEHAVIOR

defaults:
  native_currency: moolah
  fallback_currency: gold
  
  when_unspecified: |
    If no currency specified:
    1. Check adventure/context for currency setting
    2. Use 🐄MOOLAH (native coin of MOOLLM)
    3. Use gold (classic RPG fallback)

# DESIGN NOTES

design_notes:
  moolah_hierarchy: |
    🥜 NUT — "working for peanuts", small but real (1/1000 🪙)
    🪙 🐄MOOLAH — the satisfying clink of a coin (×1000 up and down)
    💎 GRAND — valuable, visible, impressive (1000 🪙)
    👑 FORTUNE — kingdom-level wealth (1000 💎)
    
    Symmetrical: NUT ←×1000→ 🐄MOOLAH ←×1000→ GRAND ←×1000→ FORTUNE
  parallel: |
    ⭐ KARMA — earned, not bought
    🎫 FAVOR — social, specific, tradeable
    🔮 ESSENCE — magical, rare, precious
    ⏳ TIME — the one thing money can't buy
  inclusivity: |
    The economy skill embraces ALL currencies.
    🐄MOOLAH is native to MOOLLM, but gold, dollars, 
    simoleons, and custom currencies are all valid.
    Context determines which currency applies.

# TOOLS REQUIRED

tools:
  required:
    - read_file
    - write_file
  optional: []

tier: 1

# METHODS

methods:
  
  BUY:
    description: "Purchase an item"
    parameters:
      item: "What to buy"
      from: "Seller"
      price: "Cost (defaults to item.price)"
      currency: "Currency to use (defaults to context)"
    output: chat + state-change
    effect: "Transfer currency, transfer item"
    invoked_by: [player, npc]
    
  SELL:
    description: "Sell an item"
    parameters:
      item: "What to sell"
      to: "Buyer"
      price: "Amount (defaults to item.value)"
      currency: "Currency to receive (defaults to context)"
    output: chat + state-change
    effect: "Receive currency, transfer item"
    invoked_by: [player, npc]
    
  TRADE:
    description: "Barter items without currency"
    parameters:
      give: "What you offer"
      receive: "What you want"
      with: "Trade partner"
    output: chat + state-change
    effect: "Exchange items if both agree"
    invoked_by: [player, npc]
    
  BALANCE:
    description: "Check currency balance"
    parameters:
      character: "Whose balance (defaults to player)"
      currency: "Which currency (defaults to all)"
    output: chat
    effect: "Display current balance(s)"
    invoked_by: [player]
    
  PRICE:
    description: "Check an item's price/value"
    parameters:
      item: "What to appraise"
      currency: "Currency for pricing (defaults to context)"
    output: chat
    effect: "Display buy and sell prices"
    invoked_by: [player]
    
  CONVERT:
    description: "Convert between currencies (where possible)"
    parameters:
      amount: "How much"
      from: "Source currency"
      to: "Target currency"
    output: chat
    effect: "Show conversion rate and result"
    note: "Parallel currencies (karma, favor, etc.) cannot convert"
    invoked_by: [player]

# STATE

state:
  economy-schema:
    balances:
      type: object
      description: "Currency balances (moolah, gold, karma, etc.)"
      example: { moolah: 1000, gold: 50, karma: 12 }
    transactions:
      type: array
      description: "History of purchases/sales"
    active_currency:
      type: string
      description: "Current context currency"
      default: "moolah"

# ADVERTISEMENTS

advertisements:
  MAKE-PURCHASE:
    score: 85
    condition: "Want to buy something"
    
  SELL-ITEM:
    score: 80
    condition: "Have something to sell"

# RELATED

see_also:
  - skills/character   # Balances live on characters
  - skills/adventure   # Economic gameplay
  - skills/scoring     # Value assessment
  - skills/experiment  # Poker uses 🐄MOOLAH stakes

# CREDITS

credits:
  inspiration:
    - "RPG economies — gold, silver, copper"
    - "The Sims — Simoleons"
    - "Lambda🐄MOO — the original 🐄MOO"
    - "🐄Moolah — slang for money"
    - "Zelda — rupees"
    - "Mario — coins"
    - "Animal Crossing — bells"
    - "Fallout — caps"
    - "Final Fantasy — gil"
