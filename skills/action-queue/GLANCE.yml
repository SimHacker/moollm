# GLANCE.yml — action-queue
# Full file: CARD.yml (175 lines) | SKILL.md
# 📋 "Queue up what to do next."

what: |
  Sims-style action scheduler: minutes-long steps for one worker.
  Queue actions, execute in order.
  Objects can push prerequisites. Urgent actions jump the line.
  A claimed task (skills/task) pushes its next step here.

why: |
  - Plan action sequences
  - Objects guide multi-step processes
  - Autonomous agent scheduling
  - Interruptible execution

when:
  - '"Plan sequence" → DO, DO, DO'
  - '"Execute next" → NEXT'
  - '"Urgent interrupt" → URGENT'
  - '"Check queue" → QUEUE'

methods:
  DO: "Add action to end"
  NEXT: "Execute next action"
  QUEUE: "Show current queue"
  URGENT: "Insert at front (jump line)"
  CANCEL: "Remove action"
  CLEAR: "Empty queue"
  REORDER: "Move action"
  PAUSE: "Stop executing"
  RESUME: "Continue executing"

state:
  action_queue: "[eat, shower, sleep]"
  paused: "boolean"
  mode: "[manual, autonomous]"

object_push_pattern: |
  Player: EAT
  Fridge: "Need food first"
  → URGENT: GET-FOOD
  → Then: EAT
  Queue: [GET-FOOD, EAT]

modes:
  manual: "Player says NEXT to advance"
  autonomous: "Agent auto-executes"

related: [return-stack (past), advertisement, needs, coherence-engine, task]
lineage: [Will Wright, The Sims]
tier: 1
