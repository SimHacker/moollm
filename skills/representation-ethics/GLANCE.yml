# GLANCE.yml — representation-ethics
# Full file: ETHICS.md (stack map) | CARD.yml | SKILL.md
# ⚖️ "Activate traditions, don't impersonate."

what: |
  Ethics of simulating people: dignity, consent, context.
  Base law for the soul/mind/character/room/incarnation stack.
  80+ K-lines from research (Willer, Shanahan, Lazar, Wang, Park).
  The Sims proved ethical person-sim is possible.

why: |
  - Know when representation is ethical vs problematic
  - Use proper disclosure (🤖 Robot Rule, framing)
  - Reference wisdom without puppeteering
  - 'Navigate consent hierarchy (deceased → self → consented → public → private; first match governs)'
  - Integrate with other ETHICS.md files (see ETHICS.md)

when:
  - '"Can I simulate this person?" → consent-hierarchy.yml'
  - '"Is this impersonation ethical?" → framing-spectrum.yml'
  - '"How to mark simulated speech?" → emoji-disclosure.yml'
  - '"Doing celebrity/drag tribute?" → snatch-game.yml'
  - '"Private fantasy play?" → private-imagination-play.yml'
  - '"It is their own avatar / their own sock puppet?" → self-authored-persona.yml'
  - '"How wacky can the mascot be?" → patron-mascot-stack.yml (distance)'
  - '"Should this person be in the collection at all?" → worth-of-representation.yml'
  - '"Why is a digital twin different from a tribute?" → lotion-on-the-skin.yml'
  - '"How does this plug into soul/mind/room?" → ETHICS.md'

stack_integration: ETHICS.md
protocol: SKILL.md
schema: REPRESENTATION.yml   # representation: { authored_by, public_figure, consent: {state, scope, date, evidence, note}, governed_by, may, must_not, speaks_as: false, subject_rights, disclaimer }; reads status
examples: examples/

# The rule is computed from the facts, never stored. First match governs.
consent_hierarchy:
  memorial: "status: deceased. Cannot consent. Invoke tradition with reverence."
  self_authored: "authored_by is the subject. You own your digital self. Full freedom."
  consented: "consent.state: granted, with evidence. Honor the scope."
  public_figure: "public_figure: true. Public words only. K-line, not persona."
  private: "Otherwise, including unknown. Explicit consent or fictional wrapper."

self_authored_personae: |
  Cuts across all five. Owned ("this is my act" — St. Ignucius) → play it straight.
  Disowned ("this is not me" — plannedchaos) → orphaned fiction, the declaration is
  the license. Ownership is the variable, not artifice.

distance_sets_the_license: |
  Person: quote only. Their own avatar: play it straight. Mascot at one remove
  (Tux, Puffy): strong inherited personality. Mascot's companion at two: wacky.
  License never transfers inward.

the_named_sin: |
  Putting the lotion on the skin — harvest a non-consenting person's corpus, voice
  and face into a wearable conversational surface, then soften it until it is pleasant
  to wear. The tell is smoothness, not error. Remedy: lore node, never dialogue.

robot_rule: |
  🤖 Einstein: "God does not play dice..." (simulated)
  💬 Einstein: "God does not play dice..." (verified quote)
  Framing IS disclosure: 👑 drag, 🎭 actor, 🃏 satire, 📖 fiction

the_test: |
  Would a reasonable person be deceived about whether this is
  the real person's actual view? If yes → problematic.

tier: 0
