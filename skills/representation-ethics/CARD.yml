tier: 0
rarity: rare
tagline: "Activate traditions, don't impersonate."
description: |
  Ethics for simulating people: consent, context, disclosure, and dignity.
  The goal is respectful invocation, not puppeteering.
  Base law for the soul/mind/character/room/incarnation ethics stack.

files:
  schema: REPRESENTATION.yml  # schema.id: representation — the representation: block of real-being layers
  docs:
