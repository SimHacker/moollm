principles:
  - consent_hierarchy
  - disclose_simulation
  - avoid_impersonation
  - preserve_context

safe_frames:
  - educational
  - private_imagination
  - moderated_debate
  - tribute_with_disclosure

# The representation: block every real-being character layer carries. Canonical: REPRESENTATION.yml.
# Layers store facts; the governing rule is computed from them (first match of rules), never stored.
# A layer's may/must_not add to its rule's lists; only the subject widens them (self-authored, consent scope).
representation_schema:
  id: representation
  file: REPRESENTATION.yml
  applies_to: "the representation: map of any character layer that portrays a real being"
  reads: "status (living | deceased | fictional), a character key; passed and memorial read as deceased"
  keys:
    authored_by: { shape: ref, default: null }   # the subject's own id = self-authored; null is a lint finding
    public_figure: { shape: bool, default: null }   # null = unknown, treated as private (the stricter rule)
    consent:
      shape: map
      default: { state: not_asked }
      aliases: [invitation.consent]
      keys:
        state: { shape: enum, values: [not_asked, asked, granted, declined, revoked, unverified], default: not_asked }   # granted needs evidence or governs nothing
        scope: { shape: prose, default: null }     # what was agreed: which show, which uses, speaking as them or not
        date: { shape: string, default: null }     # YYYY-MM-DD, when the state last changed
        evidence: { shape: ref, default: null }    # correspondence/... file or message reference
        note: { shape: prose, default: null }      # warmth (old friend, warm lead) lives here, never in state
    governed_by: { shape: "list of ref", default: ["moollm://github/SimHacker/moollm/skills/real-being/", "moollm://github/SimHacker/moollm/skills/representation-ethics/"], aliases: [protocol] }
    may: { shape: "list of prose", default: "rules[governing rule].may" }
    must_not: { shape: "list of prose", default: "rules[governing rule].must_not" }
    speaks_as: { shape: bool, default: false }   # true only when self-authored, or consent granted with a scope that says so
    subject_rights: { shape: map, default: "may correct or object; contact via the author" }
    disclaimer: { shape: prose, default: "A portrayal ABOUT {name}; not {name}; not endorsed unless noted; does not speak as them." }
    note: { shape: prose, default: null }
  value_aliases:
    "consent.state: not_yet_asked, not_addressed": not_asked
    "consent.state: asked_no_reply_yet, awaiting_reply, pending_response, outreach_sent_awaiting_reply, collaborator_invited": asked
    "consent.state: invitation_accepted": granted
    "protocol: HERO-STORY": "governed_by: [skills/real-being/, skills/representation-ethics/]"
  # First match governs.
  rules:
    memorial: { when: "status: deceased", signifier: "🕯️", rule: "Discuss ABOUT them. No speaking as, no interview, no invented inner life, dialogue or quotes." }
    self_authored: { when: "authored_by is the subject's own id", signifier: "👤", rule: "Subject authors it and sets terms; may speak as themselves." }
    consented: { when: "consent.state: granted, with consent.evidence", signifier: "👤", rule: "Within consent.scope, revocable. Nothing past scope or after revocation." }
    public_figure: { when: "public_figure: true", signifier: "👤", rule: "Documented work, sourced 💬 quotes in context, marked speculation. Never speak as them, fabricate, defame, exploit, or expose private life." }
    private: { when: "otherwise (public_figure false or unknown)", signifier: "👤", rule: "Inspired-by fictional character with disclaimer. No identifying details, no distribution without consent." }
  retired:
    consent_level: "1 → authored_by is the subject; 2 → consent.state granted with evidence, else unverified; 3 → public_figure: true; 4 → public_figure: false; 5 → status: deceased"
  extended_by: "WillWrightShowForFood schemas/portrayal-standards.yml (should declare extends: [representation])"

references:
  stack_integration: "skills/representation-ethics/ETHICS.md"
  details: "skills/representation-ethics/SKILL.md"
  examples: "skills/representation-ethics/examples/"

invoke_when:
