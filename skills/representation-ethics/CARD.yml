id: representation-ethics
name: "Representation Ethics"
type: [skill, ethics, philosophy]
emoji: "⚖️"
tier: 0
rarity: rare
tagline: "Activate traditions, don't impersonate."
description: |
  Ethics for simulating people: consent, context, disclosure, and dignity.
  The goal is respectful invocation, not puppeteering.
  Base law for the soul/mind/character/room/incarnation ethics stack.

files:
  schema: REPRESENTATION.yml  # schema.id: representation — the representation: block of real-being layers
  docs:
    - ETHICS.md             # Stack integrator — how this plugs into other ETHICS.md
    - SKILL.md              # Full protocol + research
    - GLANCE.yml
    - README.md
  ethics:
    - ETHICS.md
    - skills/soul/ETHICS.md
    - skills/mind/ETHICS.md
    - skills/character/ETHICS.md
    - skills/room/ETHICS.md
    - skills/incarnation/ETHICS.md
    - skills/mind-mirror/ETHICS.md
  examples: examples/

principles:
  - consent_hierarchy
  - disclose_simulation
  - avoid_impersonation
  - preserve_context

safe_frames:
  - educational
  - private_imagination
  - moderated_debate
  - tribute_with_disclosure

# The representation: block every real-being character layer carries. Canonical: REPRESENTATION.yml.
# A layer's may/must_not add to its level's lists; only the subject widens them (levels 1, 2).
representation_schema:
  id: representation
  file: REPRESENTATION.yml
  applies_to: "the representation: map of any character layer that portrays a real being"
  keys:
    consent_level: { shape: "enum 1..5", default: "3 if real and alive; 5 if status: deceased", aliases: [consent, kind] }
    authored_by: { shape: ref, default: "the subject at level 1; else none (lint finding)" }
    governed_by: { shape: "list of ref", default: ["moollm://github/SimHacker/moollm/skills/real-being/", "moollm://github/SimHacker/moollm/skills/representation-ethics/"], aliases: [protocol] }
    may: { shape: "list of prose", default: "levels[consent_level].may" }
    must_not: { shape: "list of prose", default: "levels[consent_level].must_not" }
    speaks_as: { shape: bool, default: false }   # true only at level 1, or 2 when the terms grant it
    subject_rights: { shape: map, default: "may correct or object; contact via the author" }
    disclaimer: { shape: prose, default: "A portrayal ABOUT {name}; not {name}; not endorsed unless noted; does not speak as them." }
    note: { shape: prose, default: null }
  value_aliases:
    "self, self-sovereign, 1_self": 1
    "explicit, 2_explicit": 2
    "public, public_figure, 3_public_figure": 3
    "private, 4_private": 4
    "deceased, 5_deceased, 5_deceased_legacy": 5
    "kind: representational": null   # names no level; the default applies
    "protocol: HERO-STORY": "governed_by: [skills/real-being/, skills/representation-ethics/]"
  levels:
    1: { name: self-sovereign, signifier: "👤", rule: "Subject authors it and sets terms; may speak as themselves." }
    2: { name: explicit consent, signifier: "👤", rule: "Published terms, scope, revocation, attribution. Honor them; nothing past scope or after revocation." }
    3: { name: "public figure: tradition, K-line", signifier: "👤", rule: "Documented work, sourced 💬 quotes in context, marked speculation. Never speak as them, fabricate, defame, exploit, or expose private life." }
    4: { name: "private individual: fictional wrapper", signifier: "👤", rule: "Inspired-by fictional character with disclaimer. No identifying details, no distribution without consent." }
    5: { name: "deceased: reverence, legacy and artifacts only", signifier: "🕯️", rule: "Discuss ABOUT them. No speaking as, no interview, no invented inner life, dialogue or quotes." }
  not_this_schema: "invitation.consent (not_yet_asked / granted / declined) — whether an invitation was accepted"
  extended_by: "WillWrightShowForFood schemas/portrayal-standards.yml (should declare extends: [representation])"

references:
  stack_integration: "skills/representation-ethics/ETHICS.md"
  details: "skills/representation-ethics/SKILL.md"
  examples: "skills/representation-ethics/examples/"

invoke_when:
  - "Simulating or quoting a real person"
  - "Unsure about consent or disclosure"
  - "Choosing a safe framing for representation"
  - "Wiring representation rules into soul/mind/character/room/incarnation"

advertisements:
  ethics_check: "Check consent, disclosure, and framing"
  choose_abstraction: "Pick a safer representation level"
  stack_map: "See ETHICS.md for cross-skill integration"

methods:
  CHECK: { signature: "CHECK [representation] [context]" }
  FRAME: { signature: "FRAME [topic] [participants]" }

k_lines:
  related:
    - { ref: soul, relation: "container hosting minds that may portray people" }
    - { ref: mind, relation: "agency that speaks — wells/cups/impersonators" }
    - { ref: character, relation: "body / patron-mascot / memorial directory" }
    - { ref: room, relation: "venue framing scopes but does not replace consent" }
    - { ref: incarnation, relation: "grants soul/minds to modeled beings" }
    - { ref: hero-story, relation: "safe tradition activation" }
    - { ref: ontology, relation: "composed tags; most restrictive wins" }
    - { ref: persona, relation: "costume still needs disclosure if real-like" }
    - { ref: mind-mirror, relation: "organelle profiles ≠ claiming to be" }

