# REPRESENTATION.yml — the consent and portrayal schema for real beings
# Format: designs/object-system/SCHEMA.md "Schema files". Prose: SKILL.md "Schema".
# A layer copies its representation: block into itself so it runs alone (constitution §15);
# this file says what each key means and what an omitted key means, so the copies agree.
#
# A layer states facts; the rule that governs the portrayal is computed from them, never
# stored. Four facts that a single consent number used to blur:
#   who wrote it          authored_by
#   did they agree        consent: { state, scope, date, evidence }
#   public or private     public_figure
#   living or dead        status (a character key)

schema:
  id: representation
  applies_to: "the representation: map of any character layer that portrays a real being"
  extends: []
  extensions: |
    Layer-specific keys are allowed (the biography layer has purpose, scope, sources).
    Never reuse a standard key with another meaning.
  conventions:
    list_of_one: "a bare string where a list is expected is a list of one"
    facts_not_verdicts: |
      Layers store facts with their evidence. The rule (schema.rules) is derived by
      resolve.py layers and by the engine, so it cannot drift from the facts.
    narrow_not_widen: |
      A layer's may and must_not ADD to the lists of its rule. A layer may forbid more than
      its rule; it may not permit what its rule forbids. Only the subject widens: by
      authoring their own layer, or by the scope they consented to.
    most_restrictive_wins: "when two layers or frames disagree, the stricter rule and the longer must_not apply"
    life_facts_outside: "status (living | deceased) and signifier are character keys; this schema reads status"
    value_aliases: "an alias may rename a value as well as a key; lint reports both, migrations rewrite both"

  keys:
    authored_by:
      shape: ref
      default: null
      meaning: |
        Who wrote this portrayal, as a character id. When it is the subject's own id the
        portrayal is self-authored and the subject's terms govern it. Authorship is not
        ownership: the author writes the portrayal and does not own the subject's identity.
        null is a lint finding, because subject_rights routes through the author.
      example: don-hopkins

    public_figure:
      shape: bool
      default: null              # unknown: the private rule applies until someone states it
      meaning: |
        Whether the person has a public role or published work that portrayal draws on.
        A fact about the person, independent of consent: a public figure who consents is
        still a public figure. Unknown is treated as private, the stricter rule; lint
        reports it for every living real being.
      example: true

    consent:
      shape: map
      default: { state: not_asked }
      meaning: |
        The record of asking the subject about this portrayal or show. A record, not a rank:
        it says what happened, when, and where the proof is. granted without evidence is a
        lint error and governs nothing; the rule falls through as if not asked.
        The record lives in the public show layer, because the show is what the subject
        consents to; private layers carry none and find it by lookup. No record means no
        consent, and layers still state not_asked rather than leave it out.
      keys:
        state:
          shape: enum
          values: [not_asked, asked, interested, granted, declined, revoked, unverified]
          default: not_asked
          value_meanings:
            not_asked: "nobody has asked them"
            asked: "asked; no answer yet"
            interested: "wants to take part; planning the time, medium and scope. Governs nothing until granted: the rule falls through as for asked"
            granted: "agreed, within scope, with evidence"
            declined: "said no; the public-figure or private rule applies and the layer says what was declined"
            revoked: "agreed, then withdrew; nothing past the revocation date"
            unverified: "an earlier record claimed consent and no evidence is on file; Don confirms or corrects"
          value_aliases:
            not_yet_asked: not_asked
            not_addressed: not_asked
            asked_no_reply_yet: asked
            awaiting_reply: asked
            pending_response: asked
            outreach_sent_awaiting_reply: asked
            collaborator_invited: asked
            invitation_accepted: granted
        scope:
          shape: prose
          default: "participate in the show, in any medium and on any timeline the subject chooses"
          meaning: |
            What was agreed. Consent to a repo show is consent to participate, and
            participation takes many forms over time: confirming or correcting what was
            written about them, email exchanges, any number of audio or video interviews,
            writing their own lines. The show records each contribution separately
            (invitation.participation). scope narrows that, and says whether they may be
            simulated or spoken as; neither is implied by consent to participate.
        date:
          shape: string
          default: null
          meaning: "when the state last changed, YYYY-MM-DD"
        evidence:
          shape: ref
          default: null
          meaning: |
            What shows it: a public file, or a description of the message (medium, date,
            subject). A public layer never gives a path into a private repo.
        note:
          shape: prose
          default: null
          meaning: "relationship context that is not consent: warm lead, old friend, cheered the plans"
      aliases: [invitation.consent]
      example:
        state: asked
        date: "2026-08-23"
        evidence: correspondence/2026-08-23-don-to-ian-roles-not-characters.md

    governed_by:
      shape: list
      of: ref
      default:
        - "moollm://github/SimHacker/moollm/skills/real-being/"
        - "moollm://github/SimHacker/moollm/skills/representation-ethics/"
      meaning: |
        The standards this portrayal follows, as global refs that survive a copy. A repo
        standard that extends this schema (wwsff schemas/portrayal-standards) may be listed
        instead; it carries this schema through extends.
      aliases: [protocol]
      value_aliases:
        HERO-STORY:
          - moollm://github/SimHacker/moollm/skills/real-being/
          - moollm://github/SimHacker/moollm/skills/representation-ethics/

    may:
      shape: list
      of: prose
      default: "schema.rules[the rule that applies].may"
      meaning: "what this portrayal may do, added to its rule's list"
      example: ["Link to his canonical full-resolution site, donhopkins.com."]

    must_not:
      shape: list
      of: prose
      default: "schema.rules[the rule that applies].must_not"
      meaning: "what this portrayal must never do, added to its rule's list; a layer cannot remove a rule's entry"
      example: ["Invent quotes or put words in his mouth."]

    speaks_as:
      shape: bool
      default: false
      meaning: |
        Whether the character may speak in the first person AS the subject. true is allowed
        when self-authored, or when consent is granted and its scope says so; anywhere else
        it is a lint error.
      example: false

    subject_rights:
      shape: map
      default:
        right_to_correct: true
        right_to_object: true
        contact: "via the author (authored_by)"
      meaning: |
        What the portrayed person may do about the portrayal and how to reach someone who
        acts on it. A prose string is accepted and read as note. For the deceased,
        corrections from family, estate and people who knew them are honored.
      keys:
        right_to_correct: { shape: bool, default: true }
        right_to_object: { shape: bool, default: true }
        contact: { shape: prose, default: "via the author (authored_by)", aliases: [contact_for_correction] }
        note: { shape: prose, default: null }

    parody:
      shape: map
      default: null
      meaning: |
        Declares the portrayal a parody. Allowed only under the public_figure rule, and only
        of the target's public conduct: it never claims to be them, and invents no private
        life. It punches up, at power and public acts, never down. The disclaimer names it
        parody wherever it is rendered.
      keys:
        target: { shape: prose, meaning: "the public conduct parodied, with sources" }
        sources: { shape: list, of: ref, default: [] }
      example:
        target: "his published statements and court record"
        sources: [sources/]

    disclaimer:
      shape: prose
      default: "This is a portrayal published ABOUT {name}. It is not {name}, is not endorsed by {name} unless noted, and does not speak as them."
      meaning: "the sentence shown wherever the portrayal is rendered; {name} is the character's name"

    note:
      shape: prose
      default: null
      meaning: "anything about this portrayal the other keys cannot hold"

  retired:
    consent_level: |
      A 1..5 number that merged authorship, consent, public role and death into one rank.
      Migration: 1 → authored_by is the subject (if authored_by names someone else, the 1
      was wrong and is dropped); 2 → consent.state granted when evidence is on file, else
      the invitation's state, else unverified; 3 → public_figure: true; 4 → public_figure:
      false; 5 → status: deceased. Spellings: consent:, kind:, 5_deceased_legacy, memorial,
      self-sovereign, 3_warm_contact.

  # The first rule whose when: holds governs the portrayal.
  rules:
    memorial:
      when: "status: deceased"
      signifier: "🕯️"
      meaning: "They cannot consent. Represent and discuss them through documented work, stories and artifacts."
      may:
        - Portray documented work, ideas, stories and artifacts
        - Quote only confirmed, sourced quotes, marked 💬 with citation
        - Discuss them with living people who knew them, with those people's consent first
        - Invoke their tradition with reverence
      must_not:
        - Speak as them, or interview them
        - Invent inner thoughts, inner life, dialogue or quotes
        - Create audience personas that speak as them
        - Fabricate quotes or positions as if real
        - Use quotes out of context
        - Defame or mock
        - Exploit commercially
        - Expose private information or private life details
        - Disregard the family's feelings after a recent death

    self_authored:
      when: "authored_by is the subject's own id"
      signifier: "👤"
      meaning: "The subject authors their own character and sets its terms."
      may:
        - Represent themselves in any way they choose
        - Speak as themselves in the first person (speaks_as may be true)
        - Publish terms under which others may portray them
        - Revoke or change those terms at any time
      must_not:
        - Grant through their own character a license over other real beings

    consented:
      when: "consent.state: granted, with consent.evidence"
      signifier: "👤"
      meaning: "The subject agreed to this portrayal or show, within a scope, and can revoke."
      may:
        - Portray documented facts, contributions and published work
        - Quote only confirmed, sourced quotes, marked 💬 with citation and kept in context
        - Speculate only when clearly marked ("they might say", never "they said")
        - "Invoke their tradition as a K-line: \"the Minsky tradition suggests\""
        - What consent.scope allows
        - Speak as the subject only when consent.scope says so
      must_not:
        - Go beyond consent.scope
        - Continue after revocation
        - Present simulation without disclosure
        - Fabricate quotes or positions as if real
        - Expose private information the scope does not release

    public_figure:
      when: "public_figure: true"
      signifier: "👤"
      meaning: "Public work is fair game; the persona is not. Invoke the tradition, not the identity."
      may:
        - Portray documented facts, contributions and published work
        - Quote only confirmed, sourced quotes, marked 💬 with citation and kept in context
        - Speculate only when clearly marked ("they might say", never "they said")
        - "Invoke their tradition as a K-line: \"the Minsky tradition suggests\""
        - Declared parody (parody:) of their public conduct, punching up
      must_not:
        - "Impersonate or speak as them (\"I am Minsky and I think\")"
        - Fabricate quotes or positions as if real
        - Use quotes out of context
        - Defame, or mock anything but their public conduct in a declared parody
        - In a parody, claim to be them or invent a private life
        - Punch down
        - Exploit commercially
        - Expose private information or private life details

    private:
      when: "otherwise (public_figure false or unknown)"
      signifier: "👤"
      meaning: "A person without a public role. Without consent, portray only through a fictional inspired-by character."
      may:
        - Create a fictional character inspired by them, with a disclaimer
        - Ask for consent, which moves them to consented
      must_not:
        - Use identifying details
        - Distribute without their consent
        - Speak as them
        - Expose private information
