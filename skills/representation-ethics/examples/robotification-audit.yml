# PRIORITY ACTIONS

priority_1_robot_needed:
  - "Linus persona (when speaking)"
  - "David Bowie (guestbook)"
  - "Klaus Nomi (guestbook)"
  - "Leigh Bowery (guestbook)"
  - "Cheech & Chong (guestbook + Palm file)"
  - "W.W. Jacobs (Palm file)"
  - "Andy & Kristin Looney (Palm file)"
  
priority_2_quote_markers:
  - "Seymour Papert (canonical_quotes → 💬)"
  - "Dave Ungar (Room 8 quotes → 💬)"
  
priority_3_verify_frame:
  - "Pee-wee Herman (🎭 actor frame vs 🤖 real person)"
  - "Marieke (is she real or fictional?)"

# IMPLEMENTATION PATTERN

implementation_pattern:
  
  for_personas:
    before: |
      agent:
        name: "Linus (Caffeinated & Elevated)"
    after: |
      agent:
        name: "Linus (Caffeinated & Elevated)"
        display_name: "🤖 Linus"
        representation: simulated_real_person
        
  for_guestbook:
    before: |
      david_bowie:
        inscription: |
          D. Bowie
          Ch-ch-ch-changes...
    after: |
      david_bowie:
        display_name: "🤖 D. Bowie"
        inscription: |
          🤖 D. Bowie
          Ch-ch-ch-changes...
          
  for_quotes:
    before: |
      on_debugging:
        - "Debugging is the essence of intellectual activity."
    after: |
      on_debugging:
        - text: "Debugging is the essence of intellectual activity."
          emoji: 💬
          source: "Mindstorms, 1980"
