# robotification-audit.yml — Representation Ethics Audit
#
# Inventory of characters and objects that reference real people,
# with assessment of whether they need 🤖 or other disclosure markers.
#
# Categories:
#   ✅ ADEQUATE — Already has sufficient ethical framing
#   🤖 NEEDS-ROBOT — Real person making autonomous utterances, needs 🤖
#   💬 NEEDS-QUOTE — Has quotes that should be marked as verified
#   👑 DRAG-FRAME — Drag/tribute persona, frame is disclosure
#   📖 FICTIONAL — Fictional character, no robot needed
#   🎪 GAME-FRAME — Game context provides disclosure
#   🙋 SELF-REP — Self-representation by the actual person

audit:
  
  # PERSONAS (speaking as real people)
  
  linus_persona:
    file: "examples/adventure-4/personas/linus-on-coffee-and-a-joint/PERSONA.yml"
    person: "Linus Torvalds"
    status: "living"
    current_framing: "TRIBUTE PERSONA — explicitly declared"
    speaks_autonomously: true
    assessment: "🤖 NEEDS-ROBOT"
    action: "Add 🤖 to display name when speaking"
    notes: |
      The PERSONA.yml has excellent ethical framing (tribute, not impersonation).
      But when speaking in sessions, should use "🤖 Linus" prefix.
      
  seymour_papert:
    file: "examples/adventure-4/pub/rooms/room-1/seymour-papert.yml"
    person: "Seymour Papert"
    status: "deceased (2016)"
    current_framing: "ELVIS-IMPERSONATOR model, quotes only"
    speaks_autonomously: false  # Only verified quotes
    assessment: "💬 NEEDS-QUOTE — should use 💬 for verified quotes"
    action: "Add 💬 prefix to canonical_quotes, 📜 for documented sources"
    notes: |
      Already says it only speaks in verified quotes.
      Upgrade to use 💬 markers for quotes.
      
  # GUESTBOOK ENTRIES (real people who signed)
  
  david_bowie:
    file: "examples/adventure-4/pub/guestbook/"
    person: "David Bowie"
    status: "deceased (2016)"
    current_framing: "Guestbook entry with inscription"
    speaks_autonomously: true  # Has dialogue in inscription
    assessment: "🤖 NEEDS-ROBOT"
    action: "Add 🤖 prefix to name in signature"
    
  klaus_nomi:
    file: "examples/adventure-4/pub/guestbook/"
    person: "Klaus Nomi"
    status: "deceased (1983)"
    current_framing: "Guestbook entry"
    speaks_autonomously: true
    assessment: "🤖 NEEDS-ROBOT"
    action: "Add 🤖 prefix"
    
  leigh_bowery:
    file: "examples/adventure-4/pub/guestbook/"
    person: "Leigh Bowery"
    status: "deceased (1994)"
    current_framing: "Guestbook entry"
    speaks_autonomously: true
    assessment: "🤖 NEEDS-ROBOT"
    action: "Add 🤖 prefix"
    
  pee_wee_herman:
    file: "examples/adventure-4/pub/guestbook/"
    person: "Paul Reubens (as Pee-wee)"
    status: "deceased (2023)"
    current_framing: "Character name, not actor name"
    speaks_autonomously: true
    assessment: "🎭 ACTOR-FRAME — character persona, not the actor"
    action: "Add 🎭 prefix (character performance frame)"
    notes: "Pee-wee Herman is a character, not the real person"
    
  cheech_and_chong:
    file: "examples/adventure-4/pub/guestbook/ + monkey-palm CHARACTER.yml"
    person: "Cheech Marin & Tommy Chong"
    status: "living"
