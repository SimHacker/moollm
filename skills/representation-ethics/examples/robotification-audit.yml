    speaks_autonomously: true
    assessment: "🤖 NEEDS-ROBOT"
    action: "Add 🤖 prefix when speaking"
    
  # PALM'S RELATIONSHIPS (real people as characters)
  
  ww_jacobs:
    file: "examples/adventure-4/characters/animals/monkey-palm/CHARACTER.yml"
