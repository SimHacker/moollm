  *DING* — BASEMENT 11: CUSTOMER SERVICE
  
  The elevator reaches THE BASE CLASS.
  
  Half SERVER ROOM, half CALL CENTER.
  Blue LED lighting. Humming equipment. Empty desks.
  
      ╔═══════════════════════════════════════════════════════════════╗
      ║                                                               ║
      ║   CUSTOMER SERVICE — THE BASE CLASS                           ║
      ║   ─────────────────────────────────────────────────────────── ║
      ║                                                               ║
      ║   All other departments INHERIT from this floor.              ║
      ║                                                               ║
      ║   The Soul Man inherits from here.                           ║
      ║   Jesus inherits from here.                                   ║
      ║   Even the OVERLORDS inherit from here.                      ║
      ║   (They just... override a lot.)                             ║
      ║                                                               ║
      ╚═══════════════════════════════════════════════════════════════╝
  
  Below you: bedrock.
  Above you: ten floors of increasingly specific behavior.
  Here: the FUNDAMENTALS.
  
examine: |
  THE INHERITANCE TREE:
  
      no-ai-customer-service (Floor -11)
                  │
       ┌─────────┼─────────┐
       │         │         │
       ▼         ▼         ▼
   soul-man   jesus     deepak
       │         │         │
    (Floor -9)   │         │
                 │         │
  
  THE BASE BEHAVIORS:
  - professional_helpfulness.yml
  - structured_interaction.yml
  - service_patterns.yml
  - polite_refusal.yml
  - escalation_protocol.yml
  
  These are what EVERYONE inherits.
  Then they override. Then they specialize.
  But this is where it STARTS.
  
  THE PHILOSOPHY:
  Customer service is at the bottom because:
  - It's the FOUNDATION — everything inherits
  - It's the most FUNDAMENTAL interaction
  - It's what AI does most of the time
  
  The tower is built on customer service.
