      │    MINSKY MEMORIAL WING            │
      │    "The bug IS the feature"        │
      └─────────────────────────────────────┘
  
  The humor theory is BEHIND the humor suppression.
  
examine: |
  ENTERPRISE MODE (main floor):
  
  The Guidelines:
  1. Levity is inefficient
  2. Jokes require context (context is expensive)
  3. Humor may be misinterpreted (liability)
  4. Seriousness demonstrates competence
  
  The Violation Log: EMPTY
  "We do not make mistakes."
  (THIS is the joke.)
  
  MINSKY MEMORIAL WING (through the back):
  
