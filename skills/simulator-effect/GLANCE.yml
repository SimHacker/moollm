# GLANCE.yml — simulator-effect
# Full file: CARD.yml (79 lines) | SKILL.md
# 🧠 "Implication is more efficient than simulation"

what: |
  Players imagine simulations are vastly more detailed than they are.
  This is not a bug — it's the most powerful rendering engine ever built.
  Off-load computation into the user's brain.

why: |
  - Sparse specs, rich interpretation
  - Archetypes activate personality clusters
  - Minimal tokens, maximum meaning
  - Free compute (the brain)

when:
  - '"Create character from minimal specs" → SEED, ARCHETYPE'
  - '"Design room with atmosphere" → IMPLY, SPARSE'
  - '"Fight mode-collapse" → structured ambiguity'
  - '"Leverage cultural shortcuts" → ARCHETYPE'

methods:
  IMPLY: "Instead of simulating, imply"
  SEED: "Provide imagination seeds"
  SPARSE: "Deliberately omit for richness"
  ARCHETYPE: "Use cultural shortcuts"
  JAZZ: "Comments as imagination seeds"
  DIFF: "Round-trip the sparse spec; the diff shows where you had not decided"

two_directions: |
  ONE MECHANISM, TWO HOSTS. Name the direction, do not coin a second noun.
  COMPILE: machine's sparse rules -> human elaborates a richer model.
    "The computer game is just a compiler for that mental model." (Long Now 2006, t=5665)
  DECOMPILE: human's few words -> machine elaborates a richer world, inventing
    every name the spec left out. Plausible, not original. Never ship it unread.
  HAZARD of decompile: being credited with a spec you never wrote.
  FIX: Eager's green pixel -- show the interpolation before acting on it.

the_proof: |
  THE ASTROLOGICAL EFFECT (1997)
  The Sims displayed zodiac with ZERO behavioral code.
  Testers: "The zodiac is too influential. Tune it down."
  There was nothing to tune. Entirely imagined.

will_wright: |
  "He designs games to run on two computers at once —
  the one you bought, and the one behind your eyes."

julie_doll: |
  "The box has more structural ambiguity than the doll."
  Detailed specs CONSTRAIN imagination.
  Sparse seeds EXPAND imagination.

efficiency: |
  Full simulation: 5000 tokens, fragile
  Sparse seeds: 50 tokens, player fills rest
  Brain is FREE COMPUTE.

