# THE COMMONS — one shared mixin holding everything the revolution has seized
# Perfectly factored: political events edit THIS FILE and nothing else.
# PAWN inherits from COMMONS; every commoner inherits from PAWN.
# The aristocracy does NOT inherit COMMONS — bottom-up is structural,
# not policed. Seized moves reach elites only by surrender (become a pawn).

commons:
  id: commons
  inherited_by: types/PAWN     # and through PAWN, every commoner and every surrendered elite
  initially: []                # empty at game start; the revolution fills it

move_sets: []                  # appended by political events; each entry is an organelle

protocol:
  revolution_begins: |
    Append NWAP (below) to move_sets. Additive: pawns KEEP their forward
    moves and gain the homeward ones. The reversal is a widening, not a
    flip — the pawn now walks both roads.
  regicide_or_full_surrender: |
    When every instance of an elite type is captured or capitulates,
    append that type's move organelle here (types/QUEEN moves, etc).
    ONE EDIT. Every commoner gains the moves through delegation edges
    that already exist. No per-instance surgery; O(1) political events.
  individual_surrender: |
    A surrendering elite edits its own inherits: to types/PAWN.
    Joining the commons is one edge — the seized moves come with
    membership, past and future.
  house_rule_interactions: |
    EXILE: the organelle leaves with the exile and is never appended here.
    AMNESTY-VOTE: the vote gates the inherits: edit, not this file.

why_this_factoring:
  - "COMMONS is the LEDGER of the revolution: read one file to know everything seized, and when."
  - "Reset is emptying one file. No flags, no per-instance cleanup, nothing to forget."
  - "Presence-derived and robust-first: 'do pawns have queen moves?' is answered by delegation lookup, never by cached state."
  - "The class the revolution enriches is a prototype, so enrichment is inheritance — the mechanism IS the politics."

# TEAM COMMONS — the two-tier factoring (afterthought worth arguing about)
# Black and white run separate revolutions at first, so each side gets its
# own commons; both inherit from THIS file, the world commons.
team_commons:
  structure: |
    COMMONS                    <- the world commons (this file); empty until unification
      COMMONS-WHITE            <- white's seized moves; white regicides append here
      COMMONS-BLACK            <- black's seized moves; black regicides append here
    Each side's commoners reach their team commons through one thin team
    prototype (PAWN-WHITE inherits [types/PAWN, COMMONS-WHITE]; likewise
    black), so political events stay one-edit-one-file per side. Two
    revolutions, two ledgers, two timelines: the board can hold a flat
    white society and a still-royalist black kingdom at once — and the
    flat side will proselytize across the ranks.
  unification: |
    THE INTERNATIONAL: the event that merges the teams into one flat
    society. Candidate factorings, deliberately left open:
      hoist    — move both team ledgers upstairs into COMMONS; team files
                 remain as emptied historical husks (two edits, history
                 preserved in place)
      repoint  — team pawn prototypes change inherits: from COMMONS-{team}
                 upstairs to COMMONS, after hoisting the organelles
      dissolve — delete the team layer entirely; commoners inherit COMMONS
                 directly, and the ledgers concatenate with provenance
                 comments intact
    Whichever factoring, the mechanism is the message: unification is a
    delegation edit, the same primitive as every other political event.
  open_question: |
    Where should the team edge live — on the thin team-pawn prototype, on
    the color mixin (dangerous: aristocrats wear colors too and must not
    inherit a commons), or on each instance at setup? Ordered multiple
    parent slots make all three expressible; taste decides. One to argue
    out with David Ungar.

# NWAP — the first donation to the commons
# 'pawn' mirrored, because the move set is literally the pawn reversed.
nwap:
  name: NWAP
  aka: [homeward moves, the grudge march]
  grants: |
    Pawn moves toward your OWN home rank: single step homeward, double
    step from the far rank, diagonal capture homeward. Promotion at the
    home rank (the coronation — see MANIFESTO.md phase 4).
  additive: true    # forward moves are kept; NWAP widens, never replaces
