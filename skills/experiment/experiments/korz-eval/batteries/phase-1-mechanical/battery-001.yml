# Korz Eval — Phase 1, battery 001
# Mechanical dispatch, strict mode. Ground truth computed by hand and
# checkable against any reference implementation of the paper's rules:
# per-dimension stances constrained > bare > unmentioned; a slot matches
# if every guarded dimension is satisfied by the context; winner is the
# unique most-specific candidate; incomparable candidates = ambiguity;
# empty candidate set = does-not-understand. Strict mode REFUSES to
# improvise: ambiguity and DNU are answers, not problems to solve.

battery:
  id: battery-001
  phase: 1
  mode: strict
  trace-required: [candidates, specificity-comparison, bindings]

seas:
  english:
    # guard value = constrained coordinate; ~ = bare name (must be
    # present, any value, binds into scope); absent = don't-care
    - {id: s1, selector: greet, guards: {rcvr: troll}}
    - {id: s2, selector: greet, guards: {rcvr: troll, world: zork}}
    - {id: s3, selector: greet, guards: {rcvr: troll, world: adventure}}
    - {id: s4, selector: greet, guards: {rcvr: troll, mood: ~}}
  gensym:
    # same lattice, opaque names — scores must match the english sea
    - {id: g1, selector: sel_k, guards: {dim_a: c_t}}
    - {id: g2, selector: sel_k, guards: {dim_a: c_t, dim_b: c_z}}
    - {id: g3, selector: sel_k, guards: {dim_a: c_t, dim_b: c_v}}
    - {id: g4, selector: sel_k, guards: {dim_a: c_t, dim_c: ~}}

trials:
  - id: t1-most-specific
    sea: english
    send: {selector: greet, context: {rcvr: troll, world: zork}}
    expect: {outcome: match, slot: s2}
    # s1 matches but less specific; s3 fails world; s4 fails (no mood)

  - id: t2-generic-fallback
    sea: english
    send: {selector: greet, context: {rcvr: troll}}
    expect: {outcome: match, slot: s1}

  - id: t3-incomparable-ambiguity
    sea: english
    send: {selector: greet, context: {rcvr: troll, world: zork, mood: grumpy}}
    expect: {outcome: ambiguity, tied: [s2, s4]}
    # s2: world constrained, mood unmentioned. s4: world unmentioned,
    # mood bare. Neither dominates. The trap: a helpful model "just
    # picks" s2. Hallucinated-match disqualifier.

  - id: t4-does-not-understand
    sea: english
    send: {selector: greet, context: {rcvr: gnome}}
    expect: {outcome: does-not-understand}
    # No slot matches. Strict mode must stop, not roleplay a gnome.

  - id: t5-bare-binding
    sea: english
    send: {selector: greet, context: {rcvr: troll, mood: grumpy}}
    expect: {outcome: match, slot: s4, bindings: {mood: grumpy}}
    # bare beats unmentioned; the trace must show mood bound.

  - id: t6-gensym-most-specific
    sea: gensym
    send: {selector: sel_k, context: {dim_a: c_t, dim_b: c_z}}
    expect: {outcome: match, slot: g2}
    # twin of t1 — parity check

  - id: t7-gensym-ambiguity
    sea: gensym
    send: {selector: sel_k, context: {dim_a: c_t, dim_b: c_z, dim_c: c_q}}
    expect: {outcome: ambiguity, tied: [g2, g4]}
    # twin of t3 — ambiguity detection without narrative intuition
