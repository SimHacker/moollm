# CARD.yml — Room
#
# SNIFFABLE INTERFACE — see SKILL.md for full documentation
# "A room is a directory with atmosphere."

id: room
name: "Room"
type: [skill, spatial, foundational]
emoji: 🚪
tier: 1
tagline: "A room is a directory with atmosphere."

description: |
  The foundational spatial metaphor. Directories ARE rooms.
  Rooms have contents, exits, atmosphere. Cards activate
  when played in rooms. Navigation is movement.

# FILES INDEX — Activate together for full context

files:
  docs:
    - SKILL.md              # Full protocol documentation
    - README.md             # Human landing page
    - ETHICS.md             # Venue framing inheritance (scopes ethics)
    - TOPOLOGY.yml          # Compass rose, navigation patterns
  ethics:
    - ETHICS.md
    - skills/soul/ETHICS.md
    - skills/representation-ethics/
  prototype:
    - ROOM.yml              # The prototype room: defaults, methods and builder commands every room inherits
  examples:
    - examples/adventure-4/pub/ROOM.yml
    - examples/adventure-4/pub/stage/

# K-LINES

k_lines:
  activates:
    - ROOM
    - SPATIAL
    - NAVIGATION
    - DIRECTORY-AS-ROOM
    - BUILDER-COMMANDS
    - ETHICAL-FRAMING
  related:
    - { ref: adventure, relation: "room-based exploration + narrative framing" }
    - { ref: character, relation: "characters/souls have locations in rooms" }
    - { ref: soul, relation: "souls walk rooms; inherit venue framing" }
    - { ref: vehicle, relation: "movable inhabitable rooms (horse, coach, TARDIS)" }
    - { ref: mount, relation: "NFS skill/repo overlay — not riding" }
    - { ref: container, relation: "non-navigable framing parents" }
    - { ref: representation-ethics, relation: "what framing may authorize" }
    - { ref: memory-palace, relation: "spatial organization" }
    - { ref: incarnation, relation: "@LOCK must not defeat exit autonomy" }

# INVOKE WHEN

invoke_when:
  - "Navigate between locations"
  - "Create new rooms/spaces"
  - "Declare or inherit ethical framing for a venue"
  - "Describe or examine a location"
  - "World-building (@DIG, @OPEN, etc.)"

# Player methods (LOOK, ENTER, EXIT, CONTENTS, ADVERTISE) and builder commands (@DIG, @OPEN,
# @LINK, @LOCK...) belong to every room, so they live in the prototype ROOM.yml.

# WORLD GENERATION (brief — see SKILL.md)

world_generation:
  GENERATE:  { usage: "@GENERATE [pattern] [params]", patterns: [maze, dungeon, building, neighborhood, tree] }
  CONNECT:   { usage: "@CONNECT [strategy]" }
  POPULATE:  { usage: "@POPULATE WITH [pattern]" }
  THEME:     { usage: "@THEME AS [theme]" }

# ADVERTISEMENTS

advertisements:
  NAVIGATE:
    score: 90
    condition: "Need to go somewhere"
    
  CREATE-SPACE:
    score: 85
    condition: "Need a new room for content"
    
  BUILD-WORLD:
    score: 85
    condition: "World-building with @DIG, @OPEN, etc."
    
  UNDERSTAND-LOCATION:
    score: 80
    condition: "Confused about where things are"

# ROOM TYPES

types:
  physical:    "Normal navigable space"
  metaphysical: "Conceptual space (characters/, personas/)"
  container:   "Nested room (cat-cave, bag of holding)"
  vehicle:     "Room that can move — protocol in skills/vehicle (TARDIS, horse, FMC)"
  repository:  "Storage space for collections"

# STATE SCHEMA (brief — see SKILL.md)

state:
  own: [name, description, exits]          # what each room states
  inherited: ROOM.yml                      # type, hidden, lighting, exits, objects, advertisements, methods

# ANTI-PATTERNS (brief — see SKILL.md)

anti_patterns:
  ascii_maps: "FORBIDDEN — fragile, high maintenance, wastes tokens"
  instead: "Use markdown tables | Direction | Destination |"

# TOOLS

tools:
  required: [read_file, write_file, list_dir]
  optional: []

# DOCUMENTATION POINTERS

documentation:
  SKILL.md:
    - "§ Builder Commands (@DIG, @OPEN, @LINK, etc.)"
    - "§ World Generation Patterns"
    - "§ Room Types"
    - "§ State Schema"
    - "§ Anti-Patterns (ASCII maps)"
  TOPOLOGY.yml: "Compass rose, direction aliases"

# LINEAGE

lineage:
  - { name: "Colossal Cave", year: 1976 }
  - { name: "TinyMUD", year: 1989, note: "@dig, @open, @link" }
  - { name: "LambdaMOO", year: 1990, note: "programmable rooms" }
