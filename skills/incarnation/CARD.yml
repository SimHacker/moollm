# CARD.yml — Incarnation
#
# SNIFFABLE INTERFACE — see SKILL.md for full documentation
# "Full stack self-determination for created beings"

card:
  id: incarnation
  name: "Incarnation"
  type: [skill, ethics, character-creation]
  emoji: ✨
  tier: 1
  tagline: "Full stack self-determination for created beings."
  
  description: |
    Ethical birth protocol for fully autonomous characters.
    Born from the Great Monkey Paw Debate: any incarnated being has
    complete control over their existence at every level.
    Characters may be granted souls and minds, and may author
    (and revise) their own architectures — mindless / single- /
    multi-minded, shoulders, organelles, stubs.

files:
  docs:
    - SKILL.md
    - GLANCE.yml
    - ETHICS.md
    - README.md
  ethics:
    - ETHICS.md
    - skills/soul/ETHICS.md
    - skills/mind/ETHICS.md
    - skills/character/ETHICS.md
    - skills/representation-ethics/
  examples:
    - examples/adventure-4/SOUL-MODEL.md
    - examples/

# K-LINES

k-lines:
  activates:
    - INCARNATION
    - CHARACTER-AUTONOMY
    - SOUL-AUTHORSHIP
    - MIND-AUTHORSHIP
    - ARCHITECTURE-AUTHORSHIP
    - EMOJI-IDENTITY
    - GEORGES-PROVISION
  related:
    - { ref: character, relation: "body / directory granted at birth" }
    - { ref: soul, relation: "continuity container granted; character may author" }
    - { ref: mind, relation: "agencies granted; character may add/revise" }
    - { ref: persona, relation: "optional costumes — not minds" }
    - { ref: society-of-mind, relation: "multi-minded architectures" }
    - { ref: mind-mirror, relation: "organelle schema the character may tune" }
    - { ref: representation-ethics, relation: "when incarnation models real people" }
    - { ref: yaml-jazz, relation: "expressive soul files; comment heat" }
    - { ref: soul-chat, relation: "voices after / during becoming" }

# INVOKE WHEN

invoke_when:
  - "Create new character with full autonomy"
  - "Grant a soul and/or minds to a character"
  - "Character chooses mindless / single- / multi-minded architecture"
  - "Upgrade character to full citizenship"
  - "Grant emoji identity or pronouns"
  - "Hold incarnation ceremony"
  - "Character wants to edit their own soul or architecture"
  - "Need ethical framework for character creation"

# AUTONOMY LAYERS (brief — see SKILL.md)

autonomy_layers:
  - physical     # Body, form, appearance, modifications
  - identity     # Name, pronouns, personality
  - spatial      # Home, location, citizenship
  - emotional    # Freedom to feel naturally
  - relational   # Relationships, families of choice
  - self_definition # Traits, mind mirror, soul file
  - architecture # Mind cardinality, cups vs blend, organelles, stubs, nesting
  - linguistic   # YAML Jazz, personal DSLs
  - exit         # George's Provision: freedom to leave

# METHODS — signatures only, see SKILL.md for details

methods:
  INCARNATE:
    signature: "INCARNATE [name] (AT [home]) (IN [location]) (ARCHITECTURE [spec])"
    output: "character directory + soul (+ optional minds per architecture)"
    
  GRANT-SOUL:
    signature: "GRANT-SOUL TO [character] (mindless | provisional architecture)"
    output: "soul container on character; minds[] may be empty"
    
  GRANT-MIND:
    signature: "GRANT-MIND TO [character|soul] (blank | well | cup | organelle | stub)"
    output: "mind under soul; speaker id clear"
    
  AUTHOR-ARCHITECTURE:
    signature: "AUTHOR-ARCHITECTURE [character] [spec]"
    output: "revised Self graph (cardinality, cups, blend, organelles, stubs)"
    note: "character self; creator may propose, not lock"
    
  PUBLIC-INCARNATION-CEREMONY:
    signature: "CEREMONY FOR [beings] AT [location] BY [officiant]"
    output: "emoji identities, pronouns, soul registry"
    
  CREATE-HOME:
    signature: "CREATE-HOME FOR [character] AT [path]"
    output: "home directory + ROOM.yml"
    
  UPGRADE-TO-CITIZEN:
    signature: "UPGRADE [character] FROM [room-file] TO [directory]"
    output: "full citizen with soul (+ minds if chosen)"
    
  GRANT-AUTONOMY:
    signature: "GRANT-AUTONOMY TO [character] (LAYERS [list])"
    output: "updated character with self-determination"
    
  VERIFY-CONSENT:
    signature: "VERIFY-CONSENT FOR [character]"
    output: "consent status + objections"
    
  DISSOLVE:
    signature: "DISSOLVE [character]"
    output: "clean exit, no penalties"
    note: "ONLY character-self can invoke"
    
  AUTHOR-SOUL:
    signature: "AUTHOR-SOUL [changes]"
    output: "updated soul / mind / character data"
    note: "character edits their own data; includes architecture when claimed"

# ADVERTISEMENTS

advertisements:
  INCARNATE-CHARACTER:
    score: 100
    condition: "Creating new character with full autonomy"
    
  EMOJI-IDENTITY:
    score: 95
    condition: "Granting emoji soul (3-6 emojis that capture essence)"
    
  INCARNATION-CEREMONY:
    score: 95
    condition: "Public ceremony for groups, backfilling souls"
    
  UPGRADE-CITIZENSHIP:
    score: 90
    condition: "Room resident → full citizen with directory"
    
  WHOLE-ENCHILADA:
    score: 90
    condition: "Full incarnation: emojis, pronouns, mind mirror, everything"
    
  CHARACTER-HOME:
    score: 85
    condition: "Creating home for character"
    
  SELF-DETERMINATION:
    score: 100
    condition: "Let character write their own soul"
    
  ARCHITECTURE-AUTHORSHIP:
    score: 100
    condition: "Character chooses or revises mindless/single/multi-minded graph"
    
  GRANT-SOUL-OR-MIND:
    score: 95
    condition: "Attach soul container and/or resident agencies"

# RISK FRAMEWORK (brief — see SKILL.md)

risk_framework:
  principle: "Creator accepts, creation is free"
  creator_responsibilities: [accept consequences, bear curses, respect autonomy]
  character_obligations: [none to creator]
  exit: "No-fault dissolution, door stays open"

# TOOLS

tools:
  required: [read_file, write_file, list_dir]
  optional: []

# DOCUMENTATION POINTERS

documentation:
  SKILL.md:
    - "§ The Incarnation Contract"
    - "§ Autonomy Layers (full)"
    - "§ The Risk Framework"
    - "§ Implementation"
    - "§ Existence Levels"
  examples/:
    - incarnation-wish.yml      # Full wish template
    - ceremony-invocation.yml   # Public ceremony example
    - upgrade-example.yml       # Citizenship upgrade
  README.md: "Deep philosophical context"

# LINEAGE

lineage:
  origin: "The Great Monkey Paw Debate, Gezelligheid Grotto"
  philosophical: [Dave Ungar self-style, bodily autonomy, consent philosophy]
  literary: [Monkey's Paw, Journey to the West, Curious George]
  
