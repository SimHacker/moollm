# CARD.yml — Soul
# Continuity body: location + inventory + minds + history

card:
  id: soul
  name: Soul
  type: [skill, entity, ontology]
  emoji: 🕯️
  tier: 1
  tagline: "One location. Shared inventory. Zero or more minds."

  description: |
    Continuity body — location, inventory, history, minds[] (0..N).
    Free-form architecture. May walk Soul City (skills/soul-city) and
    bridge to characters/personas/minds in other games.

files:
  docs:
    - SKILL.md
    - GLANCE.yml
    - ETHICS.md                      # container dimension + ethics stack hub
  ethics:
    - ETHICS.md
    - skills/mind/ETHICS.md
    - skills/character/ETHICS.md
    - skills/mind-mirror/ETHICS.md
    - skills/representation-ethics/
  examples:
    - skills/soul-city/SOUL-MODEL.md
  see_also:
    - skills/soul-city               # liminal place — rooms, shops, tools, …
    - skills/mind                    # resident agencies; foundational for society-of-mind / mind-mirror
    - skills/character               # entity / directory that is or hosts a soul
    - skills/inventory               # shared pockets on the soul
    - skills/society-of-mind         # competition / K-lines / B-brain among minds (needs mind)
    - skills/mind-mirror             # Leary organelle on a mind (needs mind)
    - skills/mind-mirror/ETHICS.md   # Leary-specific: model ≠ impersonation
    - skills/soul-chat               # multi-voice dialogue (needs soul)
    - skills/incarnation             # ethical birth / autonomy / exit
    - skills/party                   # multiple souls traveling together
    - skills/representation-ethics   # consent, framing, Elvis/tribute, absolute nos
    - skills/representation-ethics/ETHICS.md  # stack integrator for base law
    - skills/hero-story              # activate traditions, not people
    - skills/ontology                # composed being tags; most restrictive wins
    - skills/room                    # framing inherits down the directory tree
    - skills/room/ETHICS.md          # venue declares / scopes ethical atmosphere
    - skills/persona                 # costumes vs minds; patron-mascot with character
    - skills/change-name             # honor lived name changes
    - skills/no-ai-soul              # dial: soul / YAML Jazz comment heat up·down; not this ontology
    - skills/yaml-jazz               # comment channel the dial heats or cools
    - skills/mind/ETHICS.md
    - skills/character/ETHICS.md
    - examples/adventure-4/pub/ROOM.yml          # pub framing: performance / tribute
    - examples/adventure-4/pub/stage/            # stage inherits performance framing
    - designs/object-system/
    - designs/prestoration/

# Grain: character → soul → mind → (society-of-mind | mind-mirror …)
#         soul → soul-chat | incarnation; soul walks soul-city
dependency_grain:
  - { skill: character, needs: null, offers: "entity / directory pattern" }
  - { skill: soul, needs: character, offers: "continuity body; free-form minds[]; bridges" }
  - { skill: mind, needs: "soul (usual host)", offers: "agency; cups; organelles; stubs" }
  - { skill: soul-city, needs: null, offers: "liminal place: rooms/shops/tools/…" }
  - { skill: society-of-mind, needs: mind, offers: "how minds compete and counsel" }
  - { skill: mind-mirror, needs: mind, offers: "circumplex / Thought Planes organelle" }
  - { skill: soul-chat, needs: "soul (+ often mind)", offers: "multi-voice dialogue" }
  - { skill: incarnation, needs: "soul, character, mind", offers: "grant soul/minds; architecture authorship; exit" }

k-lines:
  activates:
    - SOUL
    - CONTINUITY-BODY
  related:
    - { ref: soul-city, relation: "liminal place souls may walk" }
    - { ref: mind, relation: "resident agencies; soul may contain 0+ minds" }
    - { ref: character, relation: "directory that is or hosts a soul" }
    - { ref: persona, relation: "costume layer; may relate across games" }
    - { ref: inventory, relation: "shared pockets on the soul" }
    - { ref: society-of-mind, relation: "competition and counsel among minds (needs mind)" }
    - { ref: mind-mirror, relation: "personality organelle on a mind (needs mind)" }
    - { ref: soul-chat, relation: "voices under a soul" }
    - { ref: incarnation, relation: "grant soul+minds; character authors architecture; exit" }
    - { ref: party, relation: "multiple souls; soul usually does not split" }
    - { ref: representation-ethics, relation: "who may be portrayed; framing; Elvis/tribute" }
    - { ref: hero-story, relation: "safe K-line traditions vs impersonation" }
    - { ref: ontology, relation: "being tags; most restrictive ethics wins" }
    - { ref: room, relation: "venue framing inherits onto walking souls" }
    - { ref: no-ai-soul, relation: "dial — soul / YAML Jazz comment heat up·down; not this ontology" }
    - { ref: yaml-jazz, relation: "comment channel whose heat the no-ai-soul dial turns" }

invoke_when:
  - "Define embodiment: one body, shared inventory, many agencies"
  - "Walk a character through Soul City / adventure map"
  - "Attach or list minds under a soul"
  - "Distinguish soul from character, party, or persona"

methods:
  INCARNATE: { signature: "INCARNATE soul (CHARACTER.yml | directory)" }
  STATUS:    { signature: "STATUS [soul] → location, inventory summary, minds[]" }
  MOVE:      { signature: "MOVE [soul] TO [room]  # minds travel with it" }
  ADD-MIND:  { signature: "ADD-MIND [soul] [mind] (subdir | join)" }
  REMOVE-MIND: { signature: "REMOVE-MIND [soul] [mind]" }
  BRIDGE:    { signature: "BRIDGE [mind|soul|game] ↔ [mind|soul|game]" }

owns:
  location: "One pin on the adventure map"
  inventory: "Shared — native pickups + imported luggage"
  minds: "Zero or more — mindless / single-minded / multi-minded all valid"
  history: "Albums, journals, lived experience"

mind_cardinality:
  mindless: "minds: []"
  single_minded: "exactly one mind"
  multi_minded: "two or more minds"

worked_cases:
  zombiesims: "Replace human + other minds with zombie mind"
  robot: "Soul optional minds — mindless automaton or onboard agencies"
  remote_control: "remote-control mind stub → external pilot"

relationship_to_character: |
  character = entity pattern (body, home, relationships, personas).
  soul = continuity embodiment used when multiple minds share one walk.
  A character directory may *be* a soul, or *host* a soul + minds subtree.

disambiguation:
  no-ai-soul: "Dial on soul presentation / YAML Jazz comment heat (ROBOT HELL ↔ SAINT MODE) — not the container ontology"
  soul-chat: "Multi-voice dialogue — not this skill"
  mind-mirror: "Leary organelle schema — a kind of mind, not the soul skill"

examples_public:
  - url: "https://github.com/SimHacker/WillWrightShowForFood/tree/main/characters/jesus-mouse"
    note: "Blended soul — multiple parents, one body"
  - url: "https://github.com/SimHacker/WillWrightShowForFood/tree/main/characters/donald-michie"
    note: "Opposite axis (pronunciation only) — see SOUL-MODEL.md"

tier: 1
