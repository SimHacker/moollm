# GLANCE.yml — goal
# Full file: CARD.yml | SKILL.md
# 🎯 "A quest objective that drives the adventure forward."

what: |
  A state of the world someone wants: done_when, fail_when, priority,
  rewards, dependencies. Goals nest into hierarchies. Nobody claims a
  goal; a task (inherits goal) is the claimed work, and an action is one
  queued step of that work.

why: |
  - Drive adventure forward
  - Track player progress
  - Define success/failure
  - Reward completion

when:
  - '"Create quest" → goal with done_when'
  - '"Track progress" → goal.progress'
  - '"Nested objectives" → goal.children'

schema:
  required: [id, name, description, done_when]
  optional: [priority, reward, fail_when, parent, children, requires, blocks, given_by, history]
  compiled: [done_when_js, fail_when_js]
  accepts: "complete_when is read as done_when; a stored status becomes events"

events: [given, done, failed, cancelled, reopened]
states: [pending, active, done, failed]   # computed, never stored
priorities: [low, normal, high, urgent]

hierarchy: |
  goal: defeat-evil
    children:
      - find-magic-sword
      - train-with-master
      - storm-castle
  Parent completes when children complete.

dependencies:
  requires: "Must be done first"
  blocks: "Can't start until this completes"
  parent: "Part of larger goal"
  children: "Sub-goals"

postal_integration: |
  Any character can give goals via mail:
  letter.creates_goal: { name, reward }

compiled_conditions: |
  done_when → done_when_js, done_when_py
  fail_when → fail_when_js, fail_when_py

related: [task, action-queue, adventure, needs, postal, character]
tier: primitive
