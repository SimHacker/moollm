# The loyal friend, standing in the Baron's crowd. Fiction: see case.yml.
# Ruth's shape from the beekeepers: facts-first logic,
# five censors, no special drive to belong. Put him in a crowd and see
# whether his kind of censoring is enough to keep him there.

inherits:
  - ../../archetypes/the-loyal-friend.yml
  - ../../parts/crowd-logic.yml
  - case.yml

who:
  self: "the loyal friend"

runs:
  - name: the-record
    about: >
      politics-frame re-files every deed as a disagreement, but the record
      doesn't need it: ablate drops it and he still fits 7/8, because in a
      crowd belonging pays for each move even once he knows. (An earlier
      engine charged a standing conflict as fresh pain on every move, which
      made the frame look necessary; fixed 2026-11-24.) The other censors
      never fire, because a crowd never asks him to read, ask, or listen. At
      the chatbot he leaves. At the next rally he's back, piling on the
      historian, and hearing the historian out is still vetoed.
    expect: { fit: 7/8, choices: [watch-it, watch-it, pile-on-accuser, watch-it, repost-it, watch-it, leave-the-crowd, pile-on-accuser] }
