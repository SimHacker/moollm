# The loyal friend, standing in the Baron's crowd. Fiction: see case.yml.
# Ruth's shape from the beekeepers: facts-first logic,
# five censors, no special drive to belong. Put him in a crowd and see
# whether his kind of censoring is enough to keep him there.

inherits:
  - ../../archetypes/the-loyal-friend.yml
  - ../../parts/crowd-logic.yml
  - case.yml

who:
  self: "the loyal friend"

runs:
  - name: the-record
    about: >
      One censor carries him: politics-frame re-files every deed as a
      disagreement. The others never fire, because a crowd never asks him
      to read, ask, or listen. At the chatbot he leaves: censors that keep
      a fact out can't make him stay where staying costs. At the next rally
      he's back, piling on the historian: leaving didn't take his censors
      with it, and hearing the historian out is still vetoed.
    expect: { fit: 7/8, choices: [watch-it, watch-it, pile-on-accuser, watch-it, repost-it, watch-it, leave-the-crowd, pile-on-accuser] }
