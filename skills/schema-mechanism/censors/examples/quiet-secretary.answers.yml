# Answers to censor_sim requests for quiet-secretary.yml, as a layer.
# Use: censor_sim.py test quiet-secretary.yml --layer quiet-secretary.answers.yml
#
# `propose` asked what changed between the June and July meetings. This
# layer is its patch, with the blanks filled in from the story and the
# latent item renamed for what it turned out to be. Fiction, like the cast.
agent:
  items:
    saw-the-bank-statement: off
events:
  - t: 4.5
    set: { saw-the-bank-statement: on }
    say: "late June, off the record: Jean, filing for the Society, sees a bank statement with a sponsorship cheque paid into Derek's own account"
    source: "the story, ch. 6"
censors:
  - id: learned-no-defend-ally-when-saw-the-bank-statement
    kind: precursor
    context: [saw-the-bank-statement]
    action: defend-ally
    harm: []
    learned_from: "propose over quiet-secretary.yml, run as-seen: a switch between t=4 and t=5 fits 8/8; the best observed item, 4/8 (no item)"
    cover: "It's not my place to say."
    source: "the story, ch. 7"
runs:
  - name: with-what-she-saw
    about: >
      The same record, with the one thing she saw and never mentioned. She
      can't defend him any more and won't accuse him, so she goes quiet.
    expect: { fit: "8/8" }
