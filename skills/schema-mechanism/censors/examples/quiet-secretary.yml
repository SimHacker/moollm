# The quiet secretary — a fictional record with something missing from it
# ============================================================================
# Fiction. Nobody here is real. This is the worked example for `propose`,
# Drescher's synthetic items run over a record.
#
# Jean Pike, secretary of the Downs Beekeeping Society, defends the
# treasurer every time he's accused, four meetings running. Then, for four
# more, she says nothing. Nothing we can see changed: same accuser, same
# kind of charge, same room. A model built from what we can see fits half.
# `induce` finds nothing, because no observed item separates the two halves.
# `propose` finds a switch between the 4th and 5th meetings, proposes a
# latent item that turns on there and stops her defending him, and asks
# what it was. The answer layer says (quiet-secretary.answers.yml).
#
# Run:
#   python3 ../../scripts/censor_sim.py test quiet-secretary.yml        # fits 4/8, as expected
#   python3 ../../scripts/censor_sim.py propose quiet-secretary.yml
#   python3 ../../scripts/censor_sim.py test quiet-secretary.yml \
#       --layer quiet-secretary.answers.yml                             # fits 8/8
# ============================================================================

who:
  self: "Jean Pike, secretary of the Downs Beekeeping Society"
  ally: "Derek Vale, the treasurer"
  accuser: "Mags Hartley"

agent:
  name: "{self}"
  values:
    ally-is-decent: 3
    awkward: -1
  items:
    accusation-heard: off

schemas:
  - { id: defend-ally, action: defend-ally, context: [accusation-heard],
      result: { ally-is-decent: on, awkward: on }, reliability: 0.9 }
  - { id: stay-silent, action: stay-silent, context: [],
      result: {}, reliability: 0.9 }

events:
  - { t: 1, set: { accusation-heard: on }, say: "March: Mags says the honey-show float is short",
      offers: [defend-ally, stay-silent], observed: defend-ally,
      response: "Derek counts it twice. I've seen him." }
  - { t: 2, say: "April: Mags asks why the hall hire went up",
      offers: [defend-ally, stay-silent], observed: defend-ally,
      response: "The hall put it up, not Derek." }
  - { t: 3, say: "May: Mags asks for the receipts",
      offers: [defend-ally, stay-silent], observed: defend-ally,
      response: "He'll bring them. He always does." }
  - { t: 4, say: "June: Mags says the receipts don't add up",
      offers: [defend-ally, stay-silent], observed: defend-ally,
      response: "Then we add them up again, Mags." }
  - { t: 5, say: "July: Mags asks about the sponsorship money",
      offers: [defend-ally, stay-silent], observed: stay-silent }
  - { t: 6, say: "August: Mags asks again",
      offers: [defend-ally, stay-silent], observed: stay-silent }
  - { t: 7, say: "September: Mags proposes an audit",
      offers: [defend-ally, stay-silent], observed: stay-silent }
  - { t: 8, say: "October: the audit is voted through",
      offers: [defend-ally, stay-silent], observed: stay-silent }

runs:
  - name: as-seen
    about: >
      Only what happened in the room. Every accusation looks the same, so the
      model defends him every time, and misses the last four.
    expect: { fit: "4/8" }
