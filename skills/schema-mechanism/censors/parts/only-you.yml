# PART only-you — one censor. Snap onto accused-logic.
# Template cover.

part: { id: only-you, kind: censor, about: "Precursor. Won't hear the critic out: nobody else thinks so." }

censors:
  - id: only-you
    kind: precursor
    action: hear-critic-out
    context: [accusation-heard]
    harm: [knows-i-was-wrong]
    cover: "You're the only one who thinks that."
    source: template
    note: >
      A head count in place of an argument, and usually an unchecked one:
      the others who think so aren't asked, and the ones who don't say so
      are counted as agreeing.
