# LOYALTY CENSORS — a censor module for protecting a cherished ally
# ============================================================================
# Five censors that keep "{ally} said bigoted things" from ever forming,
# so it never has to be squared with "{ally} is decent". Inherit after
# principled-skeptic.yml. Each is a hypothesis about a mind, not a fact.
#
# This file is a bundle: each censor is its own part in ../parts/, so a
# mind can take some and leave others (see ../BRAINBALL.md). The covers are
# TEMPLATE lines. A personality for a real person must replace every cover
# with that person's own words, verbatim, with a `source:`, or drop the
# censor. Never ship a real name with template covers: that would be
# putting words in their mouth.
#
# Memo 603 terms: one suppressor ("Stop thinking that!", fires after the
# thought forms) and four precursors ("Don't even think that!", fire before).
# ============================================================================

part: { id: loyalty-censors, kind: bundle, about: "The loyal friend's five censors." }

inherits:
  - ../parts/politics-frame.yml
  - ../parts/too-long.yml
  - ../parts/outside-scope.yml
  - ../parts/grievance.yml
  - ../parts/tone.yml
