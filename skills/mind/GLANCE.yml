# GLANCE.yml — mind
# Full file: CARD.yml | SKILL.md
# 🧠 "Resident agency. Shares the soul's walk."

what: |
  Resident agency — usually inside (or beside) a soul. First-class;
  soul-as-container is organizational, not metaphysical. May host
  sub-minds, sub-souls, intervening containers. Blank, cloned, inherited,
  stub, zombie, organelle, …. Default: shares the soul's map pin.

why: |
  - Multiple agencies, one embodiment
  - Well (latent) vs cup (personal)
  - Organelles keep game DNA without flattening the soul
  - Shoulders, B-brains, counselors as co-located minds

when:
  - '"Add an inner voice" → ADD-MIND / cup'
  - '"Inherit an archetype" → well or cup'
  - '"Game schema on a traveler" → organelle'
  - '"Angel / devil on the shoulder" → two minds, one soul'

may_be:
  - blank
  - cloned
  - inherited   # well and/or file parents
  - made-up
  - imported
  - organelle   # game/ecosystem schema + import/export/sync
  - stub        # thin agency — e.g. remote-control bridge to external pilot
  - zombie      # replaces prior minds (ZombieSims pattern)

cardinality_note: |
  Soul may have 0 / 1 / N minds. Usual host is a soul; Self also allows
  minds hosting sub-minds, sub-souls, intervening containers.

related_skills:
  soul: "Usual container — continuity body"
  character: "Host directory"
  society-of-mind: "Needs mind — competition, K-lines, B-brain"
  mind-mirror: "Needs mind — Leary organelle schema"
  soul-chat: "Often minds speaking under a soul"
  prototype: "Clone and change"
  representation-ethics: "Consent when modeling real people"

foundational_for: [society-of-mind, mind-mirror]

examples: skills/soul-city/SOUL-MODEL.md   # bootstrap world; ontology in this skill
ethics: ETHICS.md                             # agency · see also soul/ + character/ ETHICS
# see_also / related → CARD.yml · grain → skills/soul/CARD.yml

tier: 1
