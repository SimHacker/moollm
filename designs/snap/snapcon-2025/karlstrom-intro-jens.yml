introduction:
  gist: |
    Jens opened the post-dinner address as Brian's friend and collaborator. He did not need
    to introduce him — the room knew Brian — but framed the Karlstrom award as recognition
    of Logo books, Snap!, and a life of **Promethean** teaching (fire from the gods to humans).
  birthright_line: |
    Jens recalled Brian at MIT Sloan (Juke in the room) saying **"computing is your birthright
    as a human being"** — goosebumps material that stuck for years.
  ask: |
    Radical, non-conformist, surprising, maybe mundane visions about education, computing,
    AI, and the state of CS education — from "the world's best programming teacher," now an
    official thought leader.

ongoing_collaboration_in_talk:
  german_sentence_lab: |
    Brian credits "a lot of lectures from Jens" about why English sentence-generation exercises
    in BJC don't work in German — Brian reverted to saying English.
  snap_technical_split: |
    Brian names Dan Garcia as the award's better half for activism; names **anonymous procedures
    (lambda / gray rings)** as his own main Snap! contribution — the pedagogy-meets-implementation
    split the pair show is built on.

qa_jens_moment:
  dutch_teacher:
    who: "Math teacher since 1988; CS teacher from 2017"
    parallel: |
      1970s Dutch equivalent of Lincoln-Sudbury — slept at teachers' houses, ate with them,
      went on holiday together. First year teaching CS (2017–18) was hard; kids expected C++
      because games are written in C++; Jens/Snap! path instead.
    barcelona: |
      Wanted to take kids to STEAM conference in Barcelona; **21st century forbid it**.
      "Thank you for celebrating the 20th century."
  ykca_on_my_friend:
    what: |
      Asked about Brian naming every CCUS member "my friend" — deeper message about
      institutions making teachers enemies of kids; grades vs holistic relationship (Martin Buber).

show_hooks:
  - "Jens hosts Brian — birthright of computing, world's best programming teacher"
