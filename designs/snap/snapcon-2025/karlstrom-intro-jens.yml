# Snap!Con 2025 — Jens Mönig hosts Brian Harvey's Karlstrom Address
# Jens introduced the evening talk; Q&A includes Dutch teacher parallel.
# Public video: https://www.youtube.com/watch?v=pDK2PE_pkqQ

