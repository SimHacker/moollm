# Snap!Con 2025 — Brian Harvey ACM Karlstrom Award Address
# Evening talk, Sep 21, 2025. Introduced by Jens Mönig.
# Public video: https://www.youtube.com/watch?v=pDK2PE_pkqQ
# Director's cut (44 min): linked from the video description + Snap!Con site.
# Contains the seventh-grade algebra teacher story the live talk only teases.
# Cleaned transcript of the live talk: snapcon-2025-karlstrom-address-transcript.md

