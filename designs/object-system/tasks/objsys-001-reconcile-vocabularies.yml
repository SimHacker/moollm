  - id: cascade
    status: opened
    out: "CONTAINER.yml defaults: applied after delegation in resolve.py (deep-merge maps, concat lists, nearest first)"
  - id: skill-rewrites
    status: opened
    # Skills whose protocol teaches a model the decisions replaced. Not a find-and-replace:
    # each gets read top to bottom and rewritten against SCHEMA.md, then lint and the
    # adventure-4 compile run. Order is dependency order; a later skill cites an earlier one.
    # Scan behind this list: retired forms counted per skill in SKILL/CARD/GLANCE/README/tmpl.
    rewrites:
      - { skill: prototype, why: "the inheritance skill itself: PROTOTYPES.yml is a catalog not a parent list; inherits:, x* named parents, implied filename parents, views, embedded #path; lookup is resolve.py", status: done }
      - { scope: "docs that still describe PROTOTYPES.yml as a parent list (skill-instantiation-protocol, schema self mechanism, designs)", files: 21, status: opened }
      - { skill: container, why: "cascade: inherits: -> defaults: (one key, no forced 'inherits' section), flat files, merge rules; implement cascade in resolve.py alongside", status: done }
      - { skill: room, why: "ROOM.yml as an interface on a directory object; sub-rooms vs interface subdirectories; lighting 0..10; glance core keys (name, type, description, exits); 16 wrapper examples; skills/room/ROOM.yml prototype replaces ROOM.yml.tmpl", status: done }
      - { skill: character, why: "CHARACTER.yml interface, meta.inherits -> inherits:, facts not verdicts, glance core keys (name, description, location)", status: done, note: "skills/character/CHARACTER.yml prototype (methods, dispatch, sims defaults out of the CARD); 4 missed player:/character: wrappers flattened, compile_inventory takes the list form, so don-hopkins, donna-toadstool, richard-bartle and proc compile again (53 -> 57)" }
      - { skill: object, why: "flat object files, prototype: <ref> -> inherits:, embedded objects and file#collection.id, catalog refs", status: done, note: "skills/object/OBJECT.yml prototype; template's 8 worked objects are flat files in examples/; CARD was unparseable (computed: inside common_tags), fixed and flattened; object defaults: (initial state) dropped in favour of state: on the object or its prototype" }
      - { skill: glance, why: "new: purpose, line budget, how a glance points deeper; core keys come from the subject's skill", status: opened }
      - { skill: index, why: "new: summarizes contents, one entry per child", status: opened }
      - { skill: card, why: "CARD as a view (format* card, subject* ..), the sidecar pattern, 16 wrapper examples", status: opened }
      - { skill: summarize, why: "common parent of the views; foo-metadata.yml sidecars; git, not timestamps", status: opened }
      - { skill: skill, why: "skill anatomy; hand the GLANCE format to skills/glance; where a skill declares its own parents (CARD inherits:)", status: opened }
      - { skill: yaml-jazz, why: "key spelling rule (schema keys underscores, names hyphens); comments as modulators (lighting: 4 # swinging bulb); no wrappers", status: opened }
      - { skill: context, why: "world keys as dimensions (turn, room, player, ...); world.room.lighting", status: opened }
      - { skill: adventure, why: "24 wrapper examples, parent spellings, compile docs; economy and the RISC engine are adventure-001", status: opened, requires: adventure-001 }
      - { skill: planning, why: "plan steps store status; align with task's events-not-status rule, or say why plans differ", status: opened }
      - { skill: plan-then-execute, why: "same as planning", status: opened }
      - { skill: action-queue, why: "advertisement lists -> maps keyed by name", status: opened }
      - { skill: advertisement, why: "advertisement maps keyed by name; action keeps its Sims meaning", status: opened }
    mechanical:
      - { scope: "wrapper keys in fenced YAML examples in skill docs (buff, simulator-effect, ontology, biome, image-mining, empathic-templates, mind-mirror, inventory, society-of-mind, robot, abstract, bartender, budtender, ...)", skills: ~40, how: "flatten fenced blocks, reparse each, as for designs/gastown/TASKS-2026-01.md" }
      - { scope: "small parent spellings in experiment, workflow, soul-city, historical, no-ai-soul, inventory", skills: 6, how: "the parent-spelling batch" }
    triage:
      - { scope: "timestamps in skill-snitch and cursor-mirror", note: "mostly scan and log times, which are content; keep those" }
  - id: docs
    status: opened
    out: "SELF-AND-MOOLLM, object-system README, indexes/DESIGNS.md, designs/README.md updated to the schema"
