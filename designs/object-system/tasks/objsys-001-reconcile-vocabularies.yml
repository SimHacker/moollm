# Ongoing: reconcile the object-system vocabularies.
# The canonical form: designs/object-system/SCHEMA.md
# The map of what grew and why: designs/object-system/VOCABULARY-CLUSTERS.md
# This task stays open across sessions. Each batch closes on its own; the task closes
# when `lint --strict` passes.

id: objsys-001
title: "Reconcile the organic YAML vocabularies into one normalized object schema"
why: >
  The object system is what we point Self people and HN readers at. A reader who finds
  `inherits:` meaning "my parents" in one file and "my children's defaults" in the next
  stops trusting the rest. One meaning per key, every spelling still accepted on read.
done_when: "python3 skills/prototype/scripts/resolve.py lint --strict"
# Each new rule gets a lint check before its migration starts, so the guard grows
# with the work.
priority: high
owner: null
source: designs/object-system/VOCABULARY-CLUSTERS.md
history:
  - { at: 2026-10-20, event: opened, by: don }
  - { at: 2026-10-20, event: decided, by: don, note: "inherits:, defaults:, hyphens in files" }
  - { at: 2026-10-20, event: decided, by: don, note: "flat files, no envelopes; UPPERCASE file implies its skill, scoped, latent by default; views have format* and subject*; git, not timestamps" }
  - at: 2026-10-20
    event: batch-done
    note: >
      174+1 ROOM.yml flattened by flatten.py (each verified: reparsed == old read as flat).
      Compiled adventure-4 before/after: 95 keys in 37 rooms that sat beside `room:` were
      being silently dropped by `data.get('room', data)` and now compile in. No room lost
      a key. examples/old/adventure-3/pub/ROOM.yml doesn't parse and stays for the
      unparseable batch.
  - { at: 2026-10-20, event: decided, by: don, note: "keep task, not action. goal = wanted state nobody claims; task inherits goal (a claimed goal); action = one queued step. done_when: is the one condition key" }
  - at: 2026-10-20
    event: batch-done
    note: >
      Work vocabulary. skills/task CARD inherits skills/goal (lint: 144 declaring, 259 refs).
      complete_when and research_complete_when -> done_when in goal, task, cauldron TREE and
      playbook template, postal, TECH-TREE; adventure.py compiles done_when and still reads
      complete_when; lint reports the old spellings (0 left). Goal stores events, computes
      state. action-queue says action, not task. task:/goal: wrappers flattened in both
      object-system task files, GOAL.yml.tmpl, TASK.yml.tmpl, and every task block of
      designs/gastown/TASKS-2026-01.md (3 unparseable blocks quoted first).
  - { at: 2026-10-20, event: decided, by: don, note: "facts, not verdicts: rooms state lighting, the grue decides whether to hunt; grue_safe: goes" }
  - { at: 2026-10-20, event: decided, by: don, note: "lighting: 0..10, comment modulates it (swinging bulb, colour, mood, time). GLANCE: core keys per subject type plus YAML Jazz that helps decide whether to look closer" }
  - { at: 2026-10-20, event: decided, by: don, note: "schema keys use underscores (k_lines, see_also, invoked_by, done_when); names of things use hyphens; foreign schemas keep theirs. Replaces 'hyphens in files'" }
  - { at: 2026-10-20, event: decided, by: don, note: "views are not slots of their subject; a skill gives instances slots through a prototype file named for the interface (skills/room/ROOM.yml), replacing <X>.yml.tmpl; methods and advertisements instances have move there" }
  - at: 2026-10-20
    event: batch-done
    note: >
      Parent spellings, 46 files (migrations/parents.py plus historical CARD and mind/soul
      docs). Resolver parents unchanged in 32 of 45 files; the 13 that changed were rooms and
      glances delegating to their containing directory, dispensers delegating to what they
      dispense, and the historical GLANCE. compile.py and validate.py count inherits: as an
      object marker, so instance files still compile, and maze/grue.yml and maze/wumpus.yml
      now compile too (unplaced). maze/CONTAINER.yml waits for the container rewrite.
  - at: 2026-10-20
    event: batch-done
    note: >
      Envelopes: 146 CARD.yml and 60 CHARACTER.yml flattened (flatten.py; tier/status
      duplicates removed by hand in 5). compile.py reads them through envelope.body, keeps a
      character's own type, and no longer compiles CARD/GLANCE views as objects.
  - at: 2026-10-20
    event: batch-done
    note: >
      Envelopes: the rest, 393 files (object: and 15 smaller wrappers). Compiled adventure-4
      loses nothing and gains 65 slots that sat beside the old envelopes. Flat objects
      are recognized by id + name; envelope.body treats a file with a top-level name as
      flat; CONTAINER.yml is not an object. Lint: 3 legacy spellings left.
  - at: 2026-10-20
    event: batch-done
    note: >
      Lighting. 129 ROOM/GLANCE files to 0..10 + comment (tasks/migrations/lighting.py, each
      reparsed, only lighting values and dropped keys differ); grue_safe, requires_light,
      ambient_light gone from rooms; room-h, room-j, back-alley, no-ai-overlord by hand; the
      Eye watches: true; lamp lighting: 6; grue CHARACTER owns the guard (2 or below, nothing
      lit brighter, nothing watching, no repellent buff); maze CONTAINER defaults lighting 0;
      room/container skill docs and context/runtime closure examples use world.room.lighting.
      adventure-4 compiles: 121 rooms, no grue_safe. dist/world.json is stale until recompiled.
  - { at: 2026-10-29, event: decided, by: don, note: "constitution §15: CARD is one file, concentrated not DRY; copy the important fields and methods of interface files down into CARD and GLANCE. §16: advertisements are the one behavior offer (reactions, provides/wants, skill relevance included; 'interest' means advertisement); prose compiles to _js, recurring patterns graduate to parameterized keys the engine runs" }
  - { at: 2026-10-29, event: decided, by: don, note: "one CARD per object, never split into aspect files (no ADVERTISEMENTS.yml); all of a directory's selfish-COM interfaces feed it; regular enough for orchestrators to filter and project by k-line activation and heat" }
  - at: 2026-10-29
    event: analyzed
    note: >
      Round 2, read as one CARD: designs/object-system/CARD-ANALYSIS.md (18 decisions).
      Advertisements are one concept (offers, triggers, skill relevance, provides/wants);
      the compiler drops list-form advertisements' names and fields (442 entries, 97 files)
      and compiles no map-form method (444); 3 of 321 _js slots filled, nothing graduated;
      graduation candidates listed. Survey: skills/prototype/scripts/behavior_survey.py.
  - { at: 2026-10-29, event: decided, by: don, note: "every standard key documents a sensible default; omitted means default (constitution §16). Character layers across repos are compatible, not DRY, each runnable alone, with relations declared and linted (§15)" }
  - at: 2026-10-29
    event: analyzed
    note: >
      Character layers across moollm, WillWrightShowForFood, DonHopkins, RepoShowPrivate,
      MicropolisCore: designs/object-system/CHARACTER-LAYERS-ANALYSIS.md (decisions L1-L12).
      522 CHARACTER.yml, 67 ids with several layers; seven parent spellings; consent level
      disagrees for bill-joy and scott-draves. Survey: skills/prototype/scripts/layers_survey.py.

# Measured by `resolve.py lint` after the work-vocabulary batch.
meter:
  objects_declaring_parents: 144
  parent_refs_to_files: 259
  latent_parent_refs: 14            # EDITH-BUNKER, NORM-CHEERS, GUINAN-TNG... intended
  broken_path_refs: 8               # skills/game, turtle, narrator, creature, companion
  implied_skills_found: 495         # 14 distinct skills
  implied_skills_latent: 673        # 199 distinct; GLANCE 347, INDEX 44, MECHANISM 21, RUN 13...
  slots_shadowing_children: 6       # troll stomach + inventory, wumpus instances, proc sims, robin personas + minds
  cycles: 0
  legacy_spellings: 662             # envelope object: 349, card: 148, character: 60, then small ones
  unparseable_yaml: 122

phases:
  - { id: survey,   status: done, out: "skills/prototype/scripts/vocab_survey.py" }
  - { id: clusters, status: done, out: "designs/object-system/VOCABULARY-CLUSTERS.md" }
  - { id: schema,   status: done, out: "designs/object-system/SCHEMA.md" }
  - { id: behavior, status: done, out: "designs/object-system/CARD-ANALYSIS.md, skills/prototype/scripts/behavior_survey.py" }
  - { id: alignment-plan, status: opened, out: "designs/object-system/ALIGNMENT-PLAN.md: schemas S1-S6, tools T1-T6, migrations M1-M11 and J1-J8 across moollm, wwsff, DonHopkins, MicropolisCore, RepoShowPrivate" }
  - id: resolver
    status: done
    out: >
      resolve.py: lookup, parents, lint --strict, stale. Implied scoped skill parents,
      views, file#path embedded addressing, catalog refs (source+id), envelopes read as
      flat, slot/child collisions, git-based staleness. flatten.py. 18 tests.
  - id: decide
    status: claimed
    open:
      - "broken skills/* parents: write the skills, or respell as K-lines?"
      - "tier: outside skills?"
      - "placement listing keys (objects:, characters:, residents:, contains:): retire, or hints linted against the directory?"
      - "when: (GLANCE) and invoke_when: (CARD): one key or two? (CARD-ANALYSIS.md section 5)"
      - "decisions 1-18 in CARD-ANALYSIS.md: one advertisement schema, graduated keys, copy-down, method core, card keys, projection lint"
      - "decisions L1-L12 in CHARACTER-LAYERS-ANALYSIS.md: core keys per layer, layer relations, cross-repo refs, consent"
  - id: migrate
    status: claimed
    # One batch per row, smallest blast radius first. Each batch: run, verify, rerun the
    # lint, record the meter in history.
    batches:
      - { scope: "kitten/puppy GLANCE biological parents: -> family:", files: 16, status: done }
      - { scope: "envelope room: in ROOM.yml", files: 175, status: done }
      - { scope: "work vocabulary: task inherits goal, done_when everywhere, task:/goal: wrappers", files: 33, status: done }
      - { scope: "envelope card: in CARD.yml", files: 146, status: done }
      - { scope: "skills/time/CARD.yml holds the whole card twice; merge by hand", files: 1, status: opened }
      - { scope: "envelope character: in CHARACTER.yml", files: 60, status: done }
      - { scope: "characters stating species or tags twice (ontology vs own slot, values differ); compile shows ontology's", files: 22, status: opened }
      - { scope: "compiled catalog table is empty (0 catalogs) in adventure-4", files: 0, status: opened, note: "already 0 at f2af097f; belongs with adventure-001" }
      - { scope: "envelope object: in object files", files: 349, status: done }
      - { scope: "small envelopes (catalog, system, adventure, mind, maze, run, ...)", files: 44, status: done }
      - { scope: "readers: drop data.get('room', data) fallbacks once no envelopes remain", files: 4, status: opened }
      - { scope: "skills/*/CHARACTER.yml meta.inherits + moollm/ prefix -> top-level inherits:", files: 8, status: done }
      - { scope: "prototype: {source, id} + inherits: {values} -> inherits: [FILE#*.id] and own slots", files: 8, status: done }
      - { scope: "dolly-forklift inherits: {archetype, source} -> lineage:", files: 1, status: done }
      - { scope: "skills/historical extends: -> CARD inherits: [skills/real-being]; GLANCE no longer delegates", files: 2, status: done }
      - { scope: "skills/container inherits: -> defaults:, docs + maze/CONTAINER.yml", files: 8, status: done }
      - { scope: "interface templates <X>.yml.tmpl -> prototype files <X>.yml (valid YAML, defaults + methods, comments for per-instance slots); done in each skill's rewrite", files: 45, status: opened, done: [container, room, character, object] }
      - { scope: "adventure compile.py: apply container defaults: to compiled rooms and objects", files: 1, status: opened, note: "belongs with adventure-001" }
      - { scope: "instance prototype: <ref> -> inherits: [<ref>]; dispensers' prototype: -> clones:", files: 13, status: done }
      - { scope: "room/glance parent: ../ (containment, already the directory) removed; mind parents: -> inherits: with mind and soul-city docs", files: 16, status: done }
      - { scope: "slots shadowing child directories", files: 6, status: opened }
      - { scope: "grue_safe: out of rooms; lighting: 0..10 + comment; grue guard; maze defaults: lighting 0; the Eye watches", files: 150, status: done }
      - { scope: "broken skills/* parents", files: 5, status: waiting-on-don }
      - { scope: "k-lines / klines / see-also / invoked-by -> k_lines / see_also / invoked_by (migrations/schema_keys.py)", files: 160, status: done }
      - { scope: "k_lines: split {activates, related} into k_lines list + related", files: 44, status: opened }
      - { scope: "references -> see_also", files: 38, status: opened }
      - { scope: "pre-existing duplicate keys (mother, cat-stroopwafel, henk, marieke, hannibal-chew, time CARD)", files: 6, status: opened }
      - { scope: "advertisements as list -> map", files: 13, status: opened }
      - { scope: "self-describing timestamps (created:, updated:) out of files; git has them", files: 15, status: opened }
      - { scope: "unparseable YAML: fix or mark as prose", files: 122, status: opened }
      - { scope: "defaults: outside CONTAINER.yml meaning a prototype's instance defaults (wumpus hazards BOTTOMLESS-PIT, SUPERBATS): make them the prototype's own slots", files: 2, status: opened }
      - { scope: "slots shadowing children: a slot and a child directory with the same name (don-hopkins inventory: and inventory/, troll stomach, robin personas, ...)", files: 7, status: opened }
      - { scope: "unparseable CHARACTER.yml still wrapped in character: (turing-chess slats)", files: 1, status: opened }
      - { scope: "docs and templates still showing room: wrappers (skills/room, container, skill, yaml-jazz, ...)", files: 20, status: opened }
  - id: views
    status: claimed
    done: "resolver gives views format* and subject*; `resolve.py stale` asks git (315 of 639 views older than their subject)"
    todo: >
      skills/glance (purpose, budget, how it points deeper) and skills/index written; each
      interface skill (room, character, skill, ...) names its glance core keys; skills/card's
      CARD-view role stated; lint checks budgets and core keys per subject type; 15
