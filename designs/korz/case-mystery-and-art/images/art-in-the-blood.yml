claim: >
  This document's title claims mystery and art are one mechanism differently configured.
  Doyle claims it outright in 1893: asked where his faculty comes from, Holmes credits not
  logic but inherited ARTISTIC temperament. Detection as a strange form of painting, from
  the man who invented the detective.

