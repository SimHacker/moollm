korz:
  the_claim: "detection and painting are ONE mechanism under different bindings, not two skills that rhyme"
  consequence: "the perspective panel and the Cubist panel were never separate arguments"

the_visual_argument: >
  The temptation is to draw Holmes, and it must be resisted — a deerstalker makes this a
  pastiche illustration rather than an argument. The claim is about EQUIPMENT and LINEAGE:
  the tools of detection are a painter's tools, held the same way, labelled the same way.
  So draw the kit, not the man. One palette, and the wells hold evidence instead of pigment.
  And one well holds blood, because the title says so.

