    - "the wells — and the slow realisation that none of them is paint"
    - "the colourman's labels naming each one in a fine hand"
    - "the easel behind it, holding a mounted evidence card where a canvas should be"
  subject: "a nineteenth-century artist's palette whose pigment wells contain forensic materials"
  composition: >
