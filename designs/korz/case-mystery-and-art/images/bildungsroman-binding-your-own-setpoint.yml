concept: bildungsroman-binding-your-own-setpoint
essay: ../README.md
claim: >
  Coming of age is BINDING YOUR OWN PURPOSE COORDINATE. The protagonist's purpose starts unbound —
  or bound by somebody else — and ends bound by them, which is closure, which is why the form reads
  as becoming a person rather than as learning a fact.

the_distinguishing_feature:
  # Don's definition, 19 Sep 2026, and it is the whole reason the plate looks like this.
  not: "merely coming of age"
  but: "THE PROTAGONIST IS FORMED BY THEIR ERRORS — the mistakes are the mechanism, not the obstacle"
  consequence_for_the_image: >
    Therefore the errors must be PRESENT, MOUNTED AND KEPT rather than corrected away. A plate
    showing only the finished competence would illustrate the wrong claim. The failures are the
    argument and they stay on the board.

lineage:
  term: "Bildungsroman — German, novel of formation"
  coined: "Karl Morgenstern, around 1810; popularised by Wilhelm Dilthey"
  archetype: "Goethe, Wilhelm Meister's Apprenticeship (1795-96)"
  the_line: [Jane Eyre, Great Expectations, A Portrait of the Artist as a Young Man, Invisible Man]
  the_pun_that_chose_the_register: >
    The archetype is an APPRENTICESHIP and the protagonist is named MEISTER. The guild vocabulary
    is sitting in the title of the founding text, so the register is the guild workshop.

register_decision:
  family: formation
  was: undecided — the other four registers all handle a moment, and this subject is duration
  now: >
    GUILD WORKSHOP — an apprentice's trial board. Oak, iron, steel maker's marks. Chosen because a
    sample board is TIME MADE INTO ONE OBJECT: a sequence of attempts, mounted together, readable in
    a single glance without a multi-panel construction. It is the only artifact I know that records
    a formation rather than a state.
  why_not_a_sequence_of_panels: "that is a storyboard, and it would break one_picture_one_concept"

korz:
  mechanism: "a coordinate transitioning from bound-by-another to bound-by-self"
  the_arc:
    early: "{whose_purpose: the_master} — work done to someone else's setpoint, competently or not"
    late: "{whose_purpose: self} — the same craft, now under a purpose the maker authored"
  closure: >
    Autopoietic closure, which is the structural form of Haig Shahinian's demand in the Kay thread:
    not is-someone-in-there but CAN A SYSTEM BIND ITS OWN PURPOSE COORDINATE. The Bildungsroman is
    the literary form whose entire subject is a yes to that question, arrived at slowly and through
    damage.
  the_physical_tell: >
    THE MAKER'S MARK IS THE BOUND COORDINATE. In the guilds you struck the master's mark while you
    were his; you were granted your own mark when you became a master. So the binding changing hands
    is a real historical practice and it is a small steel stamp. That is the plate.

the_visual_argument: >
  Two things must be legible and nothing else matters.
  ONE: the pieces get sounder from one end to the other, and the early ones are visibly WRONG —
  split, gapped, burnt, over-cut. They are kept anyway, mounted with the same care as the good one.
  TWO: the marks change. The early pieces carry an OLD WORN mark, struck by someone else. The final
  piece carries a DIFFERENT, FRESH, CRISPLY STRUCK mark. Same hand made all of them; only the last
  one is signed by that hand.
  If a viewer reads "practice makes perfect" the plate has failed. What it must say is "the errors
  were kept, and at the end the authority moved."

visual:
  read_order:
    - "a craftsman's board, photographed straight on, warm workshop light"
    - "a row of joined wood test pieces mounted on it, left to right"
    - "the leftmost are damaged and wrong; they get sounder as the eye travels"
    - "the last one is clean and complete"
    - "then the small struck steel marks — worn and identical on the early ones, a NEW one on the last"
  subject: "an apprentice's trial board of joinery test pieces, earliest failures to final master piece, with the maker's mark changing at the end"
  composition: >
    A single dark oak board, worn and waxed, hung on a workshop wall and photographed nearly
    straight on, filling the frame. Mounted across it in one row, evenly spaced with small iron
    brackets, SIX hand-cut joinery test pieces in pale wood — dovetails and mortise-and-tenon
    samples, each a small block of joined timber a hand's width across.
    LEFT TO RIGHT the work improves and the failures are explicit:
    1) a dovetail with the pins split clean off, the break fresh and unrepaired
    2) a joint with a visible gap you could pass a coin through, cut at the wrong angle
    3) scorched and over-worked, the shoulder crushed
    4) sound but coarse, tool marks everywhere, tearout on the grain
    5) close to right, one small proud shaving, a faint gap at one shoulder
    6) THE LAST ONE: exact, tight, glass-smooth, the joint invisible where it closes
    All six are mounted with equal dignity and equal care. Nothing is hidden, nothing is turned to
    face the wall, and the broken one is as carefully bracketed as the finished one.
    THE MARKS: pieces 1 through 5 each carry the SAME small struck steel maker's mark, worn and
    shallow from long use, stamped into the end grain. Piece 6 carries a DIFFERENT mark — crisp,
    deep, newly cut, unmistakably a different stamp — struck into the same position.
    Warm low raking light from the left across the board, so the struck marks read as impressions in
    the wood and the broken edges catch the light.
  palette: "dark waxed oak board, pale honey and straw-coloured test pieces, blackened iron brackets, one scorched brown piece, cold grey steel of the marks"
  light: "warm low raking workshop light from the left; hard enough to shadow the struck marks and the split"
  typography: >
    NO WORDS ANYWHERE. This is the one plate in the pile with no legible text, on purpose: the claim
    is a MARK rather than a word, and a mark that spelled something would become a label. The two
    stamps must be abstract device marks — a simple geometric punch, not initials, not letters.

constraints:
  must:
    - "SIX pieces, and the first three must be unmistakably FAILED — split, gapped, burnt. The errors are the mechanism"
    - "every piece mounted with equal care; the failures are exhibited, not tolerated"
    - "the first five share ONE worn mark; the sixth carries a DIFFERENT, freshly struck mark"
    - "both marks abstract geometric punches, not letters or initials"
    - "one continuous object, one board, one photograph"
  must_not:
    - "no text, no labels, no numbers, no dates, no title, no signature in writing"
    - "no human figure, no hands, no apprentice, no master"
    - "do not tidy or repair the failures; do not turn them away from the viewer"
    - "no arrows, no progression markers, no timeline graphics"
    - "not a storyboard, not panels, not a triptych — one board"
    - "no diploma, no certificate, no guild seal on paper"

