claim: >
  Two names resolve to one referent, and the tragedy is the DISCOVERY OF THE ALIAS rather than
  the identity. Oedipus the investigator and Oedipus the killer are the same coordinate the whole
  time. Every "you were the monster" reveal is this one bug.

second_claim:
  # Added 19 Sep 2026 when Don's shadowed/bright account made Oedipus the limiting case.
  what: "the play is built to be watched EXCLUSIVELY in the bright pass"
  why: "the Athenian audience knew the myth walking in — all of them, no exceptions"
  consequence: "dramatic irony is not a second-time bonus here; it is the only reading ever available"
  therefore: "the bright pass is not derivative or lesser. You can build the whole work for it."
  the_gift: >
    AND THE VENUE ENFORCES IT PHYSICALLY. Greek drama was performed outdoors in daylight, at the
    festival, in an open amphitheatre with no way to darken the house. You cannot stage a shadowed
    pass at midday in the sun. The architecture makes the lit reading the only available one, which
    is why this plate looks OUT at the audience instead of at the stage.

korz:
  mechanism: "aliasing — two paths, one object"
  the_bug: "{detective: oedipus} and {culprit: oedipus} are one binding wearing two names"
  why_it_is_a_bug_and_not_a_twist: >
    Nothing is substituted and nothing is withheld. The two references were always to the same
    thing; only the knowledge that they were is missing. Which is exactly the failure that makes
    aliasing hard in real programs: both paths are valid, both dispatch correctly, and the harm
    comes from the code assuming they are distinct.
  relation_to_whodunit_plate: >
    The diptych shows one text under two lightings. This shows one REFERENT under two names. The
    first is about the reader's context; the second is about the sea itself.

the_visual_argument: >
  Two moves, and neither may be dropped.
  ONE: the plate must point the camera the wrong way — out from the orchestra at a fully sunlit
  audience — because the argument is about who already knows, and in this theatre that is
  everybody, visibly, in daylight. Every other plate in this family looks at a stage. This one
  looks at the house, and the house is lit.
  TWO: the alias must be a physical impossibility rendered plainly. TWO labelled pegs, TWO cords,
  and ONE mask hanging from both. Not two masks that resemble each other — a single object with
  two names attached, which is the difference between a resemblance and an alias.

