claim: >
  Melodrama BINDS THE MORAL COORDINATE INTO THE OBJECT — the villain IS evil, the way the rose IS
  red. Tragedy LEAVES IT RELATIONAL — the act dispatches monstrous from this position, in this
  context, and would not from another. Antigone and Creon are both right along their own axes.

