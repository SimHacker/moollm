the_visual_argument: >
  Deliberately NOT a formal diptych — the whodunit plate already owns that construction, and
  repeating it would make these two plates argue the same way about different things. This is ONE
  photograph of ONE place: a scene-painter's dock with two flats leaning against the wall. One
  unified space, two objects in different material condition. The comparison is found in the room
  rather than imposed by a frame.
  The second move: the tragedy flat must give its two figures EQUAL dignity and EQUAL light, each
  casting a shadow across the other. Mutual shadow is the moral property living between them, which
  is a lighting fact and therefore native to this register.

