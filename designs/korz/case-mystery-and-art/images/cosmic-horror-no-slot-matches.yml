    - "the contradiction must be in the MEASUREMENTS and between the views, not in the rendering style"
    - "the classification entries must all be struck out; the labels must remain printed and readable"
    - "exactly one rubber stamp: NO SLOT MATCHES"
    - "same hand, same paper stock and same border treatment as the locked-room and as-any plates"
