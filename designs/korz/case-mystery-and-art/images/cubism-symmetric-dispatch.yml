# cubism-symmetric-dispatch — the girders
# Human surface: cubism-symmetric-dispatch.md  ·  Artifact: cubism-symmetric-dispatch.png
# Essay section: "Cubism is symmetric dispatch"

concept: cubism-symmetric-dispatch
essay: ../README.md
claim: >
  Renaissance perspective is single-receiver dispatch: one privileged station point, the
  picture composed TO a particular eye, every other viewpoint wrong. Cubism gathers the
  same object along several viewer coordinates at once and declines to make one dominant,
  which is Korz's central claim rendered in paint twenty years before Korzybski named the
  error and eighty before Ungar formalized it.

korz:
  perspective:
    dispatch: single-receiver
    guard: "{viewer: the_station_point}"
    everything_else: "a wrong answer"
  cubism:
    dispatch: symmetric
    guard: "silent on viewer, deliberately"
    dominant_decomposition: refused
  the_complaint: >
    "It doesn't look like anything" is exactly the Smalltalk programmer's complaint about a
    slot sea: WHERE IS THE OBJECT? Gathered, if you ask along an axis. Not before.

