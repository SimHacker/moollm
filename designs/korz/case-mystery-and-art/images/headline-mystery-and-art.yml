# headline-mystery-and-art — the girders
# Human surface: headline-mystery-and-art.md  ·  Artifact: headline-mystery-and-art.png
# Essay: the top of the document. Generated LAST, FROM the other ten.
# Family: none — or rather, ALL FOUR. The headline's register is "the room that holds the registers."

concept: headline-mystery-and-art
essay: ../README.md
must_be_last: true
claim: >
  Narrative forms are DISPATCH CONFIGURATIONS. A genre is which coordinate is left unbound and who
  holds the bindings — so the whole taxonomy in the essay is one cabinet, and the form you are
  reading is determined by which drawer is standing open and empty.

method:
  how: "generated with all ten plates passed as reference_image_paths"
  why: >
    Don's instruction: the headline is composed FROM the pile rather than guessed before it. Tip of
    the semantic and visual pyramid, the gather of gathers. Passing the plates as references is not
    decoration — the plates appear IN the room as objects, so the reference images are the subject.
  not_a_collage: >
    A grid of the ten would be a contact sheet, which is an index and not a synthesis. The headline
    has to make ONE claim the ten support. So the ten appear as what they are — plates, hung and
    propped and leaning in a working room — and the room's centrepiece states the thesis.

the_central_device:
  what: "a specimen cabinet of small drawers, each labelled with one interrogative"
  labels: [WHO, WHAT, WHEN, WHERE, WHY, HOW]
  the_move: >
    ONE drawer is pulled open and it is EMPTY. That is the entire essay in one object: every row of
    the mystery table is a different empty drawer, and the genre is the name of the gap.
  which_drawer: >
    WHY. Because the whydunit is the detective genre of the purpose dimension, because readers
    experience an unbound purpose as the least bearable of the gaps, and because purpose is the
    dimension this whole repo is arguing should exist
    (../../korz-prime/examples/purpose-dimension.md).
  why_words_are_allowed_here: >
    House style permits text only where the claim IS a word. The interrogatives ARE the claim —
    they are the axis names — so they are the one legitimate place for lettering in the pile.

why_the_room_is_the_right_form:
  moollm_reading: >
    A directory is a room and a room is an activation context. INDEX.yml is a gather over a flat
    pile; the room is that gather rendered. So the headline being a ROOM CONTAINING THE PLATES is
    not a visual conceit, it is the repo's own architecture drawn once.
  register_reading: >
    The four registers were deliberately different so the set would read as a book carrying plates
    from several traditions. A working room is the only container in which a survey plate, a gilt
    oil, a stage flat and a joiner's trial board can all sit without one of them being wrong. The
    room is why the registers can disagree.

visual:
  read_order:
    - "a working room, warm and dim, obviously someone's study and workshop at once"
    - "then the walls: technical survey plates pinned, gilt-framed oils hung, a painted stage flat leaning, a board of wooden joints"
    - "then the centre: a cabinet of small labelled drawers"
    - "then that ONE drawer, pulled out, and empty"
  subject: "a scholar-craftsman's working room holding all four registers, with an interrogative specimen cabinet at its centre, one drawer open and empty"
  composition: >
    A deep warm interior, evening, a single working lamp plus low window light. The room is plainly
    in use — not a gallery, not a museum, a place where the work happens.
    LEFT WALL: technical survey plates pinned up overlapping, aged cream paper, sepia ink,
    dimension arrows, one bearing a faded red diagonal stamp.
    BACK WALL: two or three gilt-framed Victorian oils hung properly, one a still life of small
    objects, one a triptych of three panels.
    RIGHT: a large painted theatrical scenery flat leaning against the wall, its paint craquelured
    and flaking at one edge; beside it, propped on the floor, a dark oak board with small pale
    wooden joinery test pieces mounted in a row on iron brackets.
    FOREGROUND CENTRE, the subject: a waxed mahogany specimen cabinet standing chest-high, with a
    grid of small shallow drawers, each with a brass frame holding a hand-lettered card. Six of the
    cards are legible. One drawer — not the corner one, one in the middle of the grid — is PULLED
    FULLY OUT and is EMPTY: bare wood inside, nothing in it, lined with felt, and a small
    rectangular void in the cabinet face where it came from.
    On the cabinet top, quiet and uncrowded: a magnifier, a pair of dividers, a folded paper.
    No people anywhere. The room has been left mid-work.
  palette: "warm lamplight, mahogany and oak browns, aged paper cream, gilt, one cold shaft from the window, a single note of faded red from the stamp"
  light: "one warm practical lamp low and to the right, raking across the cabinet face so the open drawer reads as a shadowed void; cool ambient from a window at the left"
  typography: >
    Six hand-lettered brass-framed drawer cards, legible: WHO · WHAT · WHEN · WHERE · WHY · HOW.
    The card on the OPEN and EMPTY drawer must read WHY.
    Nothing else in the image may carry legible text. Any lettering on the pinned plates must be
    illegible as text at this scale.

constraints:
  must:
    - "all four registers physically present: survey plates, gilt oils, a painted flat, a joinery board"
    - "ONE cabinet drawer pulled fully out and visibly EMPTY, its card reading WHY"
    - "the six interrogative cards legible; everything else in the room illegible"
    - "a WORKING room, warm and mid-use, not a museum and not a gallery"
    - "one coherent interior space with real depth — not a collage, not a grid, not panels"
  must_not:
    - "no people, no figure, no hands, no detective"
    - "no deerstalker, no pipe, no magnifying-glass-over-a-clue cliche, no trench coat"
    - "no collage or contact-sheet layout; the plates must be objects in a room with perspective"
    - "no glowing, no floating elements, no diagram overlays, no connecting lines between plates"
    - "no extra text: no title, no essay name, no author, no signage"
    - "do not make it tidy or symmetrical; a working room is asymmetric"

