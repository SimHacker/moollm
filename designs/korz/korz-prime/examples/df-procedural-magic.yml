  primary:
    dev_notes: { url: https://bay12games.com/dwarves/dev.html, why: "the roadmap Tarn maintains; myths and magic 'probably through the avenues of covens and religion'" }
    future_of_the_fortress: { what: "monthly Q&A where Tarn answers technical reader questions directly", jan_2026: "spheres of an item influence which magic is available; myth-generator remnants become artifacts" }
    gdc_2016: { what: "Tarn Adams with Tanya Short — procedurally generated mythology, myth generator demoed live", detail: "the cosmic egg's fragments become continents in the map generator", writeup: https://procedural-generation.isaackarth.com/2016/04/06/mythology-and-procedural-generation-no-one-seemed.html }
    pcgamer_magic_interview: { url: https://www.pcgamer.com/dwarf-fortress-creator-tarn-adams-talks-about-simulating-the-most-complex-magic-system-ever/, why: "the long interview quoted throughout — myth-first design, per-world effect sets, teleportation, rule flips" }
    pcgamer_creative_mode: { url: https://www.pcgamer.com/future-dwarf-fortress-creative-mode-will-let-you-sculpt-whole-worlds-create-homemade-gods/, quote: "\"The system like a giant debugger… it has to have an API that hooks into as much stuff as you can in the game. Can you make a love potion that would actually affect thoughts and relationships that already exist?\"" }
    kitfox_devlog: { url: "https://kitfoxgames.itch.io/dwarf-fortress/devlog/886081/next-steps-for-dwarf-fortress-patch-5105-dwarf-fortress-dev-news", why: "release sequencing; Lua upgrade as the Myth and Magic foundation" }

  the_best_source_is_code:
    what: "July 2025 scripting overhaul, driven largely by Putnam — procedural generation hard-coded for fifteen years, exposed as moddable Lua"
    exposed: [forgotten beasts, "divine curses (vampires, werebeasts)", divine items, "necromancers and their experiments", evil weather]
    tarn: "\"Now the algorithms and data are available for modding.\""
    source: https://www.pcgamer.com/games/sim/dwarf-fortress-just-made-it-easier-for-modders-to-add-their-own-procedural-creatures-items-curses-and-more-all-of-these-things-have-been-hard-coded-in-dwarf-fortress-inaccessible-to-modders-now-the-algorithms-and-data-are-available/
    why_it_is_the_next_step: "a procedural generator whose GUARD STRUCTURE you can read, in a scripting language, shipped inside the game"
    caveat: "⚠ install path and script shape unverified here — that is the first research action, not a claim"

  secondary:
    - "Blind — video essay on how procedural magic will change the game"
    - { url: https://dwarffortresswiki.org/index.php/Sphere, why: "the current coordinate vocabulary" }
    - "DFHack — its existence is evidence about which internals are addressable"

open:
  - { q: "Read the Lua: do the exposed generators dispatch on sphere-like coordinates, or switch on enumerated types?", stakes: "decides whether this example is a Korz READING or a Korz PROPOSAL" }
  - { q: "What is a sphere, formally?", note: "if item spheres determine available magic, spheres are the coordinate space and the lattice is enumerable" }
  - { q: "Does the myth generator produce a lattice or a story?", note: "Korz needs the former; Tarn describes narrative events with mechanical consequences, which may be the same thing from the other end" }
  - { q: "Is legislated order a TOURNAMENT artifact rather than a dispatch necessity?", why: "DF doesn't care about balance; Magic cares enormously and pays in layers" }

