    - "The overlap-the-card-you-supersede layout — designed, or did players start doing it?"
    - "Creepers in 4.0, out in 5.0. What did the retraction cost, and how do you decide a dimension is a mistake?"
    - "Looney Pyramids as a component platform other designers build games on — the same shape as a skill library. What makes a platform get adopted?"
