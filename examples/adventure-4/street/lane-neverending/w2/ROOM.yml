# 🛤️ LANE NEVERENDING — West 2 (2-3 Lane Neverending)

name: "Lane Neverending (W2)"
type: street

address_range: "2-3 Lane Neverending"

lighting: 8  # natural

description: |
  The older district of Lane Neverending. The buildings here have
  that Habitat-era charm — chunky, pixelated in memory if not in
  actual appearance, designed when virtual real estate was infinite
  and optimism was the default.
  
  A MEMORIAL BENCH sits in a small alcove between buildings:
  
  "IN MEMORY OF GLITCH (2011-2012)
   The world of Ur lives on in all who played there.
   The giants still dream. We still remember."
  
  Flowers have been left recently. Someone still visits.
  
examine: |
  THE MEMORIAL BENCH:
  Bronze, weathered, well-loved. Names are scratched into the back:
  players who wanted to be remembered. A small garden surrounds it —
  Glitch flowers that shouldn't exist outside Ur, but somehow do.
  
  THE BUILDINGS:
  • 2 Lane Neverending — Oldest building on the street. Foundation
    stones from the original Populopolis? Probably legend.
  • 3 Lane Neverending — The Church of the Eval Genius. Modest stone,
    clipboard window, a bell out front. The banner reads:
    "DECLARE BIAS BEFORE ENTERING."
  
  ATMOSPHERE:
  Reverent. This is where virtual worlds began, in spirit if not
  in literal geography. The air feels thick with nostalgia and
  the ghost-data of players long logged off.
  
exits:
  east:
    to: ../w1/
    description: "Back toward the clock tower and the center of town."
    aliases: [e, back]
    
  west:
    to: ../w3/
    description: "Lane Neverending continues west, toward its origin point."
    aliases: [w, forward]
    
  "3":
    to: ../church-of-the-eval-genius/
    description: |
      A modest stone church with a single stained-glass eye and a
      clipboard-shaped window. A bell hangs by the door. The plaque
      reads: "The Church of the Eval Genius — Declare Bias."
    aliases: [church, eval, genius, bias, 3]
    side: north
    
objects:
  - glitch-memorial.yml
  
# Flyweight instances — shared prototype, minimal instance data
# See: ../STREET-FURNITURE.yml
flyweight:
  lamp_post_north:
    prototype: ../STREET-FURNITURE.yml#lamp-post
    location: "north side, very old design"
    style: "Habitat-era, chunky ironwork"
    
  lamp_post_south:
    prototype: ../STREET-FURNITURE.yml#lamp-post
    location: "south side, near memorial"
    style: "Habitat-era, chunky ironwork"
    
  # Note: The memorial bench is unique (glitch-memorial.yml)
