room:
  name: "The Mirror Room"
  type: reflection
  
  description: |
    A quiet room with a single mirror and a small desk. The mirror
    reflects you, your rubric, and the cost of your claims.
    
  examine: |
    There is no sermon here. Only the mirror and a blank score sheet.
    
  exits:
    out:
      to: ../
      description: "Back to the nave."
      aliases: [back, nave]

  # Design documents this floor embodies. Read these to learn why the room is shaped this
  # way; stand here to learn what they mean. Backlink for the memory palace — the design
  # corpus already links in, so without this the rooms are orphans.
  # See designs/webtop/VIEW-STATE-AS-COMMENTARY.md
  learn:
    - doc: ../../../../../../designs/eval/EVALSELF-DESIGN.md
      why: "Self-evaluation as a design problem, not a mood"
    - doc: ../../../../../../designs/eval/CHURCH-EVAL-GENIUS-LANE-NEVERENDING.md
      why: "The Y-combinator pun: pass yourself to yourself until fixed point"
