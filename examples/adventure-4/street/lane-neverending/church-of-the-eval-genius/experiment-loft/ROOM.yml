room:
  name: "The Experiment Loft"
  type: lab
  
  description: |
    Tables full of run logs, test harnesses, and tiny simulations
    humming in the corner. The air is warm with the smell of
    freshly printed evidence.
    
  examine: |
    A chalkboard reads:
    "MEASURE. RUN. COMPARE. PUBLISH."
    
  exits:
    out:
      to: ../
      description: "Back to the nave."
      aliases: [back, nave]

  # Design documents this floor embodies. Read these to learn why the room is shaped this
  # way; stand here to learn what they mean. Backlink for the memory palace — the design
  # corpus already links in, so without this the rooms are orphans.
  # See designs/webtop/VIEW-STATE-AS-COMMENTARY.md
  learn:
    - doc: ../../../../../../designs/eval/EVAL-VS-SIM.md
      why: "Simulations kept warm — the genre boundary this floor works across"
