room:
  name: "The Audit Choir"
  type: review_hall
  
  description: |
    A circular room with tiered benches and a central lectern. The
    acoustics are tuned for debate. When people speak here, they
    tend to speak in turns.
    
  examine: |
    A small brass plaque reads:
    "Roberts Rules apply. The rubric is non-negotiable."
    
  exits:
    out:
      to: ../
      description: "Back to the nave."
      aliases: [back, nave]

  # Design documents this floor embodies. Read these to learn why the room is shaped this
  # way; stand here to learn what they mean. Backlink for the memory palace — the design
  # corpus already links in, so without this the rooms are orphans.
  # See designs/webtop/VIEW-STATE-AS-COMMENTARY.md
  learn:
    - doc: ../../../../../../designs/eval/CHURCH-EVAL-GENIUS-LITURGY.md
      why: "Liturgy and texts — the choir sings the rounds"
    - doc: ../../../../../../designs/eval/EVAL-FACTIONS.md
      why: "Contradictory reports held in tension rather than resolved"
