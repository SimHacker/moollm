# BOX: RAW INCARNATION TRANSCRIPT
# A DISPENSER. It holds a view of one document — framing, context, why-it-is-here — and it
# issues stamped souvenirs of that view. The object is not the document; several dispensers in
# several rooms may point at the same one, and a ref may drill down to a section.
# See designs/webtop/DISPENSERS-AND-SOUVENIRS.md

object:
  name: "Box: Raw Incarnation Transcript"
  type: [dispenser, document_reference, design_reference]
  emoji: "📦"
  portable: false         # the dispenser stays; what it issues does not

  ref:
    doc: ../../../../../../../designs/eval/eval-incarnate-design-chatgpt.txt
    why: "The unedited chat the framework was quarried from. Sealed. Obviously readable"

  description: |
    Box: Raw Incarnation Transcript — a sealed box holding `eval-incarnate-design-chatgpt.txt`.
    The unedited chat the framework was quarried from. Sealed. Obviously readable

  examine: |
    A sealed box, well stocked. Reading it here does not move the document; it shows you
    where the document lives and what this room thinks it is for.
    Take one — they are free, and yours will be stamped with this room.

  dispenses:
    souvenir: "Photocopy (unauthorized, obviously permitted): Raw Incarnation Transcript"
    weight: 0             # a reference, not a copy — see skills/inventory/
    ref:
      doc: ../../../../../../../designs/eval/eval-incarnate-design-chatgpt.txt
    stamp:                # what makes it a souvenir rather than a bookmark
      from_room: "The Sealed Stacks"
      from_dispenser: box-raw-transcript
      at: <now>
      issue: <next>
    redeemable: [read, cite, trade, place]

  actions:
    READ:
      description: "Read the referenced document"
      aliases: [read, open, examine, study]
      effect: |
        Reads ../../../../../../../designs/eval/eval-incarnate-design-chatgpt.txt
        Why it is shelved here: The unedited chat the framework was quarried from. Sealed. Obviously readable
    TAKE:
      description: "Take a stamped souvenir"
      aliases: [take, get, pocket, collect]
      effect: |
        You take a Photocopy (unauthorized, obviously permitted) of Raw Incarnation Transcript, stamped "The Sealed Stacks" with today's date
        and an issue number. Weight 0. The document stays where it is; the stamp
        remembers where you were standing.
