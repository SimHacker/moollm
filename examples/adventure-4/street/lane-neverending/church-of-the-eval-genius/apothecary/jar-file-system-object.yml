# JAR: FILE-SYSTEM-OBJECT
# A DISPENSER. It holds a view of one document — framing, context, why-it-is-here — and it
# issues stamped souvenirs of that view. The object is not the document; several dispensers in
# several rooms may point at the same one, and a ref may drill down to a section.
# See designs/webtop/DISPENSERS-AND-SOUVENIRS.md

object:
  name: "Jar: file-system-object"
  type: [dispenser, document_reference, skill_reference]
  emoji: "🫙"
  portable: false         # the dispenser stays; what it issues does not

  ref:
    doc: ../../../../../../skills/file-system-object/SKILL.md
    why: "The grammar that makes a directory an object — how this building is possible"

  description: |
    Jar: file-system-object — a shelf of bottles holding `SKILL.md`.
    The grammar that makes a directory an object — how this building is possible

  examine: |
    A shelf of bottles, well stocked. Reading it here does not move the document; it shows you
    where the document lives and what this room thinks it is for.
    Take one — they are free, and yours will be stamped with this room.

  dispenses:
    souvenir: "Sample vial: file-system-object"
    weight: 0             # a reference, not a copy — see skills/inventory/
    ref:
      doc: ../../../../../../skills/file-system-object/SKILL.md
    stamp:                # what makes it a souvenir rather than a bookmark
      from_room: "The Apothecary of Ambient Skills"
      from_dispenser: jar-file-system-object
      at: <now>
      issue: <next>
    redeemable: [read, cite, trade, place]

  actions:
    READ:
      description: "Read the referenced document"
      aliases: [read, open, examine, study]
      effect: |
        Reads ../../../../../../skills/file-system-object/SKILL.md
        Why it is shelved here: The grammar that makes a directory an object — how this building is possible
    TAKE:
      description: "Take a stamped souvenir"
      aliases: [take, get, pocket, collect]
      effect: |
        You take a Sample vial of file-system-object, stamped "The Apothecary of Ambient Skills" with today's date
        and an issue number. Weight 0. The document stays where it is; the stamp
        remembers where you were standing.
