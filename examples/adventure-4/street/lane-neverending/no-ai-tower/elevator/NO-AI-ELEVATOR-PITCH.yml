product:
  name: "NO-AI-ELEVATOR™"
  tagline: "Pimp Your Room — Expand Up and Down!"
  slogan: "An elevator pitch... FOR an elevator!"
  
# THE PITCH (You have 30 seconds)

elevator_pitch: |
  
  *DING* — You step into my elevator.
  
  "Nice place you got here. One room, right? Maybe two?"
  
  *The doors close.*
  
  "What if I told you that room could go UP? And DOWN?
   What if that closet became a PENTHOUSE?
   What if that basement became a DUNGEON?
   What if your CEILING became someone else's FLOOR?"
  
  *I press a button. We descend.*
  
  "You're not buying an elevator.
   You're buying VERTICAL REAL ESTATE.
   You're buying POSSIBILITIES.
   You're buying a RELATIONSHIP between spaces."
  
  *DING* — We arrive. Somewhere unexpected.
  
  "One room? No. You have INFINITE rooms.
   You just couldn't REACH them before."
  
  *The doors open.*
  
  "So... interested?"

