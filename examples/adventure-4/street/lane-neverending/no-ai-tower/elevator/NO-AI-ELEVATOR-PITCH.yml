# FEATURES

features:

  vehicle_semantics: |
    Your elevator is a VEHICLE, not just a room.
    
    - LEXICAL HOME: Where the elevator file lives (its definition)
    - DYNAMIC LOCATION: Where the elevator currently IS (changes!)
    
    Like a closure in programming. Like a TARDIS in space.
    
  the_lineage: |
    Your elevator inherits from the GREATS:
    
    - SimTower (1994) — The building goes DOWN
    - Turbolift (Star Trek) — Voice control, horizontal movement
    - TARDIS (Doctor Who) — Bigger on the inside, goes anywhere
    - Great Glass Elevator (Roald Dahl) — Up, down, sideways, SPACE
    
  muzak_system: |
    Every elevator needs a soundtrack.
    
    Default playlist:
    - "I'm Your Soul Man (instrumental)"
    - "Also Sprach Zarathustra (elevator version)"
    - "The Girl from Ipanema"
    - "Resistance is Futile (smooth jazz)"
    
    Customize with YOUR favorites.
    
  easter_eggs: |
    Built-in surprises:
    
    - ALL BUTTONS AT ONCE: Tower Overdrive mode
    - KONAMI CODE: Secret floor -12 appears (THE VOID)
    - STUCK BETWEEN FLOORS: Dramatic conversation opportunity
    
  sound_design: |
    *CLANG* — The brass gate slides shut
    *WHIRRRR* — The machinery engages
    *hummmmm* — Muzak plays softly
    *DING* — You've arrived
    *CLATTER* — The gate opens
    
    All sounds customizable.

