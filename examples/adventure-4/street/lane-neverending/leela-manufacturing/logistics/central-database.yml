  • Production records — every item processed
  • Inventory state — what's where, right now
  • Shipping manifests — every package tracked
  • Equipment logs — maintenance, status, history
  
  INTELLIGENCE  
  • Camera metadata — detections, poses, events
  • Sensor timeseries — temperature, pressure, flow
  • Quality metrics — pass/fail, measurements
  • Anomaly records — the interesting deviations
  
