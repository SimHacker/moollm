# CAMERA LOG1
# Leela's first eye — watching the logistics yard

id: camera-log1
name: "Camera LOG1"
type: sensor
emoji: "📹"

tags: [sensor, camera, video, self-observation, eye, logistics]

description: |
  A weatherproof camera mounted on a tall pole, its lens sweeping
  across the logistics yard. Wind, rain, or shine — it watches.
  This is LOG1: Leela's first eye, seeing the big picture.
  
examine: |
  CAMERA LOG1 — LEELA'S FIRST EYE
  
  ┌─────────────────────────────────────────┐
  │  📹 LOG1                                │
  │  ══════                                 │
  │                                         │
  │  Location: Logistics Yard, Tower Mount  │
  │  Status: 🟢 LIVE                        │
  │  Resolution: 4K @ 30fps                 │
  │  Feed: → VIDEO INTAKE (Floor 1)         │
  │                                         │
  │  "Leela watching Leela."                │
  └─────────────────────────────────────────┘
  
  The camera is mounted on the control tower, overlooking the
  entire logistics operation. It sees trucks, trains, drones,
  containers, and the flow of everything in and out.
  
  CURRENT VIEW:
  • Container Yard: 147/200 TEU occupied
  • Truck Yard: 6 trucks present
  • Rail Siding: 4 cars (1 loading)
  • Drone Pad: 3 drones charging, 2 in flight
  • Pigeon Loft: 24 pigeons (all home)
  
  The feed flows directly into the Video Intake pipeline
  on Floor 1. Every frame analyzed. Every container tracked.
  Every movement logged.
  
  Leela watches itself work.
  And learns.
  
  DETECTED IN LAST HOUR:
  • 2,341 object detections
  • 847 container movements
  • 23 "TRUCK_ARRIVING" events
  • 18 "TRUCK_DEPARTING" events
  • 47 "DRONE_LANDING" events
  • 12 "DRONE_LAUNCHING" events
  • 1 "PIGEON_CONTEMPLATING" event (normal)
  
properties:
  designation: "LOG1"
  nickname: "First Eye"
  location: "Logistics Yard, Control Tower"
  resolution: "4K"
  fps: 30
  pan_range: 360
  tilt_range: 90
  night_vision: true
  weather_resistant: true
  self_referential: true
  
state:
  status: "live"
  recording: true
  streaming_to: "floor-1/conveyor-system"
  current_pan: 45
  current_tilt: 25
  uptime: "847 days"
  frames_captured: 2198476800
  
feeds_to:
  pipeline: "../floor-1/conveyor-system.yml"
  line: "V"
  description: "Video Intake (Purple containers)"
  
methods:
  WATCH:
    description: "View the live feed"
    effect: |
      You see what LOG1 sees:
      
      The logistics yard spreads out below — a carefully
      organized chaos. Container stacks in colorful towers.
      Trucks queuing at the docks. A train idling on the siding.
      Drones buzzing overhead like mechanical bees.
      
      And in the pigeon loft, one bird pauses mid-step,
      head tilted, as if thinking about the nature of flight.
      
  PAN:
    description: "Pan the camera"
    parameters:
      direction: "left | right | degrees"
    effect: "Camera pans smoothly. New view. New insights."
    
  TILT:
    description: "Tilt the camera"
    parameters:
      direction: "up | down | degrees"
    effect: "Camera tilts. Perspective shifts."
    
  ZOOM:
    description: "Zoom in or out"
    parameters:
      level: "1x to 10x"
    effect: "Details emerge. Container labels. License plates. Pigeon expressions."
    
  STATUS:
    description: "Check camera status"
    effect: |
      LOG1 STATUS
      Uptime: 847 days
      Frames captured: 2,198,476,800
      Current feed: LIVE → Floor 1 Pipeline
      Last detection: 0.1 seconds ago
      Health: EXCELLENT
      Weather: Clear, 22°C
      
ambience:
  sounds:
    - "Soft whirr of the gimbal motor"
    - "Faint click as it refocuses"
    - "Distant truck engines"
    - "Train horn (when arriving)"
    - "Drone hum overhead"
  visual:
    - "Green LED pulses slowly — watching"
    - "Lens catches sunlight, glints occasionally"
    - "Slight sway in wind (stabilized)"
    
lore: |
  LOG1 was the first camera installed when Leela Manufacturing
  opened. It has watched every delivery, every shipment,
  every container movement across this yard.
  
  When the self-observation pipeline was activated, LOG1
  became special: it was Leela's first eye looking at itself.
  
  The philosophical implications are... still being processed.
  (Cell G is working on it.)
  
  LOG1 has seen:
  • 47,823 trucks come and go
  • 12,456 train cars loaded and unloaded
  • 892,341 drone flights
  • 1 pigeon achieve enlightenment
