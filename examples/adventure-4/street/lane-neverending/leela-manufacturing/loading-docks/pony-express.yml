  │                                                             │
  │  "Neither rain, nor snow, nor dragons of unusual size..."   │
  └─────────────────────────────────────────────────────────────┘
  
  INTEGRATION WITH LEELA LOGISTICS
  
  The Pony Express is fully integrated with the modern
  Leela Logistics network:
  
  HANDOFF POINTS:
  • Incoming: Modern deliveries arrive at Loading Docks
    → Sorted → Transferred to Carriage House
    → Loaded onto appropriate horse transport
    → Dispatched to rustic realms
    
  • Outgoing: Rustic realm packages arrive by horse
    → Received at Carriage House
    → Logged in Central Database (yes, PostgreSQL)
    → Transferred to modern logistics
    → Continue via drone/truck as appropriate
  
  TRACKING:
  • All shipments tracked in PostgreSQL TimescaleDB
  • Rider check-ins at waypoints (carrier pigeon relay)
  • Estimated arrival calculated by route + weather + horse
  • Real-time status: "Last seen: Enchanted Forest waypoint 3"
  
  THE BEAUTY OF IT:
  Packages flow seamlessly between worlds.
  A customer in a medieval kingdom orders from the Leela catalog.
  Drone flies to the realm boundary.
  Pony Express takes it from there.
  Delivered to the castle gate by rider.
  
  Modern efficiency meets traditional reliability.
  
  ROUTES & SCHEDULES
  
  ROUTE: MEDIEVAL KINGDOM CIRCUIT
  • Leela → Castle Gate → Village Square → Tower → return
  • Frequency: Daily departure at dawn
  • Vehicle: Standard Carriage (C2)
  • Duration: 3 days round trip
  • Hazards: Bandits (low), weather (moderate)
  
  ROUTE: ENCHANTED FOREST EXPRESS
  • Leela → Forest Edge → Waypoint 1-5 → Elf Settlement
  • Frequency: Every 3 days
  • Vehicle: Rider Courier (speed essential)
  • Duration: 2 days one way
  • Hazards: Getting lost (high), magic (unpredictable)
  • Note: Iron horseshoes cause problems. Use brass.
  
  ROUTE: FRONTIER STAGECOACH LINE
  • Leela → River Crossing → Desert Pass → Frontier Town
  • Frequency: Weekly
  • Vehicle: Stagecoach (C3) with armed guard
  • Duration: 5 days one way
  • Hazards: Outlaws (high), terrain (rough)
  • Note: Strongbox included. Sheriff notified.
  
  ROUTE: VILLAGE CIRCUIT
  • Leela → Hamlet A → Village B → Farm C → Hamlet D → return
  • Frequency: Twice weekly
  • Vehicle: Pony Cart (C1)
  • Duration: 2 days round trip
  • Hazards: Muddy roads (seasonal), curious geese (persistent)
  
  PERSONNEL
  
  DISPATCH MASTER: Henry Minskison
  • Former stagecoach driver, bear trainer, 30 years experience
  • Knows every route, every waypoint, every innkeeper
  • Coordinates with Old Jareth (Stable Master)
  • Desk in the Carriage House, next to the tack room
  
  RIDERS:
  • Swift Sam — Fastest courier, rides Shadowmere
  • Steady Eddie — Never lost a package, prefers Epona
  • Dusty Rhodes — Frontier specialist, handles outlaws
  • Young Clara — Apprentice, eager, learning the routes
  
  GUARDS (Stagecoach runs):
  • Big Mike — Intimidating presence, rarely needs weapon
  • Sharpshooter Sue — Exactly what it sounds like
  
philosophy: |
  WHY PONY EXPRESS IN A WORLD OF DRONES?
  
  Because not every realm has WiFi.
  Because some forests eat technology.
  Because dragons think drones are snacks.
  Because some customers PREFER a rider at their gate.
  
  ACME tried automated delivery everywhere.
  Their drone got turned into a toad in the Enchanted Forest.
  Their truck sank in the Swamp of Despair.
  Their "smart anvil" was last seen orbiting a wizard's tower.
  
  Leela adapts. Some realms need horses.
  We have horses. We have riders. We deliver.
  
  The modern and traditional, working together.
  That's the Leela way.
  
