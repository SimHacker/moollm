# PONY EXPRESS DELIVERY SERVICE
# Traditional logistics for rustic and historic adventure realms
# "When drones can't fly and trucks can't drive, we ride."

id: pony-express
name: "Leela Pony Express"
type: service
emoji: "🐎📬"

tags: [delivery, logistics, horses, traditional, fantasy, dnd, rustic, historic]

operated_from: carriage-house.yml
integrated_with: ../logistics/ROOM.yml

description: |
  The LEELA PONY EXPRESS — traditional delivery logistics for realms
  where modern technology fears to tread.
  
  Medieval kingdoms. Enchanted forests. Wild west frontiers.
  Dragon-haunted mountain passes. Places where drones get
  eaten and trucks sink in swamps.
  
  Headquarters: The Carriage House at Leela Manufacturing
  Motto: "Neither rain, nor snow, nor dragons of unusual size..."
  
examine: |
  LEELA PONY EXPRESS — RUSTIC DELIVERY LOGISTICS
  
