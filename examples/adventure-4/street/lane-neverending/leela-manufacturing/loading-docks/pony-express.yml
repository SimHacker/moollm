  │  • Carriage Standard — Medium loads, 3-5 day regional       │
  │  • Stagecoach Route — Heavy cargo, scheduled runs           │
  │                                                             │
  │  STATUS: 🟢 OPERATIONAL                                     │
  │  RIDERS ON DUTY: 4                                          │
