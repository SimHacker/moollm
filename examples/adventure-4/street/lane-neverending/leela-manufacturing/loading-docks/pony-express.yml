integration:
  database: ../logistics/central-database.yml
  coordinator: ../logistics/ROOM.yml
  vehicles: carriage-house.yml
  
  handoff_protocol: |
    MODERN → PONY EXPRESS:
    1. Package arrives at Loading Docks (any modern method)
    2. Sorted by destination realm
    3. If realm is "rustic" → flag for Pony Express
    4. Transfer to Carriage House
    5. Henry assigns route and vehicle
    6. Package loaded, manifest updated in PostgreSQL
    7. Rider departs with tracking ID
    
    PONY EXPRESS → MODERN:
    1. Rider arrives at Carriage House with incoming
    2. Packages logged in (Old Jareth or Henry)
    3. Entered into Central Database
    4. Transferred to Loading Docks
    5. Continue via drone/truck/pneumatic as appropriate
    
  tracking: |
    All Pony Express shipments tracked in PostgreSQL:
    • shipment_id, origin, destination, route
    • vehicle_type, rider_assigned, horse_assigned
    • departed_at, last_waypoint, last_checkin
    • estimated_arrival, actual_arrival
    • status: [dispatched, in_transit, waypoint_N, delivered, returned]
    
    Waypoint check-ins via:
    • Carrier pigeon (most common)
    • Magical sending stone (enchanted forest routes)
    • Telegraph (frontier routes, where available)
    • Runner relay (short distances)
    
lore: |
  The Pony Express was established when Leela realized that
  not all customers live in places with roads, electricity,
  or breathable atmosphere for drones.
  
  The first shipment was to a wizard's tower. The drone
  got zapped by a ward. The truck couldn't climb the
  floating island. Henry suggested horses.
  
  "Horses don't care about wards," he said. "They just
  want oats and a pat on the nose."
  
  The wizard got his package. He tipped the rider in
  enchanted horseshoes. Those horseshoes are now on
  Shadowmere, which explains a few things.
  
  Since then, the Pony Express has delivered to:
  • 47 castles
  • 12 enchanted forests
  • 8 dragon lairs (exterior delivery only)
  • 3 underwater kingdoms (waterproof packaging required)
  • 1 floating city (long ladder involved)
  • Countless villages, hamlets, and frontier towns
  
  ACME still hasn't figured out how to deliver to these places.
  Their painted tunnel doesn't work in realms without walls.
  
methods:
  DISPATCH:
    description: "Send a shipment via Pony Express"
    parameters:
      to: "Where it's going"
      package: "What's being sent"
      service: "rider, cart, carriage, or stagecoach"
      urgency: "standard or rush"
    effect: |
      Henry reviews the request...
      Checks route availability...
      Assigns rider and vehicle...
      
      "Package dispatched! Tracking ID: PE-[number]"
      "Estimated arrival: [days] days"
      "Rider: [name] on [horse]"
      
  TRACK:
    description: "Check status of a Pony Express shipment"
    parameters:
      tracking_id: "The PE-[number] from dispatch"
    effect: |
      Checking PostgreSQL...
      
      SHIPMENT: [tracking_id]
      Status: [status]
      Last waypoint: [location]
      Last check-in: [time]
      Estimated arrival: [date]
      Rider: [name]
      Horse: [horse_name]
      
  SCHEDULE_PICKUP:
    description: "Request pickup from a rustic realm"
    parameters:
      location: "Where to pick up"
      package: "What's being collected"
      date: "When to arrive"
    effect: |
      Henry schedules the pickup...
      
      "Rider will arrive at [location] on [date]."
      "Please have package ready and accessible."
      "Carrier pigeon confirmation will be sent."
      
  CHECK_ROUTES:
    description: "See current route status"
    effect: |
      PONY EXPRESS ROUTE STATUS
      
      Medieval Circuit: 🟢 Running
      Enchanted Express: 🟡 Delayed (fog in forest)
      Frontier Line: 🟢 Running
      Village Circuit: 🟢 Running
      
      Next departures:
      • Medieval: Tomorrow, dawn
      • Enchanted: 2 days
      • Frontier: 4 days
      • Village: Tomorrow, afternoon
      
