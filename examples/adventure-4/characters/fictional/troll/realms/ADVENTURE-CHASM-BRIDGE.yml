# ADVENTURE REALM — the chasm bridge corner, mirrored inside Two-Toll
# adventure-mind's home turf as interior memory palace. Not all of
# Colossal Cave — the chasm, the bridge he prices, the audit spot
# beneath, dilated one move into the canonical neighbors: the winding
# corridor that delivered customers (entrance), the long corridor they
# left through (exit), and the fork where their fates divided. Beyond,
# white mist: memory ends where he never went. Reality-capture style —
# the scene that matters, walkable, fuzzed where the recording ends.

realm:
  name: "The Rickety Bridge (interior mirror)"
  mind: ../minds/adventure-mind.yml
  game: "Colossal Cave Adventure (Crowther & Woods, 1977)"
  mirrors: "the chasm crossing and its canonical neighborhood, dilated one move"
  retreat: "location: realms/ADVENTURE-CHASM-BRIDGE.yml#beneath-the-bridge"

rooms:
  winding-corridor:
    role: entrance   # how the customers arrived, wallets full
    description: |
      A long winding corridor sloping out of sight in both directions.
      Downhill leads to the chasm; uphill fades into mist. In memory
      this is the sound of business approaching: footsteps with that
      particular clink of carried treasure. He could price a customer
      by the clink alone, three bends before they arrived.
    exits:
      down: sw-side-of-chasm
      up: MIST     # toward Bedquilt and the rest of the cave — not his beat

  sw-side-of-chasm:
    description: |
      One side of a large, deep chasm. A heavy white mist rising up
      from below obscures all view of the far side. A rickety wooden
      bridge extends across, vanishing into the mist. The sign reads:
      "STOP! PAY TROLL!" He painted it himself. Twice — the first
      apostrophe placement was wrong.
    exits:
      up: winding-corridor
      cross: rickety-bridge
      down: beneath-the-bridge

  rickety-bridge:
    description: |
      Outside, this is an EDGE — his location is a rule, one treasure
      per crossing. Inside, the bridge is a ROOM: he can stand on his
      own crossing with nobody coming and nothing owed. A border
      guard's inner life. The planks creak in load-bearing memory of
      exactly one bear.
    exits:
      sw: sw-side-of-chasm
      ne: ne-side-of-chasm
      down: beneath-the-bridge   # not recommended; that's what the bridge is FOR

  ne-side-of-chasm:
    description: |
      The far side, where customers went after paying. In memory it is
      always slightly disappointing — they never looked back, never
      waved. Repeat business is courteous; gratitude is extra.
    exits:
      cross: rickety-bridge
      ne: long-corridor

  long-corridor:
    role: exit-hall
    description: |
      A long corridor leading away from the chasm. A faint rumbling
      noise can be heard in the distance — the volcano, doing its
      volcano accounting. Paid customers walked this way with their
      lighter packs, footsteps fading toward the fork. He knows this
      corridor entirely by ear.
    exits:
      sw: ne-side-of-chasm
      east: fork-in-path

  fork-in-path:
    role: branching   # where the customers' fates divided; both prongs are ellipses
    description: |
      The path forks here, and this is as far as his knowledge goes —
      everything past it is hearsay reconstructed from returning
      customers. The left fork climbs toward warm walls and the
      rumble: the ones who went left came back sweating and
      talking about a breath-taking view. The right fork leads toward
      the barren room: the ones who went right came back fast, pale,
      and once — ONCE — with the bear. Both prongs end in mist. The
      right one ends in mist that lumbers.
    exits:
      back: long-corridor
      left: MIST    # warm walls, the breath-taking view, the volcano — hearsay
      right: MIST   # the barren room. NEVER AGAIN. The mist stays. He checks it, though.

  beneath-the-bridge:
    description: |
      Where he stepped out from during the golden eggs incident — the
      audit office. Cool, dark, acoustically perfect for hearing
      "fee fie foe foo" spoken anywhere on the span above. The ledger
      lives here in memory: every crossing, every treasure, one entry
      marked RECALLED in a hand that still shakes slightly.
    exits:
      up: sw-side-of-chasm

boundary:
  MIST: |
    Heavy white mist marks the edge of the realm — the same mist that
    obscured the far side, repurposed as a property line. It is the
    ellipsis of the quotation and the fuzz at the edge of the reality
    capture: the recording ends here. The bear is somewhere beyond the
    right-hand prong. The mist stays.
