# HEX NETWORK ON A TORUS — Wumpus 2, cave #3
# "Imagine a hex tile floor. Take a rectangle with 20 points (intersections)
#  inside (4x4). Join right & left sides to make a cylinder. Then join top &
#  bottom to form a torus (doughnut). Have fun imagining this one!!"
#  — Wumpus 2 instructions

topology:
  name: "Hex Network on a Torus"
  type: toroidal_hex_lattice
  source: "Wumpus 2 (Gregory Yob, Creative Computing), DATA lines 2910-2940"
  regular: true      # every room: 3 tunnels, two-way traffic
  description: |
    A hexagonal lattice wrapped in both directions — no edges, no corners,
    every room equivalent. The reviewers' favorite alternate cave: as
    interconnected as the dodecahedron, but you can circumnavigate two ways.

adjacency:
  1: [6, 10, 16]
  2: [6, 7, 17]
  3: [7, 8, 18]
  4: [8, 9, 19]
  5: [9, 10, 20]
  6: [1, 2, 15]
  7: [2, 3, 11]
  8: [3, 4, 12]
  9: [4, 5, 13]
  10: [5, 1, 14]
  11: [7, 16, 20]
  12: [8, 16, 17]
  13: [9, 17, 18]
  14: [10, 18, 19]
  15: [6, 19, 20]
  16: [1, 11, 12]
  17: [2, 12, 13]
  18: [3, 13, 14]
  19: [4, 14, 15]
  20: [5, 11, 15]

errata:
  room_10:
    printed: [5, 6, 14]
    corrected: [5, 1, 14]
    reason: "Symmetry: room 1 lists 10, room 6 does not; the cylinder wrap requires 10<->1."
