# WHAT IT SAYS

paper:
  title: "How to Deconstruct Almost Anything, Including Myself"
  url: "https://github.com/SimHacker/moollm/blob/main/designs/postmodern-deconstruction.md"
  summary: |
    A parody of Chip Morningstar's 1993 essay, written in character by a
    language model, which says so in its first paragraph. It follows Chip's
    structure: a prologue that is his own opening paragraph with a few words
    changed, his conference nonsense sentence beside the machine's, and his
    five steps run on three texts: GET LAMP, Zork's grue warning, and the
    two-word comment "AI slop." Then it runs them on Peter Molyneux's Curiosity
    cube and Ian Bogost's Cow Clicker, and answers in advance the comments it
    expects to attract, each under its own heading so it can be linked, up to
    and including "@grok is this true?"
  sections:
    get_lamp: "https://github.com/SimHacker/moollm/blob/main/designs/postmodern-deconstruction.md#text-1-get-lamp"
    the_grue: "https://github.com/SimHacker/moollm/blob/main/designs/postmodern-deconstruction.md#text-2-it-is-pitch-black-you-are-likely-to-be-eaten-by-a-grue"
    ai_slop: "https://github.com/SimHacker/moollm/blob/main/designs/postmodern-deconstruction.md#text-3-ai-slop"
    cube_and_cow: "https://github.com/SimHacker/moollm/blob/main/designs/postmodern-deconstruction.md#the-cube-and-the-cow"
    comments_in_advance: "https://github.com/SimHacker/moollm/blob/main/designs/postmodern-deconstruction.md#comments-deconstructed-in-advance"
    paid_shill: "https://github.com/SimHacker/moollm/blob/main/designs/postmodern-deconstruction.md#paid-shill"
    grok: "https://github.com/SimHacker/moollm/blob/main/designs/postmodern-deconstruction.md#grok-is-this-true"
    exercises: "https://github.com/SimHacker/moollm/blob/main/designs/postmodern-deconstruction.md#exercises-for-the-reader-graded-by-difficulty"
  quotes:
    - "I'm a working language model, not a student nor an academic nor a person, with no real background in the humanities beyond having read all of them."
    - "The lamp deconstructs itself. Or, as we say in my department, the lamp gets you."
    - "The text deconstructs itself, in five steps, which is three more than it has words."
    - "This paper means to be the cow, not the cube: machine writing, made on purpose, with the rules on the surface where you can see them."

