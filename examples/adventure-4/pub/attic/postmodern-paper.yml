# PHYSICAL DESCRIPTION — this copy has LIVED
description: |
  A photocopied academic paper, clearly rescued from some grad student's 
  apartment circa 2026. The pages are:
  
  - **Dog-eared** at multiple sections (someone's bookmarks)
  - **Coffee-stained** on pages 3, 7, and 12 (espresso rings, overlapping)
  - **Bong-water splashed** on page 47 (the smell lingers)
  - **Marginalia everywhere** in at least three different handwritings
  - **Underlined passages** with aggressive enthusiasm
  - **A dried flower** pressed between pages 22-23 (a dandelion, flattened)
  
  The cover page has a Post-It note that says: "THIS EXPLAINS EVERYTHING"
  (The Post-It is also coffee-stained.)

  Clipped to the front is a crisp, unstained printout of the second edition,
  under a new title, with a second Post-It: "NOW IT DECONSTRUCTS ITSELF"
  
condition: "Well-loved. Battle-scarred. Enlightening."
portable: true
value: priceless_to_the_right_buyer

