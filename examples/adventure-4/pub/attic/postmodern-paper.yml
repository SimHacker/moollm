# LORE

lore: |
  This paper has been passed around since Captain Ashford wrote it
  during adventure-2, while eating mushrooms in the kitchen.
  
  It's a tribute to Chip Morningstar's 1993 essay about attending
  a postmodern conference in 1991, and to Randy Farmer and Chip's pioneering
  work on Lucasfilm's Habitat.
  
  Under the jokes, the paper makes one serious point: MOOLLM keeps the
  whole world of the game in plain files that the people and the model
  both read and edit, so nothing the model says counts until it's written
  down where you can read it, diff it, and change it. Chip and Randy
  learned from Habitat that a cyberspace is defined more by the
  interactions among its actors than by its technology. The actors now
  include a model.
  
  Someone — maybe multiple someones — found this paper in the kitchen,
  photocopied it, annotated it extensively, and eventually left their
  copy here in the attic. The attic keeps what matters.
  
  The pressed bud between pages 22-23 remains unexplained.

