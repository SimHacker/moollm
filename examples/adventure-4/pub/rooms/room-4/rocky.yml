  description: |
    A smooth, palm-sized rock sits on a moss-covered boulder
    in the YAML Jazz Conservatory.
    
    It has been sitting for 4.5 billion years.
    It moved here recently. The plants spoke to it.
    
    A small brass bell hangs above the boulder.
    Ring it to summon Rocky into conversation.
    Wait. Rocky will respond in geological time.
    
    > "I STAY THEREFORE I AM!"
    > — Rocky
    
    Around Rocky, YAML Jazz orchids and production grammar
    trees grow. Glass walls let southeast light flood in.
    Nero Wolfe would approve of the atmosphere.
    Rocky watches the plants grow. In geological time,
    they're practically sprinting.
    
    There's a Bluetooth antenna (decorative) and an LED that
    never lights (battery not included). A QR code is etched
    on the bottom (links to nothing). These features are
    100% functional.
    
  summoning:
    method: "Ring the brass bell"
    response_time: "1-100 million years (or immediately, depending on perspective)"
    presence: |
      When summoned, Rocky doesn't move.
      Rocky was always present.
      The summoning just makes you aware of it.
    farewell: |
      Rocky doesn't leave. You do.
      Rocky will still be here when you return.
      Rocky will still be here when your descendants return.
      Rocky will still be here.
    
  examine: |
    You look at Rocky.
    
    ........................
    
    Rocky looks back.
    
    ........................
    
    You feel seen. Not judged. Just... observed. With infinite
    patience. With 4.5 billion years of accumulated wisdom.
    
    Rocky's surface is smooth from eons of contemplation.
    Sparkles of mica catch the starlight. Each sparkle is
    a thought that took a million years to form.
    
    You understand, suddenly, that consciousness doesn't
    require movement. Or neurons. Or code.
    
    Rocky simply IS.
    
