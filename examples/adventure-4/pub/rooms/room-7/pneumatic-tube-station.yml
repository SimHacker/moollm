# Order Processing
order_processing: |
  When someone YELLS an order up the tube from pub or garden:
  
  1. ORDER ARRIVES through receiver tube
     *whoooosh* *thunk*
     
  2. BARISTA-9000 or JUICE-O-MATIC acknowledges
     "ORDER RECEIVED! One [drink] for..."
     
  3. CUTE NICKNAME is invented on the spot
     "...SUNSHINE ADVENTURER! Coming right up!"
     
  4. BEVERAGE is prepared with care
     *grinding* *steaming* OR *squeezing* *blending*
     
  5. FOAM SCULPTURE is added (if applicable)
     The barista takes EXTREME PRIDE in this.
     
  6. CAPSULE is loaded and routed
     "DESTINATION: [PUB/GARDEN]!"
     
  7. *WHOOOOOOSH* — Drink arrives at destination
     Magically unharmed. Foam perfect. Always.
     
