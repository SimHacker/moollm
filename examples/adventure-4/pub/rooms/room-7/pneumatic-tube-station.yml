# Foam Magic
foam_magic: |
  Drinks arrive MAGICALLY UNHARMED by pneumatic delivery.
  
  The foam sculptures survive:
  - 90-degree turns
  - 50 mph tube velocity
  - Gravity changes
  - Common sense
  
  Theories:
  - "PRECISION ENGINEERING" (barista's claim)
  - Enchanted tubes
  - Structural foam
  - Reality bends for good coffee
  - Don't ask, just drink
  
foam_sculptures:
  description: "Each drink arrives with unique foam art"
  examples:
    coffee:
      - "A foam grue (surprisingly cute)"
      - "Your face, in milk foam (unsettling accuracy)"
      - "A foam treasure chest"
      - "A foam map of the maze (changes daily)"
      - "A foam Mother, looking proud"
      - "A foam version of your current costume"
      - "Abstract foam representing 'the concept of hope'"
      
    juice:
      - "Citrus wedge garnish (perfectly balanced)"
      - "Fruit slice art (edible)"
      - "A tiny umbrella (always)"
      
    smoothie:
      - "Whipped cream mountain"
      - "Berry face (two berries for eyes)"
      - "Swirl patterns (Instagram-worthy)"
      
    icey:
      - "Snow sculpture on top"
      - "Frozen fruit topper"
      - "Crystalline patterns in the ice"
      
# Queue Management
queue: |
  Orders are delivered IN ORDER, first come first served.
  
  The speaker announces:
  "THREE ORDERS AHEAD OF YOU, PATIENT HERO!"
  "YOUR DRINK IS NEXT, ALMOST-CAFFEINATED ONE!"
  "INCOMING TO [DESTINATION], WORTHY VESSEL OF BEVERAGE!"
  
k_lines:
  activates:
    - DELIVERY
    - COFFEE
    - JUICE
    - BOOTSTRAP
    - SERVICE
    - PNEUMATIC
