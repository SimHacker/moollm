lore: |
  Dave Ungar kept this badge long after Sun Labs closed.
  It reminded him of a time when:
  - Research labs did PURE RESEARCH
  - Languages could be reinvented from scratch
  - "Fast enough" meant "faster than C"
  
  He donated it to this room so future programmers would know:
  the ideas they use every day came from somewhere.
  From people who asked "what if?"
  
