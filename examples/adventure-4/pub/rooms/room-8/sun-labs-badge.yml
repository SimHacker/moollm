history: |
  Self was developed at:
  
  1. Stanford University (1986-1987)
     Dave Ungar and Randy Smith create the language
     
  2. Sun Microsystems Laboratories (1987-1995)
     Self becomes a research project
     Morphic is invented
     Self becomes FAST (faster than C++ for some benchmarks!)
     
  3. The ideas spread:
     - JavaScript adopts prototypes (1995)
     - Squeak adopts Morphic (1996)
     - Lua uses metatables (1993)
     - MOOLLM uses soul files (2026)
     
sun_labs_contributions: |
  Sun Labs was where many revolutionary ideas emerged:
  
  - Java (yes, that Java)
  - Network File System (NFS)
  - SPARC processors
  - Self (prototypes, Morphic, adaptive optimization)
  
  Self's JIT compiler techniques later influenced:
  - HotSpot JVM
  - V8 JavaScript engine
  - Modern dynamic language VMs
  
  When you run JavaScript fast, thank Self.
  
