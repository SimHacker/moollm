# HUNT THE WUMPUS — Adventure-4 Maze Game State
#
# This file configures the Hunt the Wumpus game for THIS maze.
# All game rules, mechanics, and lore live in the character directory.
#
# 🎲 THE CHARACTER IS THE GAME
#
#   characters/fictional/wumpus-snorax/CHARACTER.yml — The soul
#   characters/fictional/wumpus-snorax/GAME.yml — Complete game rules
#   characters/fictional/wumpus-snorax/topologies/ — The boards, as interchangeable plugins
#     DODECAHEDRON.yml is cave 0 and the default; INDEX.yml is the manifest
#   characters/fictional/wumpus-snorax/sources/wumpus1-yob.bas — Original 1973 BASIC
#   characters/fictional/wumpus-snorax/hazards/SUPERBATS.yml — Super-bat hazard
#   characters/fictional/wumpus-snorax/hazards/BOTTOMLESS-PIT.yml — Pit hazard

inherits: ../characters/fictional/wumpus-snorax/CHARACTER.yml

# MAZE-SPECIFIC GAME STATE
# Only override what's specific to THIS game session

game_session:
  network: adventure-4-maze
  started: 2026-01-20
  status: active
  
# HAZARD PLACEMENTS — Where things are in THIS maze

hazards:
  wumpus:
    instance: room-e/wumpus.yml
    lair: room-e
    state: sleeping
    
  pits:
    - room: room-d
      note: "Bottomless pit in the dark room"
    # The maze waits. More pits hunger for the careless.
    # 🍄 DONNA: "Now THAT'S threatening. Very dark. TREMENDOUS."
    
  bats:
    - room: null  # The caves echo with distant wings. They're watching.
    # 🍄 DONNA: "'Add when needed'? WEAK! Now they're OMINOUS. You're welcome."
    
  grue:
    prototype: ./grue.yml
    status: "everywhere dark, parallel game"

# PLAYER STATE — For the current hunt

player_state:
  arrows: 5
  arrows_fired: 0
  location: null     # Set when game starts
  mapped_rooms: []
  
# WUMPUS STATE — Snorax in this maze

wumpus_state:
  name: Snorax the Patient
  current_lair: room-e
  state: sleeping
  awake_since: null
  eaten_count: 0
  arrows_dodged: 0
  trust_level: 0     # For BEFRIEND path
  
# TURN LOG — Game history

turns: []
# Format:
#   - turn: 1
#     room: room-a
#     action: MOVE NORTH
#     warnings: []
#     result: "Entered room-b"

# QUICK REFERENCE

invoke:
  - '"PLAY WUMPUS" — Start the hunt in this maze'
  - '"HUNT WUMPUS" — Same thing'
  - '"SHOOT [direction]" — Fire an arrow'
  
see_also:
  character: ../characters/fictional/wumpus-snorax/
  rules: ../characters/fictional/wumpus-snorax/GAME.yml
  instance: room-e/wumpus.yml
  parallel_game: ./grue.yml
