# 📔 THE MATCHBOOK COLLECTION
# Mail-in offers that actually WORK — tribute to Zork's Donald Woods stamp
# Found scattered in the kitchen drawers

name: Matchbook Collection
type: mail_in_offers
portable: true
location: kitchen/counter (in the middle drawer)

description: |
  A small stack of matchbooks held together with a rubber band.
  Each one has advertisements and mail-in offers on the cover.
  They smell faintly of sulfur and nostalgia.
  
  These aren't just fire-starters — they're OPPORTUNITIES.
  Mail them to receive stamps, brochures, and prizes!
  
examine: |
  You flip through the matchbooks. Each one is from a different
  establishment, each with a different mail-in offer:
  
  📔 SPELUNKER TODAY — "Mail this matchbook for a FREE SUBSCRIPTION!"
  📔 ADVENTURER'S GUILD — "Join the Guild! Send this for membership info!"
  📔 LAMP OIL PREMIUM — "Quality oil since 1876!"
  📔 GRUE MUTUAL INSURANCE — "Because darkness happens."
  📔 MYSTERIOUS MATCHBOOK — No label. Just an address.
  
  Plus a few others in worse condition...
  
# THE MATCHBOOKS (Individual items)

