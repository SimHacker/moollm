# ACTIONS

actions:
  EXAMINE-MATCHBOOKS:
    description: "Look through the collection"
    effect: "Lists all matchbooks with condition and offers"
    
  TAKE-MATCHBOOK:
    usage: "GET [matchbook name] / TAKE SPELUNKER MATCHBOOK"
    effect: "Specific matchbook goes to inventory"
    
  LIGHT-MATCH:
    usage: "LIGHT MATCH / STRIKE MATCH"
    effect: "Provides brief light. Consumes one match."
    warning: "Don't do this near lamp oil or in coal gas rooms!"
    
  MAIL-MATCHBOOK:
    usage: "MAIL [matchbook] / SEND [matchbook]"
    effect: |
      The matchbook disappears into the postal system.
      In 3-5 turns, check the START ROOM MAILBOX for your prize!
      
# WHERE TO FIND MORE

other_matchbook_locations:
  - "maze/room-j/ — Vending machine dispenses occasional matchbooks"
  - "coatroom/ — In some costume pockets"
  - "maze/room-i/ — The skeleton has a few"
  - "Random drops — Grues sometimes carry them (ironic)"
  
# TOM'S OPINION

tom_opinion: |
  "Tom has memorized all mail-in offers."
  "Tom recommends mailing ALL matchbooks immediately."
  "Tom calculates: 5 stamps = 5 lousy points = WORTH IT."
  "Tom notes: Some stamps are RARER than others. Some take longer to arrive."
  "Tom wants the complete collection. Tom is OBSESSED."
  
# LINEAGE

lineage: |
  Direct tribute to Zork's legendary mail-in mechanic.
  
  In the original Zork, players could find a matchbook from
  "Spelunker Today" magazine. If mailed (in real life!), Infocom
  would send a brochure containing the "One Lousy Point Donald
  Woods Stamp" — a tribute to the co-creator of Adventure.
  
  This mechanic expands that single easter egg into a full
  collectible system, honoring all the founders of interactive
  fiction while providing actual gameplay rewards.
  
  The stamps are worth "one lousy point" each — but the history
  they represent is priceless.
